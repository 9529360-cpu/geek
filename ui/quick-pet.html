<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>快捷宠物</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; font-family: "Microsoft YaHei", system-ui, sans-serif; user-select: none; }
  body { height: 100vh; }

  /* 圆球态：SVG 猫 */
  #ball {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    cursor: grab;
    background: transparent;
    transition: transform .12s;
    overflow: visible;
  }
  #ball:active { transform: scale(.94); cursor: grabbing; }
  #ball svg { width: 104px; height: 104px; filter: drop-shadow(0 6px 14px rgba(120, 80, 30, .25)); }

  /* 气泡：猫时不时冒出来的话（窗口加高时显示在猫上方） */
  #bubble {
    position: absolute;
    left: 50%; top: 6px;
    transform: translateX(-50%);
    max-width: 190px;
    background: #fff;
    border: 2px solid #ffb45c;
    border-radius: 12px;
    padding: 7px 11px;
    font-size: 11.5px;
    color: #5a4a35;
    line-height: 1.45;
    box-shadow: 0 4px 14px rgba(120, 80, 30, .18);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s, transform .25s;
    z-index: 5;
    white-space: pre-line;
  }
  /* 气泡显示时：猫沉到底部，气泡在顶部，互不遮挡 */
  #ball.bubble-show { align-items: flex-end; padding-bottom: 6px; }
  #bubble::after {
    content: '';
    position: absolute; left: 50%; bottom: -7px;
    transform: translateX(-50%);
    border: 7px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(-3px); }

  /* 猫走动动画：左右摇摆 + 身体弹跳（像真的在走） */
  #cat-anim { display: inline-block; }
  #cat-anim.walk { animation: walkBob .5s ease-in-out infinite; }
  @keyframes walkBob {
    0%, 100% { transform: translateX(0) translateY(0) rotate(0deg); }
    20% { transform: translateX(-10px) translateY(-3px) rotate(-5deg); }
    45% { transform: translateX(-5px) translateY(0) rotate(0deg); }
    70% { transform: translateX(10px) translateY(-3px) rotate(5deg); }
    90% { transform: translateX(5px) translateY(0) rotate(0deg); }
  }
  #cat-anim.sleep { animation: sleepBreath 2.4s ease-in-out infinite; }
  @keyframes sleepBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(.985, 1.02); }
  }

  #ball .badge {
    position: absolute; top: 2px; right: 2px;
    background: #ff5c7a; color: #fff; font-size: 10px; font-weight: bold;
    min-width: 18px; height: 18px; border-radius: 9px;
    display: none; align-items: center; justify-content: center;
    padding: 0 5px; font-family: "Courier New", monospace;
  }

  /* 展开面板：暖色像素风 */
  #panel {
    position: absolute; inset: 0;
    background: #2b2340;
    border: 3px solid #ffb45c;
    border-radius: 10px;
    box-shadow: 0 0 0 3px #1d1730, 0 10px 34px rgba(10,10,30,.5);
    display: none; flex-direction: column;
    overflow: hidden;
  }
  #panel .head {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 12px;
    background: #ffb45c; color: #4a2f14; font-size: 13px; font-weight: bold;
  }
  #panel .head .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .head button {
    background: rgba(74,47,20,.12); border: 1.5px solid #4a2f14; color: #4a2f14;
    border-radius: 6px; padding: 2px 9px; font-size: 11.5px; cursor: pointer;
    font-family: inherit;
  }
  #panel .head button:hover { background: rgba(74,47,20,.22); }

  #cats { flex: 1; overflow-y: auto; padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; align-content: start; }
  #scripts { flex: 1; overflow-y: auto; padding: 6px; display: none; }
  .cat-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    border: 1.5px solid #453a63; border-radius: 8px;
    cursor: pointer; font-size: 12.5px; color: #f0ecff;
    background: #3a3055;
    min-width: 0;
    transition: background .12s, border-color .12s;
  }
  .cat-item:hover { border-color: #ffb45c; background: #4a3d6e; }
  .cat-item .n {
    margin-left: auto; font-size: 10.5px; color: #a99fc8;
    background: #2b2340; border-radius: 8px; padding: 0 7px;
  }
  .script-item {
    padding: 7px 10px; margin-bottom: 4px;
    border: 1.5px solid #453a63; border-radius: 8px;
    cursor: pointer; font-size: 12px;
    background: #3a3055; color: #f0ecff;
    display: flex; align-items: center; gap: 8px;
    transition: background .12s, border-color .12s;
  }
  .script-item:hover { border-color: #ffb45c; background: #4a3d6e; }
  .script-item .zh { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .script-item .en {
    max-width: 55%; font-size: 10.5px; color: #7fd0ff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .script-item.clicked { background: #5a4a8a; border-color: #7fd0ff; }
  .script-edit { border: 0; background: transparent; color: #a99fc8; cursor: pointer; font-size: 10.5px; }
  .script-edit:hover { color: #fff; }
  .empty { padding: 18px; text-align: center; color: #a99fc8; font-size: 11.5px; line-height: 1.8; }
  #back { margin-right: 2px; }
</style>
</head>
<body>
  <div id="ball" title="点一下打开话术 · 按住拖动移动">
    <div id="cat-anim">
      <svg viewBox="0 0 120 120" width="104" height="104" xmlns="http://www.w3.org/2000/svg">
        <!-- 尾巴 -->
        <path d="M96 96 Q116 88 112 70 Q110 60 118 52" stroke="#3a3a3a" stroke-width="7" fill="none" stroke-linecap="round"/>
        <!-- 后脚 -->
        <ellipse cx="40" cy="106" rx="14" ry="8" fill="#f5f5f5"/>
        <ellipse cx="80" cy="106" rx="14" ry="8" fill="#f5f5f5"/>
        <!-- 身体 -->
        <ellipse cx="60" cy="88" rx="34" ry="26" fill="#f5f5f5"/>
        <!-- 身体黑斑 -->
        <ellipse cx="42" cy="84" rx="13" ry="10" fill="#2b2b2b"/>
        <circle cx="80" cy="92" r="9" fill="#2b2b2b"/>
        <!-- 肚皮 -->
        <ellipse cx="60" cy="96" rx="18" ry="11" fill="#ffffff"/>
        <!-- 前爪 -->
        <ellipse cx="45" cy="103" rx="10" ry="6" fill="#f5f5f5"/>
        <ellipse cx="75" cy="103" rx="10" ry="6" fill="#f5f5f5"/>
        <!-- 左耳（白耳黑内） -->
        <polygon points="28,34 18,6 46,20" fill="#f5f5f5"/>
        <polygon points="30,30 24,13 43,23" fill="#2b2b2b"/>
        <!-- 右耳 -->
        <polygon points="92,34 102,6 74,20" fill="#f5f5f5"/>
        <polygon points="90,30 96,13 77,23" fill="#2b2b2b"/>
        <!-- 头 -->
        <ellipse cx="60" cy="44" rx="34" ry="30" fill="#f5f5f5"/>
        <!-- 头顶黑斑（奶牛猫标志） -->
        <ellipse cx="60" cy="24" rx="18" ry="12" fill="#2b2b2b"/>
        <ellipse cx="44" cy="30" rx="8" ry="7" fill="#2b2b2b"/>
        <!-- 眼睛（默认睁开，黑圈白底黑瞳） -->
        <circle id="eyeL" cx="48" cy="42" r="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
        <circle id="eyeR" cx="72" cy="42" r="8" fill="#ffffff" stroke="#2b2b2b" stroke-width="1.5"/>
        <circle id="pupL" cx="48" cy="42" r="3.6" fill="#2b2b2b"/>
        <circle id="pupR" cx="72" cy="42" r="3.6" fill="#2b2b2b"/>
        <circle id="hlL" cx="50" cy="39" r="1.6" fill="#fff"/>
        <circle id="hlR" cx="74" cy="39" r="1.6" fill="#fff"/>
        <!-- 鼻子 -->
        <path d="M60 52 L56 57 Q60 60 64 57 Z" fill="#e85d6a"/>
        <!-- 嘴 -->
        <path d="M56 58 Q60 63 60 63 Q60 63 64 58" stroke="#2b2b2b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- 胡须 -->
        <path d="M32 50 Q20 46 12 48" stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M32 58 Q20 58 12 62" stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M88 50 Q100 46 108 48" stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M88 58 Q100 58 108 62" stroke="#999" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="badge" id="ball-badge">0</span>
    <div id="bubble"></div>
  </div>
  <div id="panel">
    <div class="head">
      <button id="back" style="display:none">◀</button>
      <span class="title" id="panel-title">快捷话术</span>
      <button id="import-scripts" title="导入 标签｜中文｜翻译文">导入</button>
      <button id="export-scripts" title="导出 标签｜中文｜翻译文">导出</button>
      <button id="add-script" title="添加话术">＋</button>
      <button id="close">收起</button>
    </div>
    <div id="cats"></div>
    <div id="scripts"></div>
  </div>
<script src="quick-pet.js"></script>
</body>
</html>
