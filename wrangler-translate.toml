name = "geek-translate"
main = "scripts/geek-translate-entry.js"
compatibility_date = "2026-08-16"
compatibility_flags = ["enable_request_signal"]
workers_dev = true

[triggers]
crons = [ "*/5 * * * *" ]

[ai]
binding = "AI"

[[d1_databases]]
binding = "geek_subscriptions"
database_name = "geek-subscriptions"
database_id = "1e78a93a-36de-43db-88aa-4551f9991200"

# Required secrets (set with `wrangler secret put`, never commit values):
# - GEMINI_API_KEY
# - MISTRAL_API_KEY
# - OPENROUTER_API_KEY
# - GROQ_API_KEY
# - JWT_SECRET (must match geek-subscription)
# Optional variable:
# ALLOWED_ORIGIN = "https://geek.bbnba.com"
