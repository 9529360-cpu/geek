plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bbnba.geek.mobile.spike'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bbnba.geek.mobile.debug'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-spike'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.spike'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
