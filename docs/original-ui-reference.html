<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>原版HelloWorld UI参考</title><link rel="stylesheet" href="../resources/pragmaz-ext/1.7_0/css/pragmaz.min.css"><link rel="stylesheet" href="../resources/pragmaz-ext/1.7_0/js/public/feather/iconfont.css"><style>body{background:#dfe3e8;padding:24px;font-family:Arial,"Microsoft YaHei",sans-serif}.ref-grid{display:grid;grid-template-columns:548px 620px;gap:26px;align-items:start}.ref-window{background:#ececec;box-shadow:0 15px 20px rgba(0,0,0,.25);border-radius:2px;overflow:hidden}.ref-title{font-weight:700;background:#fafafa;border-bottom:1px solid #eee;padding:14px 18px;color:#222}.ref-body{padding:0 0 14px;max-height:850px;overflow:auto}.ref-footer{background:#fff;border-top:1px solid #eee;padding:10px 14px;text-align:right}.ref-footer .btn{margin-left:6px}.selectize-mock{min-height:38px;border:1px solid #ced4da;border-radius:.25rem;background:#fff;padding:5px 7px;color:#777}.selectize-mock .item{display:inline-block;background:#e8edff;border:1px solid #acbdff;color:#3051d3;border-radius:3px;padding:3px 7px;margin:2px}.drop-mock{height:118px;border:2px dashed #ced4da;border-radius:4px;background:#fafafa;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#8a8a8a}.range-mock{height:6px;background:#dee2e6;border-radius:3px;position:relative;margin:15px 10px}.range-mock:before{content:"";position:absolute;left:15%;right:30%;height:6px;background:#3051d3}.range-mock i,.range-mock b{position:absolute;top:-6px;width:18px;height:18px;border-radius:50%;background:#3051d3}.range-mock i{left:14%}.range-mock b{right:29%}.group-tabs .nav-link{padding:.55rem .72rem}.mini-stat{margin-bottom:0!important}.compact-card .card-body{padding:.55rem}.original-note{font-size:11px;color:#888;margin-top:4px}</style></head><body><div class="ref-grid">
<section class="ref-window"><div class="ref-title">群发消息</div><div class="ref-body msgautomaticaaberta">
<div class="card mt-3 mr-3 ml-3 compact-card"><div class="card-body"><div class="custom-control custom-switch mt-1"><input type="checkbox" class="custom-control-input" id="sched" checked><label class="custom-control-label font-weight-normal" for="sched">设置定时发送日期与时间</label><span class="badge badge-success ml-2" style="background:#06d755">新功能</span></div><input class="form-control mt-2" value="选择多个日期和时间"></div></div>
<div class="card mr-3 ml-3"><div class="card-body">
<div class="card mb-3"><div class="card-header" style="background:#acbdff"><h5 class="m-0 font-size-14"><a class="text-dark"><strong>已保存消息 ⤵️</strong></a></h5></div><div style="background:#dae3f5;padding:8px 10px"><span class="badge badge-soft-primary mr-1">早上问候</span><span class="badge badge-soft-primary mr-1">客户跟进</span></div></div>
<h4 class="header-title">消息内容</h4><button class="badge badge-primary mb-1"><i class="mdi mdi-content-save mr-1"></i>保存消息</button><textarea class="form-control mt-2" rows="3" style="height:95px" placeholder="你好 %nc，最近还好吗？"></textarea>
<div class="row align-items-center"><h4 class="header-title ml-2 mr-2 mt-2">插入变量</h4><a class="badge badge-primary mt-2 mb-2 mr-1" style="background:#740dec;color:#fff">问候语</a><a class="badge badge-primary mt-2 mb-2 mr-1" style="color:#fff">联系人名称</a><a class="badge badge-primary mt-2 mb-2 mr-1" style="color:#fff">真实昵称</a><div class="col-sm-4 ml-auto"><a class="badge badge-warning mt-2 mb-2" style="float:right;background:#ff9935">ⓘ 创建多版本消息</a></div></div>
<div class="custom-control custom-switch mt-1"><input type="checkbox" class="custom-control-input" id="files" checked><label class="custom-control-label" for="files">添加图片/视频/文件</label></div><div class="drop-mock mt-2"><i class="mdi mdi-cloud-upload-outline" style="font-size:35px"></i><strong>拖放文件到这里</strong></div><div class="mt-2"><span class="badge badge-pill badge-primary mr-2">添加文字消息</span><span class="badge badge-pill badge-primary mr-2">添加电子名片</span></div>
<div class="custom-control custom-switch mt-2"><input type="checkbox" class="custom-control-input" id="mention"><label class="custom-control-label" for="mention">在消息中@全体群成员</label><span class="badge badge-success ml-2" style="background:#06d755">新功能</span></div></div></div>
<div class="card mr-3 ml-3"><div class="card-body"><h4 class="header-title">发送至</h4>
<div class="custom-control custom-radio"><input type="radio" class="custom-control-input" id="r1" checked><label class="custom-control-label" for="r1">联系人和群组</label><div class="selectize-mock mt-2"><span class="item">客户群A ×</span><span class="item">客户群B ×</span><span class="item">李涛 ×</span></div><div class="mt-1"><span class="badge badge-primary">保存列表</span><span class="badge badge-danger">清除</span></div></div>
<div class="custom-control custom-radio mt-2"><input type="radio" class="custom-control-input" id="r2"><label class="custom-control-label" for="r2">粘贴联系人号码</label><span class="badge badge-success ml-2">新功能</span></div>
<div class="custom-control custom-radio mt-2"><input type="radio" class="custom-control-input" id="r3"><label class="custom-control-label" for="r3">Excel 文件（*.XLSX）或（*.CSV）</label></div>
<div class="custom-control custom-radio mt-2"><input type="radio" class="custom-control-input" id="r4"><label class="custom-control-label" for="r4">向所选群组成员私聊发送</label></div>
<div class="custom-control custom-radio mt-2"><input type="radio" class="custom-control-input" id="r5"><label class="custom-control-label" for="r5">同一标签下的所有联系人</label></div>
<div class="custom-control custom-radio mt-2"><input type="radio" class="custom-control-input" id="r6"><label class="custom-control-label" for="r6">排除联系人 / 排除群组 / 全部联系人和群组</label></div></div></div>
<div class="card mr-3 ml-3"><div class="card-body"><h4 class="header-title">每个联系人/群组的发送间隔</h4><div class="range-mock"><i></i><b></b></div><div class="text-muted small">3 秒 — 10 秒</div></div></div></div><div class="ref-footer"><button class="btn btn-light">关闭</button><button class="btn btn-primary">发送</button></div></section>
<section class="ref-window"><div class="ref-title">群组工具</div><div class="ref-body corpo">
<div class="col-xl-12 mt-2"><div class="card bg-primary mini-stat position-relative"><div class="card-body"><div class="mini-stat-desc"><div class="text-white pb-2" style="font-size:.8rem">使用群组工具快速管理群组<h6 class="text-uppercase verti-label text-white-50" style="font-size:.5rem;top:30px"><strong>HelloWorld</strong></h6></div><div class="mini-stat-icon"><i class="mdi mdi-tools display-2"></i></div></div></div></div></div>
<div class="card mt-3 mr-3 ml-3"><div class="card-body" style="padding:.55rem"><ul class="nav nav-pills group-tabs" role="tablist"><li class="nav-item"><a class="nav-link active"><i class="mdi mdi-settings-transfer-outline mr-1"></i>聊天设置</a></li><li class="nav-item"><a class="nav-link"><i class="mdi mdi-account-group mr-1"></i>指令</a></li><li class="nav-item"><a class="nav-link"><i class="mdi mdi-location-enter mr-1"></i>输入链接</a></li><li class="nav-item"><a class="nav-link"><i class="mdi mdi-content-duplicate mr-1"></i>克隆</a></li><li class="nav-item"><a class="nav-link"><i class="mdi mdi-home-edit-outline mr-1"></i>编辑</a></li><li class="nav-item"><a class="nav-link"><i class="mdi mdi-radioactive mr-1"></i>销毁</a></li></ul>
<div class="tab-content p-3"><div class="tab-pane active mt-3"><div class="custom-control custom-switch mb-2"><input type="checkbox" class="custom-control-input" id="g1" checked><label class="custom-control-label" for="g1">离开群组后自动删除聊天</label></div><div class="custom-control custom-switch mb-2"><input type="checkbox" class="custom-control-input" id="g2" checked><label class="custom-control-label" for="g2">被移出群组后自动删除聊天</label></div><div class="custom-control custom-switch mb-2"><input type="checkbox" class="custom-control-input" id="g3" checked><label class="custom-control-label" for="g3">收到群链接自动加入</label></div></div>
<div class="mt-4"><h5 class="header-title">克隆群组（原版页）</h5><p>粘贴群组邀请链接，复制名称、简介、头像和群设置。</p><div class="input-group"><input class="form-control" placeholder="https://chat.whatsapp.com/xxxx"><div class="input-group-append"><button class="btn btn-primary">克隆</button></div></div><label class="mt-3"><strong>克隆数量</strong></label><div class="range-mock"><i></i><b></b></div><label><strong>每次克隆间隔</strong></label><div class="range-mock"><i></i><b></b></div></div></div></div></div></div><div class="ref-footer"><button class="btn btn-light">关闭</button><button class="btn btn-primary">保存/执行</button></div></section>
</div></body></html>
