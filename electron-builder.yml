# electron-builder 打包配置
# 当前：发布渠道留空。接入 GitHub 私有仓库自动更新时，取消注释 publish 节点并填 owner/repo。
# 打包发布：GH_TOKEN=<token> npx electron-builder --win --publish always

appId: com.stardust.geek
productName: 极客
directories:
  output: dist-release
electronDist: node_modules/electron/dist
files:
  - src/**/*
  - ui/**/*
  - resources/**/*
  - build/icon.ico
  - package.json
  - '!data/**/*'
  - '!resources/waplus-ext/**/*'  # 死代码资源（代码实际加载 pragmaz-ext），排除瘦身 38MB
asarUnpack:
  - resources/extensions/**/*
  - resources/pragmaz-ext/**/*
icon: build/icon.ico

publish:
  provider: github
  owner: 9529360-cpu
  repo: geek
  private: true

win:
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
