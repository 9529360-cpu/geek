# electron-builder 打包配置
# 当前：发布渠道留空。接入 GitHub 私有仓库自动更新时，取消注释 publish 节点并填 owner/repo。
# 打包发布：GH_TOKEN=<token> npx electron-builder --win --publish always

appId: com.stardust.geek
productName: 极客
directories:
  output: dist-release
electronDist: node_modules/electron/dist
files:
  - src/**/*
  - ui/**/*
  - resources/**/*
  - build/icon.ico
  - package.json
  - '!data/**/*'
  - '!resources/waplus-ext/**/*'  # 死代码资源，排除瘦身 38MB
  - '!resources/pragmaz-ext/**/*'  # 弃用扩展：含原版硬编码 BrightData 凭据 + pragmaz.ai 通信，安全排除
asarUnpack:
  - resources/extensions/**/*
icon: build/icon.ico

# 自动更新渠道：Cloudflare R2（公开读，源码仍私有）
# 发布后需将 dist-release/{latest.yml, 极客 Setup X.exe, *.blockmap} 上传到 R2 桶 geek-release
# （S3 凭证在 scripts/.r2-creds.json；上传命令见 geek-release-workflow 技能）
publish:
  provider: generic
  url: https://geek-release.9529360.workers.dev

win:
  # Formal releases use scripts/release-build.cjs with forceCodeSigning=true.
  verifyUpdateCodeSignature: true
  target:
    - nsis
  artifactName: geek-setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
