# electron-builder 打包配置
# 自动更新元数据与安装包由正式发布流程上传至公开只读的 R2 更新源。

appId: com.stardust.geek
productName: 极客
directories:
  output: dist-release
electronDist: node_modules/electron/dist
files:
  - src/**/*
  - ui/**/*
  - resources/**/*
  - build/icon.ico
  - package.json
  - '!data/**/*'
  - '!resources/pragmaz-ext/**/*'  # 弃用扩展：含原版硬编码 BrightData 凭据 + pragmaz.ai 通信，安全排除
asarUnpack:
  - resources/extensions/**/*
  # WA/TG guest preload is resolved from app.asar.unpacked at runtime.
  # Keep it on disk so Electron can actually attach the intended sendToHost bridge.
  - resources/bridge-preload.cjs
icon: build/icon.ico

# 生产二进制安全熔断：阻止运行时环境变量/调试参数把 Electron 当通用 Node 入口，
# 并要求主应用只能从带嵌入完整性元数据的 app.asar 启动。
# Cookie 加密等会改变既有登录态磁盘格式的 fuse 单独评估，不在此处启用。
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# 自动更新渠道：Cloudflare R2（公开读，源码仍私有）
# 发布后需将 dist-release/{latest.yml, 极客 Setup X.exe, *.blockmap} 上传到 R2 桶 geek-release
# （S3 凭证在 scripts/.r2-creds.json；上传命令见 geek-release-workflow 技能）
publish:
  provider: generic
  url: https://geek-release.9529360.workers.dev
  # Release Worker intentionally supports one byte range per request. This keeps the
  # public R2 boundary simple while still enabling electron-updater differential downloads.
  useMultipleRangeRequest: false

win:
  target:
    - nsis
  artifactName: geek-setup-${version}.exe
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
