name: account-context-handoff-run-once

on:
  push:
    branches:
      - docs/account-context-menu-scope

permissions:
  contents: write

jobs:
  append:
    runs-on: [self-hosted, Linux, X64, geek-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/account-context-menu-scope
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Append report
        run: |
          node scripts/append-account-context-report-once.cjs
          rm -f scripts/append-account-context-report-once.cjs
          rm -f .github/workflows/account-context-handoff-report-once.yml
          rm -f .github/workflows/account-context-handoff-run-once.yml
          git diff --check
      - name: Commit report
        run: |
          git config user.name 'Geek Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/agent-collaboration-handoff.md scripts/append-account-context-report-once.cjs .github/workflows/account-context-handoff-report-once.yml .github/workflows/account-context-handoff-run-once.yml
          git commit -m 'docs: record ACCOUNT-CONTEXT-001 Phase 2 results'
          git push origin HEAD:docs/account-context-menu-scope
