name: feature-apply

on:
  push:
    branches:
      - feat/custom-web-app

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/custom-web-app
      - name: Apply reviewed patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | xz -d > /tmp/custom-web-app.patch
          git apply --check /tmp/custom-web-app.patch
          git apply /tmp/custom-web-app.patch
          rm .github/workflows/feature-snapshot.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add custom web app accounts'
          git push origin HEAD:feat/custom-web-app
