name: line-extension-electron43-temp

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.pull_request.head.ref == 'agent/line-extension-api-electron43-v2'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply LINE extension API migration
        shell: pwsh
        run: |
          $mainPath = 'src/main.cjs'
          $text = [System.IO.File]::ReadAllText($mainPath)
          $oldCall = 'const ext = await ses.loadExtension(LINE_EXTENSION_PATH);'
          $newCall = 'const ext = await ses.extensions.loadExtension(LINE_EXTENSION_PATH);'
          if (-not $text.Contains($oldCall) -and -not $text.Contains($newCall)) {
            throw 'LINE extension loader call not found'
          }
          if ($text.Contains($oldCall)) {
            $text = $text.Replace($oldCall, $newCall)
          }
          $text = $text.Replace('session.loadExtension 需要真实文件', 'ses.extensions.loadExtension 需要真实文件')
          [System.IO.File]::WriteAllText($mainPath, $text, [System.Text.UTF8Encoding]::new($false))

          @'
          'use strict';

          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');

          const root = path.join(__dirname, '..');
          const main = fs.readFileSync(path.join(root, 'src', 'main.cjs'), 'utf8');

          assert.match(
            main,
            /ses\.extensions\.loadExtension\(LINE_EXTENSION_PATH\)/,
            'LINE must use Electron Extensions.loadExtension'
          );
          assert.doesNotMatch(
            main,
            /ses\.loadExtension\(LINE_EXTENSION_PATH\)/,
            'deprecated Session.loadExtension must not be reintroduced for LINE'
          );
          assert.match(
            main,
            /session\.fromPartition\(partition, \{ cache: true \}\)/,
            'LINE extension must stay isolated in its persistent account session'
          );

          console.log('line-extension-api-contract: ok');
          '@ | Set-Content -LiteralPath 'test/line-extension-api-contract.cjs' -Encoding utf8

          node --check src/main.cjs
          node test/line-extension-api-contract.cjs

      - name: Install dependencies and Electron runtime
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository tests
        run: npm test

      - name: Smoke-load bundled LINE extension in Electron 43
        shell: pwsh
        run: |
          @'
          'use strict';
          const { app, session } = require('electron');
          const path = require('node:path');

          const EXPECTED_ID = 'ophjlpahpchlmihnnnihgmmeilfjmjjc';
          const extensionPath = path.join(process.cwd(), 'resources', 'extensions', 'line-3.5.1');
          app.setPath('userData', path.join(process.env.RUNNER_TEMP, 'geek-line-extension-smoke'));

          function waitForReady(extensions, timeoutMs) {
            return new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error('extension-ready timeout')), timeoutMs);
              const handler = (_event, extension) => {
                if (!extension || extension.id !== EXPECTED_ID) return;
                clearTimeout(timer);
                extensions.removeListener('extension-ready', handler);
                resolve(extension);
              };
              extensions.on('extension-ready', handler);
            });
          }

          app.whenReady().then(async () => {
            const ses = session.fromPartition('persist:geek-line-extension-ci-smoke', { cache: true });
            if (!ses.extensions || typeof ses.extensions.loadExtension !== 'function') {
              throw new Error('Extensions.loadExtension API unavailable');
            }
            const ready = waitForReady(ses.extensions, 15000);
            const loaded = await ses.extensions.loadExtension(extensionPath);
            if (!loaded || loaded.id !== EXPECTED_ID) {
              throw new Error(`unexpected extension id: ${loaded && loaded.id}`);
            }
            await ready;
            const active = ses.extensions.getExtension(EXPECTED_ID);
            if (!active) throw new Error('extension missing after load');
            ses.extensions.removeExtension(EXPECTED_ID);
            console.log(`LINE_EXTENSION_ELECTRON43_SMOKE_OK electron=${process.versions.electron} chromium=${process.versions.chrome}`);
          }).then(() => app.quit()).catch((error) => {
            console.error(`LINE_EXTENSION_ELECTRON43_SMOKE_FAIL ${String(error && error.message || error)}`);
            app.exit(1);
          });
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/line-extension-smoke.cjs" -Encoding utf8

          $output = & '.\node_modules\electron\dist\electron.exe' "$env:RUNNER_TEMP/line-extension-smoke.cjs" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output | Out-String) -notmatch 'LINE_EXTENSION_ELECTRON43_SMOKE_OK') {
            throw 'LINE extension smoke exited without success marker'
          }

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cjs test/line-extension-api-contract.cjs
          if git diff --cached --quiet; then
            echo 'No verified migration changes to commit'
            exit 0
          fi
          git commit -m 'compat: migrate LINE extension API'
          git push origin HEAD:agent/line-extension-api-electron43-v2
