name: account-context-apply

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/account-context-001' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, geek-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-context-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply bounded implementation
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function read(path) { return fs.readFileSync(path, 'utf8'); }
          function write(path, value) { fs.writeFileSync(path, value, 'utf8'); }
          function replaceOnce(text, before, after, label) {
            const count = text.split(before).length - 1;
            if (count !== 1) throw new Error(`${label}: expected one match, got ${count}`);
            return text.replace(before, after);
          }

          // src/main.cjs: round-trip HTTP and immediately inherit global proxy when instance proxy is disabled.
          {
            let text = read('src/main.cjs');
            text = replaceOnce(text,
              "    if (raw.protocal === 'https' || raw.protocal === 'socks4' || raw.protocal === 'socks5') {\n      account.protocal = raw.protocal;\n    }",
              "    if (raw.protocal === 'http' || raw.protocal === 'https' || raw.protocal === 'socks4' || raw.protocal === 'socks5') {\n      account.protocal = raw.protocal;\n    }",
              'main protocol');
            text = replaceOnce(text,
              "    await applyProxyForPartition(\n      account.partition,\n      account.openProxy ? account : null\n    );",
              "    await applyProxyForPartition(\n      account.partition,\n      account.openProxy ? account : (configState.openProxy ? configState : null)\n    );",
              'main proxy fallback');
            write('src/main.cjs', text);
          }

          // ui/index.html: personal center + global settings remain ordinary settings; instance settings is context-only.
          {
            let text = read('ui/index.html');
            text = replaceOnce(text,
`    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="global">应用设置</button>
      <button class="settings-tab" data-tab="account">账号设置</button>
    </div>

    <div id="settings-global" class="settings-body settings-body--cards">`,
`    <div class="settings-tabs">
      <button class="settings-tab active" data-tab="account-center" data-settings-tab="account-center">个人中心</button>
      <button class="settings-tab" data-tab="global" data-settings-tab="global">应用设置</button>
    </div>

    <div id="settings-account-center" class="settings-body settings-body--cards">
      <section class="settings-card">
        <div class="settings-card-title">极客账户</div>
        <div class="settings-card-sub">只读取当前已登录极客账户的真实状态；无法刷新时会明确显示未知，不使用默认余额。</div>
        <div class="row-item"><span>邮箱</span><strong id="geek-account-email">正在读取…</strong></div>
        <div class="row-item"><span>翻译字符</span><strong id="geek-account-quota">正在读取…</strong></div>
        <div class="row-item"><span>账户状态</span><strong id="geek-account-status" aria-live="polite">正在刷新…</strong></div>
      </section>
    </div>

    <div id="settings-global" class="settings-body settings-body--cards hidden">`,
              'settings tabs and account center');
            text = replaceOnce(text,
`    <div id="settings-account" class="settings-body settings-body--cards hidden">
      <section class="settings-card">
        <div class="settings-card-title">选择账号</div>
        <div class="settings-card-sub">每个账号的名称、显示和独立代理互不影响。</div>
        <div class="row-item"><span>当前编辑</span><select id="acc-select"></select></div>
      </section>
      <div id="settings-account-empty" class="settings-account-empty hidden">当前没有可编辑的账号</div>`,
`    <div id="settings-account" class="settings-body settings-body--cards hidden">
      <input type="hidden" id="acc-select" value="">
      <section class="settings-card">
        <div class="settings-card-title">当前实例</div>
        <div class="settings-card-sub">此面板固定绑定你刚刚右击的应用实例，切换主界面账号不会改变保存目标。</div>
        <div class="row-item"><span>实例</span><strong id="acc-target-label">—</strong></div>
      </section>
      <div id="settings-account-empty" class="settings-account-empty hidden">当前账号不可编辑</div>`,
              'locked account target');
            text = replaceOnce(text,
`          <div id="settings-account-proxy-fields" class="settings-fields">
            <div class="row-item"><span>主机</span><input type="text" id="acc-host" placeholder="127.0.0.1" autocomplete="off"></div>`,
`          <div id="settings-account-proxy-fields" class="settings-fields">
            <div class="row-item"><span>协议</span><select id="acc-protocal"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks4">SOCKS4</option><option value="socks5">SOCKS5</option></select></div>
            <div class="row-item"><span>主机</span><input type="text" id="acc-host" placeholder="127.0.0.1" autocomplete="off"></div>`,
              'account protocol');
            write('ui/index.html', text);
          }

          // ui/settings-controller.js: one canonical instance editor with immutable target id.
          {
            let text = read('ui/settings-controller.js');
            text = replaceOnce(text,
              "  const PROXY_ACCOUNT_IDS = ['acc-host','acc-port','acc-huser','acc-hpwd'];",
              "  const PROXY_ACCOUNT_IDS = ['acc-protocal','acc-host','acc-port','acc-huser','acc-hpwd'];",
              'proxy fields');
            text = replaceOnce(text,
              "    let returnFocus = null;",
              "    let returnFocus = null;\n    let lockedAccountId = '';",
              'locked state');
            text = replaceOnce(text,
              "    const setValue = (id, next) => { const node = el(id); if (node) node.value = String(next ?? ''); };",
              "    const setValue = (id, next) => { const node = el(id); if (node) node.value = String(next ?? ''); };\n    const currentAccountId = () => lockedAccountId || value('acc-select');",
              'current account helper');
            text = text.replace("const accountId = value('acc-select');", "const accountId = currentAccountId();");
            text = replaceOnce(text,
`    function activateTab(name) {
      document.querySelectorAll('.settings-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
      el('settings-global')?.classList.toggle('hidden', name !== 'global');
      el('settings-account')?.classList.toggle('hidden', name !== 'account');
    }`,
`    function activateTab(name) {
      document.querySelectorAll('.settings-tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === name));
      el('settings-account-center')?.classList.toggle('hidden', name !== 'account-center');
      el('settings-global')?.classList.toggle('hidden', name !== 'global');
      el('settings-account')?.classList.toggle('hidden', name !== 'account');
      const saveButton = el('settings-save');
      if (saveButton) saveButton.classList.toggle('hidden', name === 'account-center');
      if (name === 'account-center' && typeof deps.loadAccountCenter === 'function') void deps.loadAccountCenter();
    }`,
              'activate tabs');
            text = replaceOnce(text,
`    function fillAccountSelect(preferredId = '') {
      const select = el('acc-select');
      if (!select) return;
      const current = preferredId || select.value;
      select.replaceChildren();
      for (const account of accounts) {
        const option = document.createElement('option');
        option.value = account.id;
        option.textContent = \`${'${account.name || \'未命名账号\'}'} · ${'${familyLabel(account.type)}'}\`;
        select.appendChild(option);
      }
      if (current && accounts.some(item => item.id === current)) select.value = current;
      else if (typeof deps.getActiveId === 'function' && accounts.some(item => item.id === deps.getActiveId())) select.value = deps.getActiveId();
    }`,
`    function fillAccountSelect(preferredId = '') {
      const target = preferredId || lockedAccountId || (typeof deps.getActiveId === 'function' ? deps.getActiveId() : '');
      setValue('acc-select', accounts.some(item => item.id === target) ? target : '');
    }`,
              'target filler');
            text = replaceOnce(text,
              "      const account = accounts.find(item => item.id === value('acc-select'));",
              "      const account = accounts.find(item => item.id === currentAccountId());",
              'load target');
            text = replaceOnce(text,
              "      setValue('acc-name', account.name || '');",
              "      const targetLabel = el('acc-target-label');\n      if (targetLabel) targetLabel.textContent = `${account.name || '未命名账号'} · ${familyLabel(account.type)}`;\n      setValue('acc-name', account.name || '');",
              'target label');
            text = replaceOnce(text,
              "      setChecked('acc-openProxy', !!account.openProxy);\n      setValue('acc-host', account.host || '');",
              "      setChecked('acc-openProxy', !!account.openProxy);\n      setValue('acc-protocal', account.protocal || 'http');\n      setValue('acc-host', account.host || '');",
              'fill protocol');
            text = replaceOnce(text,
`    async function open(preferredAccountId = '') {
      if (overlayVisible('settings-overlay')) {
        el('settings-close')?.focus();
        return;
      }
      const activeTab = document.querySelector('.settings-tab.active')?.dataset.tab || 'global';
      const active = document.activeElement;
      returnFocus = active && typeof active.focus === 'function' ? active : null;
      const before = await deps.getConfig() || {};
      previewSnapshot = { theme: before.theme || 'dark', accent: before.accent || 'green' };
      await load(preferredAccountId);
      activateTab(activeTab);
      el('settings-overlay')?.classList.remove('hidden');
      el('settings-close')?.focus();
    }`,
`    async function open(preferredAccountId = '') {
      lockedAccountId = '';
      const active = document.activeElement;
      returnFocus = active && typeof active.focus === 'function' ? active : null;
      const before = await deps.getConfig() || {};
      previewSnapshot = { theme: before.theme || 'dark', accent: before.accent || 'green' };
      await load(preferredAccountId);
      activateTab('account-center');
      el('settings-overlay')?.classList.remove('hidden');
      el('settings-close')?.focus();
    }

    async function openAccount(accountId, options = {}) {
      const targetId = String(accountId || '');
      if (!targetId) return false;
      lockedAccountId = targetId;
      const active = document.activeElement;
      returnFocus = active && typeof active.focus === 'function' ? active : null;
      const before = await deps.getConfig() || {};
      previewSnapshot = { theme: before.theme || 'dark', accent: before.accent || 'green' };
      await load(targetId);
      if (!accounts.some(item => item.id === targetId)) { lockedAccountId = ''; return false; }
      setValue('acc-select', targetId);
      loadAccount();
      activateTab('account');
      el('settings-overlay')?.classList.remove('hidden');
      if (options.focus === 'proxy') el('acc-openProxy')?.focus();
      else el('acc-name')?.focus();
      return true;
    }`,
              'open modes');
            text = replaceOnce(text,
              "        openProxy: checked('acc-openProxy'),\n        host: value('acc-host').trim(),",
              "        openProxy: checked('acc-openProxy'),\n        protocal: value('acc-protocal', 'http'),\n        host: value('acc-host').trim(),",
              'account patch protocol');
            text = replaceOnce(text,
`        const nextConfig = configPatch();
        await deps.setConfig(nextConfig);
        const accountId = currentAccountId();
        if (accountId) await deps.updateAccount(accountId, accountPatch());
        config = { ...config, ...nextConfig };
        deps.applyTheme(nextConfig.theme, nextConfig.accent);`,
`        const nextConfig = configPatch();
        const accountId = currentAccountId();
        if (lockedAccountId) {
          await deps.updateAccount(accountId, accountPatch());
        } else {
          await deps.setConfig(nextConfig);
          config = { ...config, ...nextConfig };
          deps.applyTheme(nextConfig.theme, nextConfig.accent);
        }`,
              'save scope');
            text = replaceOnce(text,
              "        previewSnapshot = { theme: nextConfig.theme, accent: nextConfig.accent };",
              "        if (!lockedAccountId) previewSnapshot = { theme: nextConfig.theme, accent: nextConfig.accent };",
              'preview scope');
            text = replaceOnce(text,
              "    return Object.freeze({ bind, open, close, load, loadAccount, save, validate, refreshProxyUi, resetAppearance, resetAccountDisplay });",
              "    return Object.freeze({ bind, open, openAccount, close, load, loadAccount, save, validate, refreshProxyUi, resetAppearance, resetAccountDisplay });",
              'controller api');
            write('ui/settings-controller.js', text);
          }

          // ui/app.js: keep sole menu ownership, fixed target, target-only refresh, and real Geek account readout.
          {
            let text = read('ui/app.js');
            text = replaceOnce(text,
`  // ---------- 右键菜单（对齐原版：刷新应用/编辑应用/删除应用） ----------
  const ctxMenu = document.getElementById('ctx-menu');`,
`  // ---------- 右键菜单：唯一 owner，所有 action 都绑定被右击的实例 ID ----------
  const ctxMenu = document.getElementById('ctx-menu');
  async function refreshAccountInstance(accountId) {
    const wv = wvMap.get(accountId);
    if (wv) wv.reloadIgnoringCache();
    try {
      const r = await window.api.accounts.list();
      accounts = r?.accounts || r || [];
      renderSidebar();
      renderTabs();
    } catch (err) { /* 列表刷新失败不影响目标 WebView 刷新 */ }
  }`,
              'refresh helper');
            text = replaceOnce(text,
              '<div class="ctx-item" data-act="edit">编辑应用</div>',
              '<div class="ctx-item" data-act="edit">账号设置</div>',
              'menu label');
            text = replaceOnce(text,
`    if (act === 'refresh') {
      // 原版 refreshApp：重新加载应用列表 + 重载页面
      const wv = wvMap.get(accountId);
      if (wv) wv.reloadIgnoringCache();
      try {
        const r = await window.api.accounts.list();
        accounts = r?.accounts || r || [];
        renderSidebar();
        renderTabs();
      } catch (err) { /* 列表刷新失败不影响页面刷新 */ }
    } else if (act === 'edit') {
      editAccount(accountId);
    } else if (act === 'proxy') {
      const account = accounts.find(a => a.id === accountId);
      if (account) showProxyDialog(account);
    } else if (act === 'delete') {`,
`    if (act === 'refresh') {
      await refreshAccountInstance(accountId);
    } else if (act === 'edit') {
      await settingsController.openAccount(accountId);
    } else if (act === 'proxy') {
      await settingsController.openAccount(accountId, { focus: 'proxy' });
    } else if (act === 'delete') {`,
              'context actions');
            text = replaceOnce(text,
`  // 编辑应用：打开设置 → 账号设置 tab → 选中该账号
  function editAccount(id) {
    const accountTab = [...settingsTabs].find(t => t.dataset.tab === 'account');
    if (accountTab) {
      settingsTabs.forEach(t => t.classList.remove('active'));
      accountTab.classList.add('active');
      settingsGlobal.classList.add('hidden');
      settingsAccount.classList.remove('hidden');
    }
    accSelect.value = id;
    loadAccountSettingsForm();
    openSettings();
  }

`,
'',
              'remove legacy editor');
            text = replaceOnce(text,
`  // ---------- 设置面板（体验层独立模块；沿用既有 config/accounts IPC） ----------
  const settingsController = window.GeekSettingsController.create({`,
`  // ---------- 极客账户个人中心：复用现有 subscription state/refresh，不保存第二套状态 ----------
  async function loadGeekAccountCenter() {
    const emailNode = document.getElementById('geek-account-email');
    const quotaNode = document.getElementById('geek-account-quota');
    const statusNode = document.getElementById('geek-account-status');
    if (!emailNode || !quotaNode || !statusNode) return;
    emailNode.textContent = '正在读取…';
    quotaNode.textContent = '正在刷新…';
    statusNode.textContent = '正在刷新…';
    try {
      const state = await window.api.subscription.getState();
      if (!state?.loggedIn) {
        emailNode.textContent = '未登录'; quotaNode.textContent = '未知'; statusNode.textContent = '未登录'; return;
      }
      emailNode.textContent = state.email || '未知';
      const refreshed = await window.api.subscription.refresh();
      if (!refreshed?.loggedIn) {
        quotaNode.textContent = '未知'; statusNode.textContent = '登录状态已失效'; return;
      }
      if (refreshed.networkError) {
        quotaNode.textContent = '未知'; statusNode.textContent = '账户信息加载失败'; return;
      }
      const remaining = refreshed.remaining_chars;
      if (!Number.isSafeInteger(remaining) || remaining < 0) {
        quotaNode.textContent = '未知'; statusNode.textContent = '字符余额暂不可用'; return;
      }
      if (refreshed.email) emailNode.textContent = refreshed.email;
      quotaNode.textContent = `${remaining.toLocaleString()} 字符`;
      statusNode.textContent = refreshed.valid === false ? '字符已用完（仅影响翻译）' : '账户信息已更新';
    } catch (error) {
      quotaNode.textContent = '未知'; statusNode.textContent = '账户信息加载失败';
    }
  }

  // ---------- 设置面板（全局设置 + 固定实例设置；沿用既有 config/accounts IPC） ----------
  const settingsController = window.GeekSettingsController.create({`,
              'account center loader');
            text = replaceOnce(text,
              "    afterSave: async () => { await loadAccounts(); },\n  });",
              "    afterSave: async () => { await loadAccounts(); },\n    loadAccountCenter: loadGeekAccountCenter,\n  });",
              'controller deps');
            text = replaceOnce(text,
`  function openSettings() {
    const preferred = accSelect.value || activeId || '';
    return settingsController.open(preferred);
  }`,
`  function openSettings() {
    return settingsController.open();
  }`,
              'ordinary settings');
            write('ui/app.js', text);
          }

          // Final branch must not retain this one-shot CI scaffold.
          fs.rmSync('.github/workflows/account-context-apply.yml');
          NODE
          node test/account-context-phase2-contract.cjs
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Geek Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.cjs ui/index.html ui/app.js ui/settings-controller.js .github/workflows/account-context-apply.yml
          git commit -m 'feat: implement account context phase 2'
          git push origin HEAD:feat/account-context-001
