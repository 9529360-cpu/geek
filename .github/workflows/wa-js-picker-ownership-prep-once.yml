name: wa-js-picker-ownership-prep-once

on:
  push:
    branches:
      - fix/522-wa-js-4-6-migration
    paths:
      - '.github/workflows/wa-js-picker-ownership-prep-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/522-wa-js-4-6-migration
          fetch-depth: 0

      - name: Verify collision-free preparation head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ad81e31ee78bbbcddda6b7ec3ed6d05273175ba8 HEAD
          changed="$(git diff --name-only ad81e31ee78bbbcddda6b7ec3ed6d05273175ba8..HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/wa-js-picker-ownership-prep-once.yml' 'scripts/patch-wa-js-picker-ownership-once.cjs' | sort)"
          test "$changed" = "$expected"

      - name: Apply ownership hardening
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-wa-js-picker-ownership-once.cjs
          node scripts/patch-wa-js-picker-ownership-once.cjs
          node --check src/main.cjs
          node --check ui/app.js
          node --check test/wa-js-460-migration-contract.cjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'src/main.cjs' 'test/wa-js-460-migration-contract.cjs' 'ui/app.js' | sort)"
          test "$changed" = "$expected"

      - name: Validate ownership hardening
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node test/wa-js-460-migration-contract.cjs
          node test/wpp-converge-contract.cjs
          npm test

      - name: Commit only permanent changes
        shell: bash
        run: |
          set -euo pipefail
          git rm -f .github/workflows/wa-js-picker-ownership-prep-once.yml scripts/patch-wa-js-picker-ownership-once.cjs
          git add src/main.cjs ui/app.js test/wa-js-460-migration-contract.cjs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/wa-js-picker-ownership-prep-once.yml' 'scripts/patch-wa-js-picker-ownership-once.cjs' 'src/main.cjs' 'test/wa-js-460-migration-contract.cjs' 'ui/app.js' | sort)"
          test "$staged" = "$expected"
          git config user.name 'Geek Validation Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: commit WA-JS ownership after picker install'
          git push origin HEAD:fix/522-wa-js-4-6-migration
