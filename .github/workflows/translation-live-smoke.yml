name: translation-live-smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/translation-live-smoke-*'
    paths:
      - '.github/workflows/translation-live-smoke.yml'
      - 'scripts/translation-live-smoke.mjs'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-subscription-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run production translation smoke
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/translation-live-smoke.mjs
