name: wa-js-readiness-separation-prep-once

on:
  push:
    branches:
      - fix/522-wa-js-4-6-migration
    paths:
      - '.github/workflows/wa-js-readiness-separation-prep-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          ref: fix/522-wa-js-4-6-migration
          fetch-depth: 0

      - name: Verify collision-free preparation head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 15c28c3c33209dd8648bd65f09bd7449c07d7a45 HEAD
          changed="$(git diff --name-only 15c28c3c33209dd8648bd65f09bd7449c07d7a45..HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/wa-js-readiness-separation-prep-once.yml' 'scripts/patch-wa-js-readiness-separation-once.cjs' | sort)"
          test "$changed" = "$expected"
          test "$(node -p "require('./package.json').dependencies['@wppconnect/wa-js']")" = "4.6.0"

      - name: Apply readiness ownership patch
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/patch-wa-js-readiness-separation-once.cjs
          node scripts/patch-wa-js-readiness-separation-once.cjs
          node --check src/main.cjs
          node --check e2e/specs/whatsapp-wa-js-runtime.e2e.cjs
          node --check test/wa-js-460-migration-contract.cjs
          node --check test/electron-e2e-windows-whatsapp-contract.cjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' 'e2e/specs/whatsapp-wa-js-runtime.e2e.cjs' 'src/main.cjs' 'test/electron-e2e-windows-whatsapp-contract.cjs' 'test/wa-js-460-migration-contract.cjs' | sort)"
          test "$changed" = "$expected"

      - name: Run focused contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node test/wa-js-460-migration-contract.cjs
          node test/electron-e2e-windows-whatsapp-contract.cjs

      - name: Commit only readiness ownership changes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/wa-js-readiness-separation-prep-once.yml scripts/patch-wa-js-readiness-separation-once.cjs
          git add src/main.cjs e2e/specs/whatsapp-wa-js-runtime.e2e.cjs test/wa-js-460-migration-contract.cjs test/electron-e2e-windows-whatsapp-contract.cjs
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/wa-js-readiness-separation-prep-once.yml' 'e2e/specs/whatsapp-wa-js-runtime.e2e.cjs' 'scripts/patch-wa-js-readiness-separation-once.cjs' 'src/main.cjs' 'test/electron-e2e-windows-whatsapp-contract.cjs' 'test/wa-js-460-migration-contract.cjs' | sort)"
          test "$staged" = "$expected"
          git config user.name 'Geek Validation Agent'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix: separate WA-JS injection from capability readiness'
          git push origin HEAD:fix/522-wa-js-4-6-migration
