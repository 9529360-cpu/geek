name: apply-translation-failure-discriminator

on:
  push:
    branches:
      - fix/573-translation-failure-discriminator
    paths:
      - scripts/apply-translation-failure-discriminator.cjs
      - .github/workflows/apply-translation-failure-discriminator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply focused patch
        run: node scripts/apply-translation-failure-discriminator.cjs

      - name: Validate focused contracts
        run: |
          node --check ui/whatsapp-direct-composer-controller.js
          node test/whatsapp-direct-composer-actionable-errors-contract.cjs
          node test/whatsapp-direct-composer-controller-contract.cjs
          node --check e2e/specs/whatsapp-wa-js-runtime.e2e.cjs
          git diff --check

      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: discriminate translated private-send failures"
          git push origin "HEAD:${GITHUB_REF_NAME}"
