name: acl-windows

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/acl-repair.cjs
      - test/acl-repair-contract.cjs
      - test/acl-repair-integration-contract.cjs
      - .github/workflows/acl-windows.yml

permissions:
  contents: read

jobs:
  acl-integration:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run ACL contract
        run: node test/acl-repair-contract.cjs

      - name: Run real Windows ACL integration
        run: node test/acl-repair-integration-contract.cjs
