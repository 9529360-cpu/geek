name: Temporary translation preview patch

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/translation-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/translation-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded translation preview patch
        run: node scripts/patch-translation-preview.cjs
      - name: Verify syntax and release boundary
        shell: bash
        run: |
          node --check ui/translation-settings.js
          node --check test/translation-settings-ux-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version ui/app.js src/main.cjs
      - name: Run contracts
        run: npm test
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- ui/translation-settings.js ui/translation-settings.css test/translation-settings-ux-contract.cjs; then
            echo "No bounded translation preview changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/translation-settings.js ui/translation-settings.css test/translation-settings-ux-contract.cjs
          git commit -m "ux: preview translation appearance"
          git push origin HEAD:agent/translation-preview
