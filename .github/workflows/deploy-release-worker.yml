name: deploy-release-worker

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-release-worker.js'
      - 'scripts/cloudflare-deploy-report.cjs'
      - 'wrangler.toml'
      - 'test/release-*.cjs'
      - 'test/cloudflare-deploy-observability-contract.cjs'
      - '.github/workflows/deploy-release-worker.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-release-worker-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-release-production
      url: https://geek-release.9529360.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-release-worker.js
          node --check scripts/cloudflare-deploy-report.cjs

      - name: Deploy release Worker
        id: deploy
        run: npx --yes wrangler@4.36.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify and publish non-sensitive deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_SERVICE: release
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node scripts/cloudflare-deploy-report.cjs
