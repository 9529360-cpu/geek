name: release-1.2.22-windows-gate-once

on:
  push:
    branches:
      - validation/release-1.2.22-windows-gate
    paths:
      - '.github/workflows/release-1.2.22-windows-gate-once.yml'

permissions:
  contents: read

concurrency:
  group: geek-release-1.2.22-windows-gate
  cancel-in-progress: false

jobs:
  windows-gate:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      CANDIDATE_SHA: 6551f42bcce4ab9ae29b9ad38745e1eae7b12b23
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@v4
        with:
          ref: 6551f42bcce4ab9ae29b9ad38745e1eae7b12b23
          fetch-depth: 0

      - name: Verify exact candidate identity
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:CANDIDATE_SHA) { throw "Candidate mismatch: $actual" }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.2.22') { throw "package.json version mismatch: $($pkg.version)" }
          $marker = (Get-Content .github/release-client-version -Raw).Trim()
          if ($marker -ne '1.2.22') { throw "release marker mismatch: $marker" }
          Write-Host "WINDOWS_GATE_CANDIDATE=$actual"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full contract suite on Windows
        run: npm test

      - name: Re-run focused Windows ACL integration
        run: |
          node test/acl-repair-contract.cjs
          node test/acl-repair-integration-contract.cjs

      - name: Probe exact-candidate Electron E2E on Windows
        id: windows_e2e_probe
        continue-on-error: true
        run: npm run test:e2e

      - name: Record Windows E2E probe outcome
        run: |
          Write-Host "WINDOWS_E2E_PROBE_OUTCOME=${{ steps.windows_e2e_probe.outcome }}"
          Write-Host 'This is supplemental evidence only; the repository-defined Electron E2E merge gate runs on Linux/Xvfb.'

      - name: Verify validation isolation contract
        run: node test/validation-build-isolation-contract.cjs

      - name: Build isolated Windows validation installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:test

      - name: Sanitize and fingerprint validation installer
        run: |
          $out = Join-Path $PWD 'dist-validation-build'
          $exe = @(Get-ChildItem -Path $out -Filter 'geek-validation-setup-*.exe' -File)
          if ($exe.Count -ne 1) { throw "Expected exactly one validation installer, found $($exe.Count)" }

          Get-ChildItem -Path $out -File | Where-Object {
            $_.Name -match '^latest.*\.ya?ml$' -or $_.Name -like '*.blockmap'
          } | Remove-Item -Force

          $forbidden = @(Get-ChildItem -Path $out -File | Where-Object {
            $_.Name -match '^latest.*\.ya?ml$' -or $_.Name -like '*.blockmap'
          })
          if ($forbidden.Count -gt 0) { throw 'Validation updater metadata cleanup failed' }

          $remainingExe = @(Get-ChildItem -Path $out -Filter '*.exe' -File)
          if ($remainingExe.Count -ne 1 -or $remainingExe[0].Name -ne $exe[0].Name) {
            throw 'Unexpected executable present in validation artifact boundary'
          }

          $hash = (Get-FileHash -Path $exe[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "VALIDATION_INSTALLER_NAME=$($exe[0].Name)"
          Write-Host "VALIDATION_INSTALLER_BYTES=$($exe[0].Length)"
          Write-Host "VALIDATION_INSTALLER_SHA256=$hash"
          "VALIDATION_INSTALLER=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload exact-candidate validation installer
        uses: actions/upload-artifact@v4
        with:
          name: geek-validation-6551f42bcce4ab9ae29b9ad38745e1eae7b12b23-windows-gate
          path: ${{ env.VALIDATION_INSTALLER }}
          if-no-files-found: error
          retention-days: 7
