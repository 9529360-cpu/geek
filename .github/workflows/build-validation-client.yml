name: validation-client-build

on:
  push:
    branches:
      - ux/broadcast-account-jobs
      - security/account-session-permissions
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'build/icon.ico'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.validation.yml'
      - 'scripts/**'
      - '.agent/HANDOFF.md'
      - '.github/workflows/build-validation-client.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'build/icon.ico'
      - 'package.json'
      - 'package-lock.json'
      - 'electron-builder.validation.yml'
      - 'scripts/**'
      - '.agent/HANDOFF.md'
      - '.github/workflows/build-validation-client.yml'
  workflow_dispatch:

permissions:
  contents: read

# Validation-only build: never publish production updater metadata or release artifacts.
concurrency:
  group: geek-validation-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'security/account-session-permissions'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify validation isolation contract
        run: node test/validation-build-isolation-contract.cjs

      - name: Build isolated validation installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:test

      - name: Sanitize validation artifacts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $out = Join-Path $PWD 'dist-validation-build'
          $exe = @(Get-ChildItem -Path $out -Filter 'geek-validation-setup-*.exe' -File)
          if ($exe.Count -ne 1) { throw "Expected exactly one validation installer, found $($exe.Count)" }

          # electron-builder may create local updater metadata even with --publish never.
          # Validation builds must never export or retain updater-channel artifacts.
          Get-ChildItem -Path $out -File | Where-Object {
            $_.Name -match '^latest.*\.ya?ml$' -or $_.Name -like '*.blockmap'
          } | Remove-Item -Force

          $forbidden = @(Get-ChildItem -Path $out -File | Where-Object {
            $_.Name -match '^latest.*\.ya?ml$' -or $_.Name -like '*.blockmap'
          })
          if ($forbidden.Count -gt 0) { throw 'Validation updater metadata cleanup failed' }

          $remainingExe = @(Get-ChildItem -Path $out -Filter '*.exe' -File)
          if ($remainingExe.Count -ne 1 -or $remainingExe[0].Name -ne $exe[0].Name) {
            throw 'Unexpected executable present in validation artifact boundary'
          }

          "VALIDATION_INSTALLER=$($exe[0].FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload validation installer
        uses: actions/upload-artifact@v4
        with:
          name: geek-validation-${{ github.sha }}
          path: ${{ env.VALIDATION_INSTALLER }}
          if-no-files-found: error
          retention-days: 7
