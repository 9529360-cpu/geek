name: release-client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/release-client-version'

permissions:
  contents: read

concurrency:
  group: release-client-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      GIT_CONFIG_KEY_1: safe.directory
      GIT_CONFIG_VALUE_1: ${{ github.workspace }}\candidate
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Reject unsupported recovery ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master') {
            throw 'Manual release recovery is supported only from refs/heads/master'
          }

      - name: Checkout trusted release control plane
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve authorized release candidate
        env:
          RELEASE_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          $candidateArgs = @(
            'scripts/release-candidate-authority.cjs',
            'resolve',
            '--event', $env:GITHUB_EVENT_NAME,
            '--ref', $env:GITHUB_REF,
            '--sha', $env:GITHUB_SHA,
            '--github-env', $env:GITHUB_ENV
          )
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $candidateArgs += @('--before', $env:RELEASE_EVENT_BEFORE)
          }
          & node @candidateArgs
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to resolve the authorized release candidate'
          }

      - name: Materialize authorized candidate source
        run: |
          git worktree add --detach candidate $env:RELEASE_CANDIDATE_SHA
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to materialize the authorized release candidate'
          }

      - name: Validate authorized release candidate
        run: |
          node scripts/release-candidate-authority.cjs validate `
            --control-dir '.' `
            --candidate-dir 'candidate' `
            --expected-sha $env:RELEASE_CANDIDATE_SHA `
            --github-env $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) {
            throw 'Authorized release candidate failed source/version validation'
          }

      - name: Install candidate dependencies without lifecycle scripts
        run: |
          Push-Location 'candidate'
          try {
            npm ci --ignore-scripts
            if ($LASTEXITCODE -ne 0) { throw 'Candidate dependency install failed' }
          } finally {
            Pop-Location
          }

      - name: Build tested Windows release
        run: |
          Push-Location 'candidate'
          try {
            npm run dist
            if ($LASTEXITCODE -ne 0) { throw 'Candidate release build failed' }
          } finally {
            Pop-Location
          }
          if (Test-Path 'dist-release') {
            throw 'Refusing to overwrite an unexpected control-plane dist-release directory'
          }
          Move-Item 'candidate\dist-release' 'dist-release'

      - name: Validate release artifacts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          $files = @(
            "dist-release\$base",
            "dist-release\$base.blockmap",
            'dist-release\latest.yml',
            'dist-release\release-manifest.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release artifact: $file" }
          }
          $latest = Get-Content 'dist-release\latest.yml' -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($env:RELEASE_VERSION))\s*$") {
            throw 'latest.yml version mismatch'
          }

      - name: Capture previous stable metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/release-public-check.cjs capture `
            --root 'https://geek-release.9529360.workers.dev' `
            --release-version $env:RELEASE_VERSION `
            --metadata-out 'dist-release\previous-latest.yml' `
            --github-env $env:GITHUB_ENV `
            --attempts 6 `
            --delay-ms 10000
          if ($LASTEXITCODE -ne 0) {
            throw 'Refusing promotion without a verified previous stable release'
          }

      - name: Verify immutable same-version recovery
        if: env.ROLLBACK_AVAILABLE == 'false'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/release-same-version-check.cjs `
            --root 'https://geek-release.9529360.workers.dev' `
            --version $env:RELEASE_VERSION `
            --manifest 'dist-release\release-manifest.json' `
            --attempts 3 `
            --delay-ms 5000 `
            --timeout-ms 120000
          if ($LASTEXITCODE -ne 0) {
            throw 'Refusing same-version recovery because published immutable assets do not match this candidate'
          }
          "RELEASE_ALREADY_PUBLISHED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Same-version public assets are byte-identical; production writes will be skipped."

      - name: Upload installer and blockmap to R2
        if: env.RELEASE_ALREADY_PUBLISHED != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base" --file "dist-release/$base" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 installer upload failed' }
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base.blockmap" --file "dist-release/$base.blockmap" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 blockmap upload failed' }

      - name: Snapshot rollback metadata
        if: env.RELEASE_ALREADY_PUBLISHED != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ($env:ROLLBACK_AVAILABLE -ne 'true' -or -not (Test-Path 'dist-release\previous-latest.yml')) {
            Write-Host 'Idempotent rerun: no older rollback snapshot required.'
            exit 0
          }
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/rollback/latest.yml' --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 rollback latest.yml snapshot failed' }
          $versionedKey = "geek-release/rollback/latest-$env:PREVIOUS_RELEASE_VERSION.yml"
          npx --yes wrangler@4.36.0 r2 object put $versionedKey --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 versioned rollback snapshot failed' }

      - name: Publish latest metadata last
        if: env.RELEASE_ALREADY_PUBLISHED != 'true'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 latest.yml upload failed' }

      - name: Verify production and rollback on failure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $root = 'https://geek-release.9529360.workers.dev'

          if ($env:RELEASE_ALREADY_PUBLISHED -eq 'true') {
            node scripts/release-same-version-check.cjs `
              --root $root `
              --version $env:RELEASE_VERSION `
              --manifest 'dist-release\release-manifest.json' `
              --attempts 3 `
              --delay-ms 5000 `
              --timeout-ms 120000
            if ($LASTEXITCODE -ne 0) {
              throw "Already-published Geek $env:RELEASE_VERSION failed immutable-asset verification"
            }
            "Verified already-published Geek $env:RELEASE_VERSION without rewriting installer, blockmap, or latest.yml." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          node scripts/release-public-check.cjs verify `
            --root $root `
            --version $env:RELEASE_VERSION `
            --attempts 18 `
            --delay-ms 10000
          $publicCheckExit = $LASTEXITCODE
          if ($publicCheckExit -eq 0) {
            node scripts/release-public-integrity.cjs `
              --root $root `
              --version $env:RELEASE_VERSION `
              --manifest 'dist-release\release-manifest.json' `
              --attempts 3 `
              --delay-ms 5000 `
              --timeout-ms 120000
            $integrityExit = $LASTEXITCODE
            if ($integrityExit -eq 0) {
              "Published Geek $env:RELEASE_VERSION to the production update source with full artifact SHA-256 verification." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              exit 0
            }
          }

          Write-Host "Geek $env:RELEASE_VERSION did not verify; attempting rollback."
          if ($env:ROLLBACK_AVAILABLE -eq 'true' -and (Test-Path 'dist-release\previous-latest.yml')) {
            npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/previous-latest.yml' --remote
            if ($LASTEXITCODE -ne 0) { throw 'Release verification failed and rollback upload also failed' }
            if ($env:PREVIOUS_RELEASE_VERSION) {
              node scripts/release-public-check.cjs verify `
                --root $root `
                --version $env:PREVIOUS_RELEASE_VERSION `
                --attempts 18 `
                --delay-ms 10000
              if ($LASTEXITCODE -eq 0) {
                "Release $env:RELEASE_VERSION failed verification. Restored previous stable $env:PREVIOUS_RELEASE_VERSION." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
                throw "Release $env:RELEASE_VERSION failed verification; previous stable $env:PREVIOUS_RELEASE_VERSION was restored"
              }
            }
            throw 'Release verification failed; rollback metadata was uploaded but public rollback could not be verified'
          }

          throw "Release $env:RELEASE_VERSION failed verification and no verified rollback target was available"
