name: refresh-wa-js-migration

on:
  push:
    branches:
      - refresh/522-wa-js-4-6-current-master

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refresh branch
        uses: actions/checkout@v4
        with:
          ref: refresh/522-wa-js-4-6-current-master
          fetch-depth: 0

      - name: Replay audited WA-JS migration diff on current master
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_HEAD='15c71ae7375d028e50e40e2f465875552cd161ed'
          SOURCE_BRANCH='fix/522-wa-js-4-6-migration'
          TARGET_BRANCH='refresh/522-wa-js-4-6-current-master'

          git fetch --no-tags origin "$SOURCE_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$SOURCE_HEAD"

          git checkout "$SOURCE_HEAD" -- \
            .github/workflows/electron-e2e.yml \
            e2e/run.cjs \
            e2e/specs/whatsapp-wa-js-runtime.e2e.cjs \
            package.json \
            package-lock.json \
            src/main.cjs \
            src/wpp-capability-picker.cjs \
            test/electron-e2e-windows-whatsapp-contract.cjs \
            test/wa-js-460-migration-contract.cjs \
            test/whatsapp-direct-composer-actionable-errors-contract.cjs \
            test/whatsapp-direct-composer-controller-contract.cjs \
            test/whatsapp-translation-hook-recovery-contract.cjs \
            test/wpp-converge-contract.cjs \
            ui/app.js \
            ui/broadcast-runtime.js \
            ui/version-label.js \
            ui/whatsapp-direct-composer-controller.js

          node <<'NODE'
          const fs = require('node:fs');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = '1.2.27';
          if (pkg.dependencies?.['@wppconnect/wa-js'] !== '4.6.0') throw new Error('WA-JS manifest pin drifted');
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = '1.2.27';
          if (!lock.packages?.['']) throw new Error('package-lock root package missing');
          lock.packages[''].version = '1.2.27';
          if (lock.packages[''].dependencies?.['@wppconnect/wa-js'] !== '4.6.0') throw new Error('WA-JS lock root pin drifted');
          if (lock.packages?.['node_modules/@wppconnect/wa-js']?.version !== '4.6.0') throw new Error('WA-JS resolved lock version drifted');
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          const contractPath = 'test/translation-send-safety-contract.cjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const anchor = "assert.match(appSource, /live\\.sendTextMsgToChat !== window\\.__geekWhatsAppWrappedSend/, 'WhatsApp 必须在发送时检查翻译钩子仍然存活');\n";
          const directOwner = "assert.match(appSource, /__geekWhatsAppDirectComposerController[\\s\\S]*handleNativeSend\\(chat, args, original, this\\)/, 'WhatsApp legacy text wrapper must delegate translated private sends to the single direct-composer owner');\n";
          if (!contract.includes(directOwner)) {
            if (!contract.includes(anchor)) throw new Error('translation safety merge anchor missing');
            contract = contract.replace(anchor, anchor + directOwner);
            fs.writeFileSync(contractPath, contract);
          }
          NODE

          test "$(cat .github/release-client-version)" = '1.2.27'
          node -e "const p=require('./package.json');const l=require('./package-lock.json');if(p.version!=='1.2.27'||l.version!=='1.2.27'||l.packages[''].version!=='1.2.27'||p.dependencies['@wppconnect/wa-js']!=='4.6.0'||l.packages['node_modules/@wppconnect/wa-js'].version!=='4.6.0')process.exit(1)"
          git diff --check

          git rm -- .github/workflows/refresh-573.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: refresh WA-JS migration on current master'
          git push origin "HEAD:$TARGET_BRANCH"
