name: verify-cloudflare-infra

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/cloudflare-infra-smoke.mjs'
      - 'test/cloudflare-control-plane-contract.cjs'
      - 'docs/github-control-plane.md'
      - '.github/workflows/verify-cloudflare-infra.yml'

permissions:
  contents: read

concurrency:
  group: verify-cloudflare-infra
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate smoke script syntax
        run: node --check scripts/cloudflare-infra-smoke.mjs

      - name: Verify Cloudflare project access
        run: node scripts/cloudflare-infra-smoke.mjs
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
