name: diagnose-release-rollback-1.2.9

on:
  push:
    branches:
      - release/1.2.9
    paths:
      - '.github/workflows/diagnose-release-rollback-1.2.9.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check current public updater target
        id: public
        shell: bash
        run: |
          set -uo pipefail
          root='https://geek-release.9529360.workers.dev'
          nonce="$(date +%s)"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          latest_status="$(curl --silent --show-error --location --output "$work/latest.yml" --write-out '%{http_code}' "$root/latest.yml?diagnose=$nonce" || true)"
          previous_version='unknown'
          declared_path='unknown'
          declared_sha='missing'
          artifact_head='000'
          artifact_get='000'
          blockmap_head='000'
          blockmap_get='000'

          if [ "$latest_status" = '200' ]; then
            previous_version="$(awk '/^version:[[:space:]]*/ { print $2; exit }' "$work/latest.yml")"
            declared_path="$(awk '/^path:[[:space:]]*/ { sub(/^path:[[:space:]]*/, ""); print; exit }' "$work/latest.yml")"
            if awk '/^sha512:[[:space:]]*/ { found=1; exit } END { exit found ? 0 : 1 }' "$work/latest.yml"; then declared_sha='present'; fi
            if printf '%s' "$declared_path" | grep -Eq '^geek-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$'; then
              artifact_head="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' "$root/$declared_path?diagnose=$nonce" || true)"
              artifact_get="$(curl --silent --show-error --location --header 'Range: bytes=0-0' --output /dev/null --write-out '%{http_code}' --max-time 90 "$root/$declared_path?diagnose=$nonce" || true)"
              blockmap_head="$(curl --silent --show-error --location --head --output /dev/null --write-out '%{http_code}' "$root/$declared_path.blockmap?diagnose=$nonce" || true)"
              blockmap_get="$(curl --silent --show-error --location --header 'Range: bytes=0-0' --output /dev/null --write-out '%{http_code}' --max-time 90 "$root/$declared_path.blockmap?diagnose=$nonce" || true)"
            fi
          fi

          {
            echo "latest_status=$latest_status"
            echo "previous_version=$previous_version"
            echo "declared_path=$declared_path"
            echo "declared_sha=$declared_sha"
            echo "artifact_head=$artifact_head"
            echo "artifact_get=$artifact_get"
            echo "blockmap_head=$blockmap_head"
            echo "blockmap_get=$blockmap_get"
            echo "checked_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish non-sensitive rollback diagnostic
        if: always()
        uses: actions/github-script@v7
        env:
          LATEST_STATUS: ${{ steps.public.outputs.latest_status }}
          PREVIOUS_VERSION: ${{ steps.public.outputs.previous_version }}
          DECLARED_PATH: ${{ steps.public.outputs.declared_path }}
          DECLARED_SHA: ${{ steps.public.outputs.declared_sha }}
          ARTIFACT_HEAD: ${{ steps.public.outputs.artifact_head }}
          ARTIFACT_GET: ${{ steps.public.outputs.artifact_get }}
          BLOCKMAP_HEAD: ${{ steps.public.outputs.blockmap_head }}
          BLOCKMAP_GET: ${{ steps.public.outputs.blockmap_get }}
          CHECKED_AT: ${{ steps.public.outputs.checked_at }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = [
              '## Public rollback-target diagnostic — Geek 1.2.9',
              '',
              `- Current latest.yml: HTTP ${process.env.LATEST_STATUS || '000'}`,
              `- Declared previous version: ${process.env.PREVIOUS_VERSION || 'unknown'}`,
              `- Declared installer path: ${process.env.DECLARED_PATH || 'unknown'}`,
              `- latest.yml SHA-512 field: ${process.env.DECLARED_SHA || 'missing'}`,
              `- Installer HEAD: HTTP ${process.env.ARTIFACT_HEAD || '000'}`,
              `- Installer ranged GET: HTTP ${process.env.ARTIFACT_GET || '000'}`,
              `- Blockmap HEAD: HTTP ${process.env.BLOCKMAP_HEAD || '000'}`,
              `- Blockmap ranged GET: HTTP ${process.env.BLOCKMAP_GET || '000'}`,
              `- Diagnostic run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Checked at: ${process.env.CHECKED_AT || new Date().toISOString()}`,
              '',
              'Only public updater metadata fields and HTTP status codes are included. No response body, secret or storage content is reported.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 77,
              body,
            });
