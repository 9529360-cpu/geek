name: electron43-compat-temp

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify locked Electron version
        shell: node {0}
        run: |
          const electron = require('./node_modules/electron/package.json');
          if (electron.version !== '43.4.0') throw new Error(`unexpected Electron ${electron.version}`);

      - name: Run tests
        run: npm test

  windows-pack:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Package Windows directory
        run: npm run pack

      - name: Verify Electron runtime and unpacked executable
        shell: pwsh
        run: |
          $electron = Join-Path $PWD 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electron)) { throw 'Electron runtime was not installed before packaging' }
          $version = (& $electron --version).Trim()
          if ($version -ne 'v43.4.0') { throw "Unexpected Electron runtime: $version" }
          $exe = Get-ChildItem -Path dist-release -Filter *.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'No packaged Windows executable found' }
          Write-Host "electron=$version packaged=$($exe.FullName)"
