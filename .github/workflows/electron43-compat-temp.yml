name: electron43-compat-temp

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  linux-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify locked Electron version
        shell: node {0}
        run: |
          const path = require('node:path');
          const electron = require(path.join(process.cwd(), 'node_modules/electron/package.json'));
          if (electron.version !== '43.4.0') throw new Error(`unexpected Electron ${electron.version}`);

      - name: Run tests
        run: npm test

  windows-release-candidate:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build release candidate
        run: npm run dist

      - name: Verify Electron runtime and release artifacts
        shell: pwsh
        run: |
          $electronExe = Join-Path $PWD 'node_modules\electron\dist\electron.exe'
          if (-not (Test-Path $electronExe)) { throw 'Electron runtime was not installed before packaging' }
          $electronPackage = Get-Content (Join-Path $PWD 'node_modules\electron\package.json') -Raw | ConvertFrom-Json
          if ($electronPackage.version -ne '43.4.0') { throw "Unexpected Electron runtime package: $($electronPackage.version)" }
          $pkg = Get-Content (Join-Path $PWD 'package.json') -Raw | ConvertFrom-Json
          $base = "geek-setup-$($pkg.version).exe"
          $exe = Join-Path $PWD "dist-release\$base"
          $blockmap = "$exe.blockmap"
          $latest = Join-Path $PWD 'dist-release\latest.yml'
          $manifest = Join-Path $PWD 'dist-release\release-manifest.json'
          foreach ($file in @($exe, $blockmap, $latest, $manifest)) {
            if (-not (Test-Path $file)) { throw "Missing release artifact: $file" }
          }
          $latestText = Get-Content $latest -Raw
          if ($latestText -notmatch "(?m)^version:\s*$([regex]::Escape($pkg.version))\s*$") { throw 'latest.yml version mismatch' }
          Write-Host "electron=$($electronPackage.version) release=$($pkg.version)"
