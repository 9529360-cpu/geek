name: provider-direct-probe

on:
  push:
    branches:
      - 'test/translation-live-smoke-*'
    paths:
      - '.github/workflows/provider-direct-probe.yml'
      - 'scripts/provider-direct-probe-worker.js'
      - 'wrangler-provider-probe.toml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-translation-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Upload undeployed preview version
        run: npx --yes wrangler@4.44.0 versions upload --config wrangler-provider-probe.toml --preview-alias direct-provider-probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Direct-call Gemini Mistral and GLM, then restore preview setting
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/geek-translate/subdomain"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          BEFORE="$(curl -fsS "$API" -H "$AUTH")"
          ORIGINAL_ENABLED="$(printf '%s' "$BEFORE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).result.enabled)))")"
          ORIGINAL_PREVIEWS="$(printf '%s' "$BEFORE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(String(JSON.parse(s).result.previews_enabled)))")"

          restore() {
            curl -fsS -X POST "$API" -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"enabled\":${ORIGINAL_ENABLED},\"previews_enabled\":${ORIGINAL_PREVIEWS}}" >/dev/null || true
          }
          trap restore EXIT

          if [ "$ORIGINAL_PREVIEWS" != "true" ]; then
            curl -fsS -X POST "$API" -H "$AUTH" -H 'Content-Type: application/json' \
              --data "{\"enabled\":${ORIGINAL_ENABLED},\"previews_enabled\":true}" >/dev/null
          fi

          node <<'NODE'
          const url = 'https://direct-provider-probe-geek-translate.9529360.workers.dev/provider-direct-probe';
          let last = '';
          for (let i = 0; i < 8; i += 1) {
            const response = await fetch(url);
            last = await response.text();
            if (response.ok && last.trim().startsWith('{')) {
              console.log(last);
              process.exit(0);
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          console.error(last.slice(0, 300));
          process.exit(1);
          NODE
