name: provider-direct-probe

on:
  push:
    branches:
      - 'test/translation-live-smoke-*'
    paths:
      - '.github/workflows/provider-direct-probe.yml'
      - 'scripts/provider-direct-probe-worker.js'
      - 'wrangler-provider-probe.toml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-translation-production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Upload undeployed preview version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.44.0 versions upload --config wrangler-provider-probe.toml --preview-alias direct-provider-probe | tee /tmp/upload.txt
          VERSION_ID="$(sed -n 's/.*Worker Version ID: \([0-9a-f-]\+\).*/\1/p' /tmp/upload.txt | tail -n 1)"
          test -n "$VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Resolve preview URL
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.44.0 versions view "${{ steps.upload.outputs.version_id }}" --name geek-translate --json > /tmp/version.json
          cat /tmp/version.json
          PREVIEW_URL="$(node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/version.json','utf8'));const urls=Array.isArray(j.urls)?j.urls:[];const u=urls.find(x=>String(x).includes('workers.dev'))||urls[0]||'';process.stdout.write(String(u));")"
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Call providers directly through preview version
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          node -e "const u=new URL('/provider-direct-probe',process.env.PREVIEW_URL); fetch(u).then(async r=>{const t=await r.text();console.log(t);if(!r.ok)process.exit(1)}).catch(e=>{console.error(e.message);process.exit(1)})"
