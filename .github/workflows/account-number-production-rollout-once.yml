name: account-number-production-rollout-once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/account-number-production-rollout-once.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: account-number-production-rollout-production
  cancel-in-progress: false

jobs:
  subscription-rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-subscription-production
      url: https://admin.bbnba.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full tests
        run: npm test

      - name: Validate production entry syntax
        run: |
          node --check scripts/geek-subscription-worker.js
          node --check scripts/geek-subscription-worker-core.js
          node --check scripts/geek-subscription-entry.js
          node --check scripts/geek-subscription-atomic-entry.js
          node --check scripts/account-number.mjs
          node --check scripts/account-live-smoke.mjs

      - name: Confirm D1 restore point and preflight state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 time-travel info geek-subscriptions \
            --config wrangler-subscription.toml --json > "$RUNNER_TEMP/d1-restore-point.json"
          test -s "$RUNNER_TEMP/d1-restore-point.json"

          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote \
            --config wrangler-subscription.toml --json \
            --command "SELECT (SELECT COUNT(*) FROM users) AS users, (SELECT COUNT(*) FROM orders) AS orders, (SELECT COUNT(*) FROM pragma_table_info('users') WHERE name = 'account_no') AS has_account_no, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_users_account_no') AS has_account_index;" \
            > "$RUNNER_TEMP/account-preflight.json"

          node - "$RUNNER_TEMP/account-preflight.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = payload?.[0]?.results?.[0];
          if (!row) throw new Error('D1 preflight returned no aggregate row');
          if (Number(row.has_account_no) !== 0 || Number(row.has_account_index) !== 0) {
            throw new Error('Unexpected production state: account_no schema already exists; stop before mutation');
          }
          if (!Number.isSafeInteger(Number(row.users)) || !Number.isSafeInteger(Number(row.orders))) {
            throw new Error('Invalid production integrity totals');
          }
          console.log('OK production preflight: legacy schema confirmed and restore point available');
          NODE

      - name: Apply account number expand SQL 003 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --yes \
            --config wrangler-subscription.toml \
            --file scripts/migrations/003-account-number.sql

      - name: Verify SQL 003 without exposing account numbers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote \
            --config wrangler-subscription.toml --json \
            --command "SELECT (SELECT COUNT(*) FROM users WHERE account_no IS NULL) AS missing, (SELECT COUNT(*) FROM users WHERE account_no IS NOT NULL AND (length(account_no) <> 35 OR substr(account_no, 1, 3) <> 'GK-' OR substr(account_no, 4) GLOB '*[^0-9a-f]*')) AS malformed, (SELECT COUNT(*) FROM (SELECT account_no FROM users WHERE account_no IS NOT NULL GROUP BY account_no HAVING COUNT(*) > 1)) AS duplicate_groups;" \
            > "$RUNNER_TEMP/account-after-003.json"

          node - "$RUNNER_TEMP/account-after-003.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = payload?.[0]?.results?.[0];
          if (!row) throw new Error('D1 verification returned no aggregate row');
          for (const key of ['missing', 'malformed', 'duplicate_groups']) {
            if (Number(row[key]) !== 0) throw new Error(`003 verification failed: ${key}=${row[key]}`);
          }
          console.log('OK SQL 003: account numbers present, well-formed and unique');
          NODE

      - name: Deploy account-aware subscription Worker
        id: deploy
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-subscription.toml

      - name: Run production account smoke
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        run: node scripts/account-live-smoke.mjs

      - name: Apply post-deploy repair SQL 004 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --yes \
            --config wrangler-subscription.toml \
            --file scripts/migrations/004-account-number-repair.sql

      - name: Final D1 verification without exposing account numbers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote \
            --config wrangler-subscription.toml --json \
            --command "SELECT (SELECT COUNT(*) FROM users WHERE account_no IS NULL) AS missing, (SELECT COUNT(*) FROM users WHERE account_no IS NOT NULL AND (length(account_no) <> 35 OR substr(account_no, 1, 3) <> 'GK-' OR substr(account_no, 4) GLOB '*[^0-9a-f]*')) AS malformed, (SELECT COUNT(*) FROM (SELECT account_no FROM users WHERE account_no IS NOT NULL GROUP BY account_no HAVING COUNT(*) > 1)) AS duplicate_groups;" \
            > "$RUNNER_TEMP/account-final.json"

          node - "$RUNNER_TEMP/account-final.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = payload?.[0]?.results?.[0];
          if (!row) throw new Error('Final D1 verification returned no aggregate row');
          for (const key of ['missing', 'malformed', 'duplicate_groups']) {
            if (Number(row[key]) !== 0) throw new Error(`Final verification failed: ${key}=${row[key]}`);
          }
          console.log('OK final D1 account number integrity checks');
          NODE

      - name: Verify subscription health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 2 --retry-connrefused --max-time 20 'https://admin.bbnba.com/health')"
          test "$code" -ge 200
          test "$code" -lt 400
          echo "OK subscription health HTTP $code"

      - name: Record subscription rollout success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf 'Run: %s\n\n### Account-number production rollout\n\n- D1 SQL 003: success\n- Subscription Worker deploy: success\n- Register/login/me smoke: success\n- D1 SQL 004: success\n- Final NULL/format/uniqueness checks: success\n- Public health check: success\n\n003/004 were applied explicitly with `d1 execute --file` because production 002 predated the Wrangler migration ledger. No account numbers, passwords, login tokens, cookies, D1 row contents, or API credentials are included in this report.\n' "$RUN_URL" > "$RUNNER_TEMP/account-rollout-status.md"
          gh issue comment 23 --body-file "$RUNNER_TEMP/account-rollout-status.md"

  website-deploy:
    needs: subscription-rollout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-website-production
      url: https://geek.bbnba.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full tests
        run: npm test

      - name: Validate website syntax
        run: node --check scripts/geek-website-worker.js

      - name: Deploy website Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-website.toml

      - name: Verify website health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 2 --retry-connrefused --max-time 20 'https://geek.bbnba.com/health')"
          test "$code" -ge 200
          test "$code" -lt 400
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "OK website health HTTP $code"

      - name: Record website rollout success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HTTP_CODE: ${{ steps.verify.outputs.http_code }}
        shell: bash
        run: |
          printf 'Run: %s\n\n### Account-number website rollout\n\n- Website Worker deploy: success\n- Public verification: success (HTTP %s)\n\nNo tokens, cookies, database contents, Cloudflare response bodies, or user data are included in this report.\n' "$RUN_URL" "$HTTP_CODE" > "$RUNNER_TEMP/account-website-status.md"
          gh issue comment 21 --body-file "$RUNNER_TEMP/account-website-status.md"
