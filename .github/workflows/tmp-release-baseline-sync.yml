name: Temporary release baseline sync

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/release-baseline-sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-baseline-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded baseline patch
        run: node scripts/patch-release-baseline-sync.cjs
      - name: Verify scope and syntax
        shell: bash
        run: |
          node --check scripts/patch-release-baseline-sync.cjs
          node --check test/release-version-sync-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version ui src resources electron-builder.yml
      - name: Run contracts
        run: npm test
      - name: Commit bounded baseline sync
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json README.md AGENTS.md docs/release-security.md test/release-version-sync-contract.cjs; then
            echo "No bounded baseline changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json README.md AGENTS.md docs/release-security.md test/release-version-sync-contract.cjs
          git commit -m "docs: synchronize release baseline"
          git push origin HEAD:agent/release-baseline-sync
