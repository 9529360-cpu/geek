name: release-1.2.25-prep-once

on:
  push:
    branches:
      - release/1.2.25
    paths:
      - .github/workflows/release-1.2.25-prep-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.2.25
          fetch-depth: 0

      - name: Verify exact release base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "73d333f4f824721932186d7dc16e77ec9b4a932d"
          test "$(node -p "require('./package.json').version")" = "1.2.24"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.24"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.24"
          test "$(cat .github/release-client-version)" = "1.2.24"
          grep -q "const FALLBACK_VERSION = '1.2.22';" scripts/geek-website-worker.js

      - name: Prepare 1.2.25 metadata
        shell: bash
        run: |
          npm version 1.2.25 --no-git-tag-version
          printf '1.2.25\n' > .github/release-client-version
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/geek-website-worker.js';
          const before = "const FALLBACK_VERSION = '1.2.22';";
          const after = "const FALLBACK_VERSION = '1.2.24';";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before)) throw new Error('expected website fallback 1.2.22 not found');
          fs.writeFileSync(path, source.replace(before, after));
          NODE

      - name: Validate release-only diff
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.25"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.25"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.25"
          test "$(cat .github/release-client-version)" = "1.2.25"
          grep -q "const FALLBACK_VERSION = '1.2.24';" scripts/geek-website-worker.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/release-client-version' 'package-lock.json' 'package.json' 'scripts/geek-website-worker.js' | sort)"
          test "$changed" = "$expected"

      - name: Run release prep tests
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Commit release metadata and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/release-1.2.25-prep-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/release-client-version scripts/geek-website-worker.js .github/workflows/release-1.2.25-prep-once.yml
          git commit -m "release: prepare Geek 1.2.25"
          git push origin HEAD:release/1.2.25
