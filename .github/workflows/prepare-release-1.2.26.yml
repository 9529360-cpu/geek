name: prepare-release-1.2.26

on:
  push:
    branches:
      - 'release/1.2.26'
    paths:
      - '.github/workflows/prepare-release-1.2.26.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/1.2.26
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate release starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "600e005c311ca32f1e40d05f23bcff54bf12bc0c"
          test "$(node -p "require('./package.json').version")" = "1.2.25"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.25"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.25"
          test "$(tr -d '\r\n' < .github/release-client-version)" = "1.2.25"
          grep -Fq "const FALLBACK_VERSION = '1.2.24';" scripts/geek-website-worker.js
          test "$(git diff --name-only origin/master...HEAD)" = ".github/workflows/prepare-release-1.2.26.yml"

      - name: Prepare aligned release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.2.26 --no-git-tag-version
          printf '1.2.26\n' > .github/release-client-version
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/geek-website-worker.js';
          const before = "const FALLBACK_VERSION = '1.2.24';";
          const after = "const FALLBACK_VERSION = '1.2.25';";
          const source = fs.readFileSync(path, 'utf8');
          if (!source.includes(before) || source.includes(after)) {
            throw new Error('unexpected website fallback release state');
          }
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          rm .github/workflows/prepare-release-1.2.26.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "1.2.26"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.26"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.26"
          test "$(tr -d '\r\n' < .github/release-client-version)" = "1.2.26"
          grep -Fq "const FALLBACK_VERSION = '1.2.25';" scripts/geek-website-worker.js
          git diff --check
          printf '%s\n' \
            '.github/release-client-version' \
            'package-lock.json' \
            'package.json' \
            'scripts/geek-website-worker.js' > /tmp/expected-release-files
          git diff --name-only origin/master | sort > /tmp/actual-release-files
          sort -o /tmp/expected-release-files /tmp/expected-release-files
          diff -u /tmp/expected-release-files /tmp/actual-release-files
          npm test

      - name: Commit release candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/release-client-version package.json package-lock.json scripts/geek-website-worker.js .github/workflows/prepare-release-1.2.26.yml
          git commit -m 'release: prepare Geek 1.2.26'
          git push origin HEAD:release/1.2.26
