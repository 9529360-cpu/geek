name: retry-client-1.2.24-once

on:
  push:
    branches:
      - ops/retry-client-1.2.24-once
    paths:
      - '.github/workflows/retry-client-1.2.24-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MASTER_SHA: 0b4b66125442714366ab9864a02897e7dd01b7ca
      EXPECTED_VERSION: 1.2.24
    steps:
      - name: Verify exact master and version
        shell: bash
        run: |
          set -euo pipefail
          master_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')"
          if [ "$master_sha" != "$EXPECTED_MASTER_SHA" ]; then
            echo "master moved: expected=$EXPECTED_MASTER_SHA actual=$master_sha" >&2
            exit 1
          fi
          package_version="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/package.json?ref=master" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          marker="$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/${GITHUB_REPOSITORY}/contents/.github/release-client-version?ref=master" | tr -d '\r\n')"
          if [ "$package_version" != "$EXPECTED_VERSION" ] || [ "$marker" != "$EXPECTED_VERSION" ]; then
            echo "release version mismatch: package=$package_version marker=$marker expected=$EXPECTED_VERSION" >&2
            exit 1
          fi

      - name: Dispatch same-version release recovery
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release-client.yml/dispatches" -f ref=master
          echo "Dispatched release-client recovery for Geek $EXPECTED_VERSION at $EXPECTED_MASTER_SHA"
