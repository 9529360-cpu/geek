name: test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare supported dependency patches
        run: |
          npm update js-yaml @xmldom/xmldom fast-uri --package-lock-only --ignore-scripts
          npm install --package-lock-only --ignore-scripts --save-dev @wdio/cli@9.31.9 @wdio/local-runner@9.31.9 @wdio/mocha-framework@9.31.9
          git diff --stat -- package.json package-lock.json
          git diff -- package.json

      - name: Validate generated lockfile
        run: npm ci --ignore-scripts

      - name: Upload generated dependency candidate
        uses: actions/upload-artifact@v7
        with:
          name: dependency-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --json || true

      - name: Audit full dependency graph
        run: npm audit --json || true

      - name: Run tests
        run: npm test
