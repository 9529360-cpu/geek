name: test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  facebook-pure-webview-ab1:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch Facebook to pure WebView
        shell: pwsh
        run: |
          @'
          'use strict';
          const fs = require('node:fs');
          const file = 'ui/app.js';
          let source = fs.readFileSync(file, 'utf8');
          const replacements = [
            [
              "if (!(family === 'telegram' || family === 'line' || family === 'facebook')) return true;",
              "if (!(family === 'telegram' || family === 'line')) return true;"
            ],
            [
              "if (bridgePreloadPath && account.type !== 'line' && account.type !== 'line-business') {",
              "if (bridgePreloadPath && account.type !== 'line' && account.type !== 'line-business' && account.type !== 'facebook' && account.type !== 'facebook-business') {"
            ],
            [
              "if (account.type === 'facebook' || account.type === 'facebook-business') {\n      syncFacebookTranslationCfgToWebview(wv, account);\n      return;\n    }",
              "if (account.type === 'facebook' || account.type === 'facebook-business') {\n      return;\n    }"
            ]
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one match, got ${count}: ${from.slice(0, 80)}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(file, source, 'utf8');
          if (source.includes("family === 'telegram' || family === 'line' || family === 'facebook'")) throw new Error('Facebook bridge registration still enabled');
          if (source.includes("syncFacebookTranslationCfgToWebview(wv, account);\n      return;")) throw new Error('Facebook translation adapter injection still enabled');
          if (!source.includes("account.type !== 'facebook' && account.type !== 'facebook-business'")) throw new Error('Facebook guest preload exclusion missing');
          console.log('FACEBOOK_PURE_WEBVIEW_AB1_PATCH_OK');
          '@ | Set-Content -Path .facebook-pure-webview-ab1.cjs -Encoding utf8
          node .facebook-pure-webview-ab1.cjs
          Remove-Item .facebook-pure-webview-ab1.cjs

      - name: Install dependencies
        run: npm ci

      - name: Build unsigned Windows test package
        run: npm run dist:test

      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: geek-facebook-pure-webview-ab1
          path: dist-release/geek-setup-*.exe
          if-no-files-found: error
          retention-days: 3
