name: test

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  broadcast-test-installer:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 168
    runs-on: [self-hosted, windows, x64]
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout regression candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run full release-candidate build locally only
        run: npm run dist

      - name: Prepare regression artifact
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0, 8)
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $source = "dist-release\geek-setup-$($pkg.version).exe"
          if (-not (Test-Path $source)) { throw "Missing installer: $source" }
          New-Item -ItemType Directory -Force -Path 'dist-test' | Out-Null
          $target = "dist-test\geek-broadcast-test-$short.exe"
          Copy-Item -LiteralPath $source -Destination $target -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            purpose = 'broadcast-real-client-regression'
            sourceCommit = $env:GITHUB_SHA
            packageVersion = [string]$pkg.version
            installer = [System.IO.Path]::GetFileName($target)
            sha256 = $hash
            productionPublished = $false
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding UTF8 'dist-test\test-build-manifest.json'
          Write-Host "test-installer=$target"
          Write-Host "sha256=$hash"

      - name: Upload test installer
        uses: actions/upload-artifact@v4
        with:
          name: geek-broadcast-test-${{ github.sha }}
          path: |
            dist-test\geek-broadcast-test-*.exe
            dist-test\test-build-manifest.json
          if-no-files-found: error
          retention-days: 7
