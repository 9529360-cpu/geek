name: test
# Temporary Facebook smoke trigger. Remove after the fixed Windows artifact is generated.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - agent/facebook-translation
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

  facebook-windows-smoke:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/agent/facebook-translation') || (github.event_name == 'pull_request' && github.head_ref == 'agent/facebook-translation')) && github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Build Windows app
        run: npm run pack

      - name: Prepare isolated Facebook test package
        shell: pwsh
        run: |
          $root = Resolve-Path 'dist-release\win-unpacked'
          $exe = Get-ChildItem $root -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable was not found' }
          $updateConfig = Join-Path $root 'resources\app-update.yml'
          if (Test-Path $updateConfig) { Remove-Item $updateConfig -Force }
          $launcher = @'
@echo off
setlocal
set "GEEK_USER_DATA_DIR=%~dp0test-user-data"
for %%F in ("%~dp0*.exe") do (
  start "" "%%~fF" --disable-gpu-sandbox
  exit /b 0
)
echo Test executable not found.
pause
'@
          Set-Content -Path (Join-Path $root 'START-FB-TEST.cmd') -Value $launcher -Encoding ascii
          if (Test-Path $updateConfig) { throw 'Test build must not contain app-update.yml' }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath 'geek-facebook-test-win-fixed.zip' -Force

      - name: Upload Facebook test package
        uses: actions/upload-artifact@v4
        with:
          name: geek-facebook-test-win-fixed
          path: geek-facebook-test-win-fixed.zip
          retention-days: 3
          if-no-files-found: error

      - name: Record smoke success
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'test' -Force | Out-Null
          Set-Content -Path 'test/facebook-windows-smoke-result.txt' -Value "run_id=${env:GITHUB_RUN_ID}`nhead_sha=${env:GITHUB_SHA}`nresult=success`nartifact=geek-facebook-test-win-fixed" -Encoding ascii
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/facebook-windows-smoke-result.txt
          git commit -m "test: record Facebook Windows smoke success"
          git push origin HEAD:agent/facebook-translation
