name: deploy-subscription

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-subscription-worker.js'
      - 'scripts/geek-subscription-entry.js'
      - 'wrangler-subscription.toml'
      - 'test/account-*.cjs'
      - '.github/workflows/deploy-subscription.yml'

permissions:
  contents: write

concurrency:
  group: deploy-subscription-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-subscription-worker.js
          node --check scripts/geek-subscription-entry.js

      - name: Deploy subscription Worker
        id: deploy
        continue-on-error: true
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-subscription.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record deploy result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p test
          {
            echo "result=${DEPLOY_OUTCOME}"
            echo "run_id=${RUN_ID}"
            echo "source_sha=${SOURCE_SHA}"
          } > test/subscription-deploy-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/subscription-deploy-result.txt
          git commit -m "ci(account): record subscription deploy ${DEPLOY_OUTCOME}" || true
          git push

      - name: Fail if deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
