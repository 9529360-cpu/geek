name: deploy-subscription

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-subscription-worker.js'
      - 'scripts/geek-subscription-worker-core.js'
      - 'scripts/subscription-order-pay-method.mjs'
      - 'scripts/geek-subscription-entry.js'
      - 'scripts/account-live-smoke.mjs'
      - 'scripts/cloudflare-deploy-report.cjs'
      - 'wrangler-subscription.toml'
      - 'test/account-*.cjs'
      - 'test/subscription-order-pay-method-contract.cjs'
      - 'test/cloudflare-deploy-observability-contract.cjs'
      - '.github/workflows/deploy-subscription.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-subscription-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-subscription-production
      url: https://admin.bbnba.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-subscription-worker.js
          node --check scripts/geek-subscription-worker-core.js
          node --check scripts/subscription-order-pay-method.mjs
          node --check scripts/geek-subscription-entry.js
          node --check scripts/account-live-smoke.mjs
          node --check scripts/cloudflare-deploy-report.cjs

      - name: Deploy subscription Worker
        id: deploy
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-subscription.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live account smoke and publish non-sensitive status
        id: smoke
        if: steps.deploy.outcome == 'success'
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          node scripts/account-live-smoke.mjs
          SMOKE_RC=$?
          if [ "$SMOKE_RC" -eq 0 ]; then
            RESULT="OK"
          else
            RESULT="FAIL"
          fi
          printf 'Run: %s\n\n### Production account live smoke\n\n- Registration/login/authenticated API/cleanup: %s\n\nNo passwords, login tokens, cookies, D1 row contents, or API credentials are included in this report.\n' \
            "$RUN_URL" "$RESULT" > /tmp/account-smoke-status.md
          gh issue comment 23 --body-file /tmp/account-smoke-status.md
          COMMENT_RC=$?
          set -e
          if [ "$SMOKE_RC" -eq 0 ] && [ "$COMMENT_RC" -eq 0 ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Verify and publish non-sensitive deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_SERVICE: subscription
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          ACCOUNT_SMOKE_OUTCOME: ${{ steps.smoke.outputs.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node scripts/cloudflare-deploy-report.cjs
