name: deploy-subscription

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-subscription-worker.js'
      - 'scripts/geek-subscription-entry.js'
      - 'scripts/account-live-smoke.mjs'
      - 'wrangler-subscription.toml'
      - 'test/account-*.cjs'
      - '.github/workflows/deploy-subscription.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-subscription-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-subscription-worker.js
          node --check scripts/geek-subscription-entry.js
          node --check scripts/account-live-smoke.mjs

      - name: Deploy subscription Worker
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-subscription.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Live account smoke
        id: account_smoke
        continue-on-error: true
        run: node scripts/account-live-smoke.mjs
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publish non-sensitive account status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.account_smoke.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SMOKE_OUTCOME" = "success" ]; then
            RESULT="OK"
          else
            RESULT="FAIL"
          fi
          printf 'Run: %s\n\n### Production account live smoke\n\n- Registration: %s\n- Login: %s\n- Authenticated status/me: %s\n- Transient test account cleanup: %s\n\nNo passwords, login tokens, cookies, D1 row contents, or API credentials are included in this report.\n' \
            "$RUN_URL" "$RESULT" "$RESULT" "$RESULT" "$RESULT" > /tmp/account-smoke-status.md
          gh issue comment 23 --body-file /tmp/account-smoke-status.md

      - name: Fail if account smoke failed
        if: steps.account_smoke.outcome != 'success'
        run: exit 1
