name: validate-153-telegram-native-attachments-smoke

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/validate-153-telegram-native-attachments.yml

permissions:
  issues: write

jobs:
  windows-smoke:
    if: github.event.pull_request.head.ref == 'agent/152-telegram-native-attachments'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Record run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 153 --body "Windows workflow smoke run $env:GITHUB_RUN_ID started successfully."
