name: dependency-refresh-online

on:
  push:
    branches:
      - chore/dependency-security-2026-09-30
    paths:
      - package.json
      - .github/workflows/dependency-refresh-online.yml

permissions:
  contents: write

jobs:
  refresh-lock-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: chore/dependency-security-2026-09-30
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh only affected dependency families
        run: npm update electron undici brace-expansion fast-uri --package-lock-only --ignore-scripts

      - name: Install refreshed graph
        run: npm ci --ignore-scripts

      - name: Enforce dependency audit policy
        run: node scripts/dependency-audit-policy.cjs

      - name: Run repository tests
        run: npm test

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh patched dependency graph"
          git push origin HEAD:chore/dependency-security-2026-09-30
