name: Temporary translation save feedback patch

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/translation-save-feedback'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/translation-save-feedback
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded translation feedback patch
        run: |
          node scripts/patch-translation-save-feedback.cjs
          node scripts/patch-translation-save-feedback-legacy-contract.cjs
      - name: Verify syntax and release boundary
        shell: bash
        run: |
          node --check ui/translation-settings.js
          node --check test/translation-save-feedback-contract.cjs
          node --check test/translation-settings-ux-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version ui/app.js src/main.cjs src/preload.cjs
      - name: Run contracts
        run: npm test
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- ui/translation-settings.js ui/translation-settings.css test/translation-save-feedback-contract.cjs test/translation-settings-ux-contract.cjs; then
            echo "No bounded translation feedback changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/translation-settings.js ui/translation-settings.css test/translation-save-feedback-contract.cjs test/translation-settings-ux-contract.cjs
          git commit -m "ux: stabilize translation save feedback"
          git push origin HEAD:agent/translation-save-feedback
