name: LINE image group-send validation V4 (temporary)

on:
  push:
    branches:
      - diag/148-line-attachment-send-click-v4
  pull_request:
    branches:
      - test/148-baseline-1.2.12

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Verify exact 1.2.12 validation baseline and temporary scope
        shell: pwsh
        run: |
          $baseline = 'bbebd6c47dd88d8e61b241019e24fdf3ce768bef'
          git cat-file -e "$baseline^{commit}"
          if ($LASTEXITCODE -ne 0) { throw '1.2.12 baseline commit unavailable' }
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '1.2.12') { throw 'package version is not 1.2.12' }
          $marker = (Get-Content .github/release-client-version -Raw).Trim()
          if ($marker -ne '1.2.12') { throw 'release marker is not 1.2.12' }
          $preloadBlob = (git hash-object resources/s3loYR.js).Trim()
          if ($preloadBlob -ne 'ab3a974c603cb998e34cf221323062ced851e2fb') { throw 'LINE preload differs from exact 1.2.12 baseline' }
          $changed = @(git diff --name-only $baseline HEAD)
          if ($changed.Count -ne 3) { throw "unexpected committed validation scope: $changed" }
          if ($changed -notcontains '.github/workflows/line-attachment-static-probe-temp.yml') { throw 'temporary workflow missing from scope' }
          if ($changed -notcontains 'scripts/line-attachment-static-probe-temp.cjs') { throw 'V3 temporary patch script missing from scope' }
          if ($changed -notcontains 'scripts/line-attachment-send-click-v4-temp.cjs') { throw 'V4 temporary patch script missing from scope' }

      - name: Apply LINE paste-path and trusted-send-click validation patch
        run: node scripts/line-attachment-send-click-v4-temp.cjs

      - name: Verify runtime patch scope and translation parity
        shell: pwsh
        run: |
          $changed = @(git diff --name-only)
          $expected = @('src/main.cjs', 'ui/app.js', 'ui/translation-adapters.js')
          if ($changed.Count -ne $expected.Count) { throw "unexpected runtime patch count: $changed" }
          foreach ($file in $expected) { if ($changed -notcontains $file) { throw "missing runtime patch: $file" } }
          git diff --check
          $translationStat = @(git diff --numstat -- ui/translation-adapters.js)
          if ($translationStat.Count -ne 1) { throw "unexpected translation diff stat: $translationStat" }
          $parts = $translationStat[0] -split '\s+'
          if ($parts[0] -ne '7' -or $parts[1] -ne '1') { throw "translation patch is not the accepted route-only 7+/1- diff: $translationStat" }
          if (-not (Select-String -Path src/main.cjs -SimpleMatch 'DOM.setFileInputFiles' -Quiet)) { throw 'LINE CDP file input injection missing' }
          if (-not (Select-String -Path src/main.cjs -SimpleMatch 'PASTE_DISPATCHED' -Quiet)) { throw 'LINE paste dispatch missing' }
          if (-not (Select-String -Path src/main.cjs -SimpleMatch "targetPlatform === 'line' ? { x: 1, y: 1 }" -Quiet)) { throw 'LINE drag-position bypass missing' }
          if (Select-String -Path src/main.cjs -SimpleMatch 'getDropPos(partition, targetPlatform)' -Quiet) { throw 'old LINE drag-position path remains' }
          if (-not (Select-String -Path src/main.cjs -SimpleMatch 'Input.dispatchMouseEvent' -Quiet)) { throw 'trusted LINE send click missing' }
          if (-not (Select-String -Path src/main.cjs -SimpleMatch 'SEND_CLICK_DISPATCHED' -Quiet)) { throw 'trusted LINE send click result missing' }
          if (-not (Select-String -Path ui/app.js -SimpleMatch "action: 'send'" -Quiet)) { throw 'renderer LINE send action missing' }
          if (Select-String -Path ui/app.js -SimpleMatch 'sendButton.click();' -Quiet) { throw 'synthetic LINE file send click still present' }
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Syntax checks
        run: |
          node --check src/main.cjs
          node --check ui/app.js
          node --check ui/translation-adapters.js

      - name: Run 1.2.12 baseline contracts
        run: npm test

      - name: Build local validation installer only
        run: npm run dist:test

      - name: Validate installer and checksum
        shell: pwsh
        run: |
          $exe = Get-Item dist-release/geek-setup-1.2.12.exe -ErrorAction Stop
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "file=$($exe.Name)" | Out-File dist-release/validation-sha256.txt -Encoding ascii
          "sha256=$hash" | Out-File dist-release/validation-sha256.txt -Encoding ascii -Append
          "baseline=bbebd6c47dd88d8e61b241019e24fdf3ce768bef" | Out-File dist-release/validation-sha256.txt -Encoding ascii -Append
          "included=line-translation-route-fix + line-image-paste-path-fix + line-trusted-send-click" | Out-File dist-release/validation-sha256.txt -Encoding ascii -Append
          "revision=v4-line-trusted-send-click" | Out-File dist-release/validation-sha256.txt -Encoding ascii -Append
          Write-Host "LINE_IMAGE_VALIDATION_V4_INSTALLER_OK $hash"

      - name: Upload private validation installer
        uses: actions/upload-artifact@v4
        with:
          name: geek-1.2.12-line-image-validation-v4
          path: |
            dist-release/geek-setup-1.2.12.exe
            dist-release/validation-sha256.txt
          if-no-files-found: error
          retention-days: 7
