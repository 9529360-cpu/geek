name: prepare-1.2.29-stable-fallback

on:
  push:
    branches:
      - 'release/1.2.29-stable-fallback'
    paths:
      - '.github/workflows/prepare-1.2.29-stable-fallback.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fallback branch
        uses: actions/checkout@v7
        with:
          ref: release/1.2.29-stable-fallback
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate starting point
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          test "$(git merge-base HEAD origin/master)" = "a8447e7d6391c7c2b81c63f5b240ad592e2f75c0"
          test "$(node -p "require('./package.json').version")" = "1.2.28"
          grep -Fq "const FALLBACK_VERSION = '1.2.27';" scripts/geek-website-worker.js
          test "$(git diff --name-only origin/master...HEAD)" = ".github/workflows/prepare-1.2.29-stable-fallback.yml"

      - name: Promote previous stable fallback
        shell: bash
        run: |
          set -euo pipefail
          sed -i "s/const FALLBACK_VERSION = '1.2.27';/const FALLBACK_VERSION = '1.2.28';/" scripts/geek-website-worker.js
          rm .github/workflows/prepare-1.2.29-stable-fallback.yml

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate fallback change
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const FALLBACK_VERSION = '1.2.28';" scripts/geek-website-worker.js
          git diff --check
          test "$(git diff --name-only origin/master)" = "scripts/geek-website-worker.js"
          npm test

      - name: Commit fallback update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/geek-website-worker.js .github/workflows/prepare-1.2.29-stable-fallback.yml
          git commit -m 'fix: advance website fallback to 1.2.28'
          git push origin HEAD:release/1.2.29-stable-fallback
