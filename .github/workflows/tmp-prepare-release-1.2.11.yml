name: Temporary prepare Geek 1.2.11

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/1.2.11'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.2.11
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply one-shot release preparation
        run: node scripts/prepare-release-1.2.11.cjs
      - name: Verify exact release scope
        shell: bash
        run: |
          node --check scripts/prepare-release-1.2.11.cjs
          node --check scripts/geek-website-worker.js
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/release-client-version' \
            'README.md' \
            'docs/github-control-plane.md' \
            'docs/release-security.md' \
            'package-lock.json' \
            'package.json' \
            'scripts/geek-website-worker.js' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected release diff scope:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const marker = fs.readFileSync('.github/release-client-version', 'utf8').trim();
          const worker = fs.readFileSync('scripts/geek-website-worker.js', 'utf8');
          if (pkg.version !== '1.2.11') throw new Error(`package=${pkg.version}`);
          if (lock.version !== '1.2.11' || lock.packages?.['']?.version !== '1.2.11') throw new Error('lockfile version mismatch');
          if (marker !== '1.2.11') throw new Error(`marker=${marker}`);
          if (!worker.includes("const FALLBACK_VERSION = '1.2.10';")) throw new Error('website fallback must be previous stable 1.2.10');
          NODE
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run full release-preparation contracts
        run: npm test
      - name: Commit release version surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/release-client-version \
            README.md \
            docs/github-control-plane.md \
            docs/release-security.md \
            package-lock.json \
            package.json \
            scripts/geek-website-worker.js
          git commit -m "release: prepare Geek 1.2.11"
          git push origin HEAD:release/1.2.11
