name: account-ipc-type-e2e-bootstrap

on:
  push:
    branches:
      - refactor/account-ipc-ingress-owner
    paths:
      - 'scripts/account-ipc-type-e2e-bootstrap.cjs'
      - '.github/workflows/account-ipc-type-e2e-bootstrap.yml'

permissions:
  contents: write

jobs:
  strengthen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/account-ipc-ingress-owner
          fetch-depth: 0
      - run: node scripts/account-ipc-type-e2e-bootstrap.cjs
      - run: |
          git diff --check
          node --check e2e/specs/shell-smoke.e2e.cjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: cover unsupported account type matrix in Electron'
          git push origin HEAD:refactor/account-ipc-ingress-owner
