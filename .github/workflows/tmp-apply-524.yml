name: tmp-apply-524

on:
  push:
    branches:
      - fix/524-translation-bridge-readiness

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused bridge fix
        run: node scripts/tmp-apply-524.cjs
      - name: Focused validation
        run: |
          node --check ui/app.js
          node --check ui/translation-adapters.js
          node test/translation-bridge-readiness-contract.cjs
          node test/bridge-ipc-contract.cjs
          node test/translation-send-chat-switch-contract.cjs
          git diff --check
      - name: Commit product-only patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: make translation bridge fallback safe"
          git push origin HEAD:${GITHUB_REF_NAME}
