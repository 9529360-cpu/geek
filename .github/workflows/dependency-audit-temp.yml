name: dependency-audit-temp

on:
  push:
    branches:
      - agent/dependency-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install lockfile dependencies without scripts
        run: npm ci --ignore-scripts

      - name: Audit runtime dependencies
        shell: bash
        run: |
          echo '=== RUNTIME AUDIT ==='
          npm audit --omit=dev --json || true

      - name: Audit all dependencies
        shell: bash
        run: |
          echo '=== FULL AUDIT ==='
          npm audit --json || true
