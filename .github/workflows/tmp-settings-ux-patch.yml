name: Temporary settings UX patch

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/settings-ux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-ux
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded settings UX patch
        run: node scripts/patch-settings-ux.cjs
      - name: Verify syntax and release boundary
        shell: bash
        run: |
          node --check ui/app.js
          node --check ui/settings-controller.js
          node --check test/settings-ux-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version
      - name: Run contracts
        run: npm test
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- ui/app.js ui/index.html; then
            echo "No bounded settings patch changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/app.js ui/index.html
          git commit -m "ux: wire task-oriented settings"
          git push origin HEAD:agent/settings-ux
