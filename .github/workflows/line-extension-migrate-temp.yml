name: line-extension-migrate-temp

on:
  push:
    branches:
      - agent/line-extension-electron43
    paths:
      - '.github/workflows/line-extension-migrate-temp.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/line-extension-electron43

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch deprecated LINE extension API and add contract
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs');
          const mainPath = 'src/main.cjs';
          let main = fs.readFileSync(mainPath, 'utf8');
          const oldCall = 'const ext = await ses.loadExtension(LINE_EXTENSION_PATH);';
          const newCall = 'const ext = await ses.extensions.loadExtension(LINE_EXTENSION_PATH);';
          if (!main.includes(oldCall) && !main.includes(newCall)) {
            throw new Error('LINE extension loader call not found');
          }
          main = main.replace(oldCall, newCall);
          main = main.replace('session.loadExtension 需要真实文件', 'ses.extensions.loadExtension 需要真实文件');
          fs.writeFileSync(mainPath, main, 'utf8');

          const contract = String.raw`'use strict';

const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.join(__dirname, '..');
const main = fs.readFileSync(path.join(root, 'src', 'main.cjs'), 'utf8');

assert.match(
  main,
  /ses\.extensions\.loadExtension\(LINE_EXTENSION_PATH\)/,
  'LINE must use Electron Extensions.loadExtension on supported Electron releases'
);
assert.doesNotMatch(
  main,
  /ses\.loadExtension\(LINE_EXTENSION_PATH\)/,
  'deprecated Session.loadExtension must not be reintroduced for LINE'
);
assert.match(main, /session\.fromPartition\(partition, \{ cache: true \}\)/, 'LINE extension must stay isolated in its persistent account session');

console.log('line-extension-api-contract: ok');
`;
          fs.writeFileSync('test/line-extension-api-contract.cjs', contract, 'utf8');
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\patch-line-extension.cjs
          node $env:RUNNER_TEMP\patch-line-extension.cjs
          node --check src/main.cjs

      - name: Install dependencies and Electron runtime
        shell: pwsh
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run electron:install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run repository tests
        run: npm test

      - name: Smoke-load bundled LINE MV3 extension in Electron 43
        shell: pwsh
        run: |
          @'
          'use strict';
          const { app, session } = require('electron');
          const path = require('node:path');

          const EXPECTED_ID = 'ophjlpahpchlmihnnnihgmmeilfjmjjc';
          const extensionPath = path.join(process.cwd(), 'resources', 'extensions', 'line-3.5.1');
          const partition = 'persist:geek-line-extension-ci-smoke';

          function timeout(ms, message) {
            return new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms));
          }

          app.whenReady().then(async () => {
            const ses = session.fromPartition(partition, { cache: true });
            if (!ses.extensions || typeof ses.extensions.loadExtension !== 'function') {
              throw new Error('Electron Extensions.loadExtension API unavailable');
            }
            const ready = new Promise((resolve) => {
              const handler = (_event, extension) => {
                if (extension && extension.id === EXPECTED_ID) resolve(extension);
              };
              ses.extensions.on('extension-ready', handler);
            });
            const loaded = await ses.extensions.loadExtension(extensionPath);
            if (!loaded || loaded.id !== EXPECTED_ID) {
              throw new Error(`unexpected LINE extension id: ${loaded && loaded.id}`);
            }
            await Promise.race([ready, timeout(15000, 'LINE extension-ready timeout')]);
            const active = ses.extensions.getExtension(EXPECTED_ID);
            if (!active) throw new Error('LINE extension missing after load');
            ses.extensions.removeExtension(EXPECTED_ID);
            console.log(`LINE_EXTENSION_ELECTRON43_SMOKE_OK electron=${process.versions.electron} chromium=${process.versions.chrome}`);
          }).then(() => app.quit()).catch((error) => {
            console.error(`LINE_EXTENSION_ELECTRON43_SMOKE_FAIL ${String(error && error.message || error)}`);
            app.exit(1);
          });
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP\line-extension-smoke.cjs
          $output = & '.\node_modules\electron\dist\electron.exe' $env:RUNNER_TEMP\line-extension-smoke.cjs 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          if (($output | Out-String) -notmatch 'LINE_EXTENSION_ELECTRON43_SMOKE_OK') {
            throw 'LINE extension smoke exited without success marker'
          }

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cjs test/line-extension-api-contract.cjs
          if git diff --cached --quiet; then
            echo 'No migration changes to commit'
            exit 0
          fi
          git commit -m 'compat: migrate LINE extension API'
          git push origin HEAD:agent/line-extension-electron43

# retrigger after workflow exists on branch
