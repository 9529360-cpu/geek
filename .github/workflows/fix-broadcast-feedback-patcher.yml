name: repair-broadcast-feedback-patcher
on:
  push:
    branches: [fix/broadcast-nonblocking-feedback]
    paths: [.github/workflows/fix-broadcast-feedback-patcher.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broadcast-nonblocking-feedback
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/apply-broadcast-feedback-patch.yml')
          s=p.read_text()
          old="''').replace(/^          /gm, '')"
          if old not in s: raise SystemExit('invalid Python line not found')
          p.write_text(s.replace(old, "''')", 1))
          PY
          rm .github/workflows/fix-broadcast-feedback-patcher.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: repair broadcast feedback patch runner"
          git push origin HEAD:fix/broadcast-nonblocking-feedback
