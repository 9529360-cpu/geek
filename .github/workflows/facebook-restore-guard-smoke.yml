name: facebook-restore-guard-smoke

on:
  push:
    branches:
      - agent/facebook-translation-clean
    paths:
      - '.github/workflows/facebook-restore-guard-smoke.yml'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/facebook-restore-guard-smoke.yml'

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/facebook-translation-clean
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply restore guard patch
        run: node scripts/patch-facebook-restore-guard.mjs

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Commit guarded Facebook adapter
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/facebook-translation-adapter.js test/facebook-translation-contract.cjs
          git diff --cached --check
          git commit -m "fix(facebook): stay passive during encrypted-chat restore"
          git push origin HEAD:agent/facebook-translation-clean

      - name: Build unpacked Windows app
        run: npm run pack

      - name: Prepare isolated restore test package
        shell: pwsh
        run: |
          $root = Resolve-Path 'dist-release\win-unpacked'
          $exe = Get-ChildItem $root -Filter '*.exe' | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable was not found' }
          $updateConfig = Join-Path $root 'resources\app-update.yml'
          if (Test-Path $updateConfig) { Remove-Item $updateConfig -Force }
          $launcher = @'
          @echo off
          setlocal
          set "GEEK_USER_DATA_DIR=%~dp0test-user-data"
          for %%F in ("%~dp0*.exe") do (
            start "" "%%~fF" --disable-gpu-sandbox
            exit /b 0
          )
          echo Test executable not found.
          pause
          '@
          Set-Content -Path (Join-Path $root 'START-FB-RESTORE-TEST.cmd') -Value $launcher -Encoding ascii
          if (Test-Path $updateConfig) { throw 'Smoke build must not contain app-update.yml' }
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath 'geek-facebook-restore-guard-win.zip' -Force

      - name: Upload smoke package
        uses: actions/upload-artifact@v4
        with:
          name: geek-facebook-restore-guard-win
          path: geek-facebook-restore-guard-win.zip
          retention-days: 3
          if-no-files-found: error
