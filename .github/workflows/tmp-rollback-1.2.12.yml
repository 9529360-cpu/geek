name: tmp-rollback-1.2.12

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/tmp-rollback-1.2.12.yml'

permissions:
  contents: read

concurrency:
  group: rollback-client-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run repository contracts
        run: npm test

      - name: Restore verified 1.2.12 updater metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f rollback-latest.yml
          npx --yes wrangler@4.36.0 r2 object get 'geek-release/rollback/latest-1.2.12.yml' --file rollback-latest.yml --remote
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync('rollback-latest.yml', 'utf8');
          if (!/^version:\s*1\.2\.12\s*$/m.test(text)) throw new Error('rollback metadata version is not 1.2.12');
          if (!/^path:\s*geek-setup-1\.2\.12\.exe\s*$/m.test(text)) throw new Error('rollback metadata artifact path is not Geek 1.2.12');
          NODE
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file rollback-latest.yml --remote

      - name: Verify public rollback
        run: |
          node scripts/release-public-check.cjs verify \
            --root 'https://geek-release.9529360.workers.dev' \
            --version 1.2.12 \
            --attempts 18 \
            --delay-ms 10000

      - name: Record rollback summary
        shell: bash
        run: |
          {
            echo 'Geek production updater rollback verified.'
            echo ''
            echo '- Restored public latest.yml from retained versioned rollback snapshot.'
            echo '- Public version: 1.2.12'
            echo '- Installer and blockmap reachability: verified by release-public-check.cjs'
            echo '- Repository source/version marker: unchanged'
          } >> "$GITHUB_STEP_SUMMARY"
