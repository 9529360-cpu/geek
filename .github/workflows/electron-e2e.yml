name: electron-e2e

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'e2e/**'
      - 'test/electron-e2e-safety-contract.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'e2e/**'
      - 'test/electron-e2e-safety-contract.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-e2e.yml'

permissions:
  contents: read

concurrency:
  group: geek-electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, windows, x64, geek-real-client]
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check diff whitespace
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'
          } else {
            git diff --check HEAD^
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prepare Electron runtime explicitly
        run: npm run electron:install

      - name: Run isolated Windows Electron shell smoke
        env:
          FORCE_COLOR: '0'
        run: npm run test:e2e
