name: electron-e2e

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'e2e/**'
      - 'test/electron-e2e-safety-contract.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-e2e.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'ui/**'
      - 'resources/**'
      - 'e2e/**'
      - 'test/electron-e2e-safety-contract.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/electron-e2e.yml'

permissions:
  contents: read

concurrency:
  group: geek-electron-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check diff whitespace
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            git diff --check HEAD^
          fi

  smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: whitespace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Electron Linux runtime dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb \
            xauth \
            libgtk-3-0t64 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libcups2t64 \
            libnss3 \
            libnspr4 \
            libgbm1 \
            libdrm2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2 \
            libdbus-1-3

      - name: Allow Electron namespace sandbox on hosted Ubuntu
        shell: bash
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prepare Electron runtime explicitly
        run: npm run electron:install

      - name: Run isolated Electron shell smoke
        env:
          FORCE_COLOR: '0'
        run: xvfb-run -a npm run test:e2e
