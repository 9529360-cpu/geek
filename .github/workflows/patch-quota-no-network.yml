name: temporary quota no-network patch

on:
  pull_request:
    branches:
      - master
    paths:
      - src/subscription.cjs
      - test/translation-quota-hot-path-contract.cjs
      - .github/workflows/patch-quota-no-network.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/fix-quota-no-network-options'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-quota-no-network-options
          fetch-depth: 0

      - name: Apply exact quota options patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/subscription.cjs')
          source = path.read_text(encoding='utf-8')
          old = "  async function getQuota(force = false, opts = {}) {\n    const state = await load();\n"
          new = (
              "  async function getQuota(force = false, opts = {}) {\n"
              "    if (force && typeof force === 'object' && !Array.isArray(force)) {\n"
              "      opts = force;\n"
              "      force = false;\n"
              "    }\n"
              "    const state = await load();\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one getQuota anchor, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- src/subscription.cjs
          test "$(git diff --numstat -- src/subscription.cjs | awk '{print $1 ":" $2}')" = "4:0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-quota-no-network.yml
          git add src/subscription.cjs .github/workflows/patch-quota-no-network.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: honor quota no-network options"
          git push origin HEAD:agent/fix-quota-no-network-options
