name: apply-translation-provider-resilience

on:
  push:
    branches:
      - fix/translation-provider-resilience-20260915
    paths:
      - scripts/apply-translation-provider-resilience.cjs
      - .github/workflows/apply-translation-provider-resilience.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply focused patch
        run: node scripts/apply-translation-provider-resilience.cjs

      - name: Validate focused contract
        run: |
          node --check scripts/geek-translate-worker.js
          node test/translation-provider-resilience-contract.cjs
          node test/translation-provider-health-isolation-contract.cjs
          node test/translation-worker-deadline-contract.cjs

      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden translation provider failover"
          git push origin "HEAD:${GITHUB_REF_NAME}"
