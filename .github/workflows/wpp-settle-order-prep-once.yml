name: wpp-settle-order-prep-once

on:
  push:
    branches:
      - fix/whatsapp-waplus-after-wpp-settle
    paths:
      - '.github/workflows/wpp-settle-order-prep-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-waplus-after-wpp-settle

      - name: Verify WA-JS 4.5.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').dependencies['@wppconnect/wa-js']")" = "4.5.0"
          test "$(node -p "require('./package-lock.json').packages['node_modules/@wppconnect/wa-js'].version")" = "4.5.0"
          test "$(node -p "require('./package.json').version")" = "1.2.20"

      - name: Gate WAPLUS behind upstream WPP injected event
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'src/main.cjs';
          const source = fs.readFileSync(file, 'utf8');
          const anchor = "        await wc.executeJavaScript(wppScript).catch(() => null);";
          const occurrences = source.split(anchor).length - 1;
          if (occurrences !== 1) {
            throw new Error(`expected exactly one WPP execution anchor, found ${occurrences}`);
          }
          const waitBlock = String.raw`

        // WA-JS 4.5.0 emits loader.injected only after WhatsApp's Meta module
        // graph has settled. WAPLUS embeds an older loader, so starting it before
        // this boundary can run one-shot Store registrars against missing modules.
        const wppMetaSettled = await wc.executeJavaScript(` + "`" + `(async () => {
          if (window.WPP?.isInjected === true) return true;
          const loader = window.WPP?.loader;
          if (!loader || typeof loader.onInjected !== 'function') return false;
          return await new Promise((resolve) => loader.onInjected(() => resolve(true)));
        })()` + "`" + `).catch(() => false);
        if (!wppMetaSettled) throw new Error('WPP_META_NOT_SETTLED');`;
          const next = source.replace(anchor, anchor + waitBlock);
          const waitPos = next.indexOf('const wppMetaSettled =');
          const waplusPos = next.indexOf("const waplusScript = await fs.readFile(path.join(__dirname, '../resources/waplus-wpp.js')");
          if (waitPos < 0 || waplusPos < 0 || waitPos > waplusPos) {
            throw new Error('WPP settle gate is not before WAPLUS injection');
          }
          fs.writeFileSync(file, next);
          NODE
          node --check src/main.cjs
          git diff --check

      - name: Verify single-owner ordering contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync('src/main.cjs', 'utf8');
          const official = source.indexOf("../node_modules/@wppconnect/wa-js/dist/wppconnect-wa.js");
          const eventGate = source.indexOf("loader.onInjected(() => resolve(true))");
          const waplus = source.indexOf("../resources/waplus-wpp.js");
          if (!(official >= 0 && eventGate > official && waplus > eventGate)) {
            throw new Error('runtime order must be official WA-JS -> loader.onInjected -> WAPLUS');
          }
          if ((source.match(/WPP_META_NOT_SETTLED/g) || []).length !== 1) {
            throw new Error('settle failure must have one fail-closed owner');
          }
          NODE

      - name: Install and run contracts
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Commit only the runtime owner change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          test "$changed" = "src/main.cjs"
          git rm .github/workflows/wpp-settle-order-prep-once.yml
          git config user.name 'Geek Validation Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.cjs
          git commit -m 'fix: wait for WPP settle before WAPLUS injection'
          git push origin HEAD:fix/whatsapp-waplus-after-wpp-settle
