name: wpp-settle-order-prep-once

on:
  push:
    branches:
      - fix/whatsapp-waplus-after-wpp-settle
    paths:
      - '.github/workflows/wpp-settle-order-prep-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-waplus-after-wpp-settle

      - name: Verify WA-JS 4.5.0 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').dependencies['@wppconnect/wa-js']")" = "4.5.0"
          test "$(node -p "require('./package-lock.json').packages['node_modules/@wppconnect/wa-js'].version")" = "4.5.0"
          test "$(node -p "require('./package.json').version")" = "1.2.20"

      - name: Apply single-owner runtime patch
        run: node scripts/patch-wpp-settle-once.cjs

      - name: Validate runtime source
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.cjs
          git diff --check

      - name: Install and run contracts
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Commit only runtime owner change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only | sort)"
          test "$changed" = "src/main.cjs"
          git rm .github/workflows/wpp-settle-order-prep-once.yml scripts/patch-wpp-settle-once.cjs
          git config user.name 'Geek Validation Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.cjs
          git commit -m 'fix: wait for WPP settle before WAPLUS injection'
          git push origin HEAD:fix/whatsapp-waplus-after-wpp-settle
