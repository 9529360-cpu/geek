name: account-number-production-resume-once

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/account-number-production-resume-once.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: account-number-production-rollout-production
  cancel-in-progress: false

jobs:
  subscription-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cloudflare-subscription-production
      url: https://admin.bbnba.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full tests
        run: npm test

      - name: Confirm post-003 D1 state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 time-travel info geek-subscriptions \
            --config wrangler-subscription.toml --json > "$RUNNER_TEMP/d1-resume-restore-point.json"
          test -s "$RUNNER_TEMP/d1-resume-restore-point.json"

          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote \
            --config wrangler-subscription.toml --json \
            --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('users') WHERE name = 'account_no') AS has_account_no, (SELECT COUNT(*) FROM sqlite_master WHERE type = 'index' AND name = 'idx_users_account_no') AS has_account_index, (SELECT COUNT(*) FROM users WHERE account_no IS NULL) AS missing, (SELECT COUNT(*) FROM users WHERE account_no IS NOT NULL AND (length(account_no) <> 35 OR substr(account_no, 1, 3) <> 'GK-' OR substr(account_no, 4) GLOB '*[^0-9a-f]*')) AS malformed, (SELECT COUNT(*) FROM (SELECT account_no FROM users WHERE account_no IS NOT NULL GROUP BY account_no HAVING COUNT(*) > 1)) AS duplicate_groups;" \
            > "$RUNNER_TEMP/account-resume-preflight.json"

          node - "$RUNNER_TEMP/account-resume-preflight.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const row = payload?.[0]?.results?.[0];
          if (!row) throw new Error('D1 resume preflight returned no aggregate row');
          if (Number(row.has_account_no) !== 1 || Number(row.has_account_index) !== 1) throw new Error('003 schema/index missing');
          if (!Number.isSafeInteger(Number(row.missing)) || Number(row.missing) < 0) throw new Error('Invalid NULL account_no count');
          for (const key of ['malformed', 'duplicate_groups']) {
            if (Number(row[key]) !== 0) throw new Error(`Resume preflight failed: ${key}=${row[key]}`);
          }
          console.log(`OK post-003 D1 state: repair window NULL rows=${Number(row.missing)}`);
          NODE

      - name: Run canonical production account smoke
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          GEEK_SUBSCRIPTION_API_URL: https://admin.bbnba.com
        run: node scripts/account-live-smoke.mjs

      - name: Apply post-deploy repair SQL 004 only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --yes \
            --config wrangler-subscription.toml \
            --file scripts/migrations/004-account-number-repair.sql

      - name: Final D1 verification and transient test cleanup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote \
            --config wrangler-subscription.toml --json \
            --command "DELETE FROM users WHERE email LIKE 'smoke-%@example.invalid' OR email LIKE 'diag-%@example.invalid'; SELECT (SELECT COUNT(*) FROM users WHERE account_no IS NULL) AS missing, (SELECT COUNT(*) FROM users WHERE account_no IS NOT NULL AND (length(account_no) <> 35 OR substr(account_no, 1, 3) <> 'GK-' OR substr(account_no, 4) GLOB '*[^0-9a-f]*')) AS malformed, (SELECT COUNT(*) FROM (SELECT account_no FROM users WHERE account_no IS NOT NULL GROUP BY account_no HAVING COUNT(*) > 1)) AS duplicate_groups, (SELECT COUNT(*) FROM users WHERE email LIKE 'smoke-%@example.invalid' OR email LIKE 'diag-%@example.invalid') AS transient_test_users;" \
            > "$RUNNER_TEMP/account-resume-final.json"

          node - "$RUNNER_TEMP/account-resume-final.json" <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const rows = payload.flatMap((entry) => Array.isArray(entry?.results) ? entry.results : []);
          const row = rows.find((item) => item && Object.prototype.hasOwnProperty.call(item, 'missing'));
          if (!row) throw new Error('Final D1 verification returned no aggregate row');
          for (const key of ['missing', 'malformed', 'duplicate_groups', 'transient_test_users']) {
            if (Number(row[key]) !== 0) throw new Error(`Final verification failed: ${key}=${row[key]}`);
          }
          console.log('OK final D1 integrity and transient test cleanup');
          NODE

      - name: Verify subscription health
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 2 --retry-connrefused --max-time 20 'https://admin.bbnba.com/health')"
          test "$code" -ge 200
          test "$code" -lt 400
          echo "OK subscription health HTTP $code"

      - name: Record subscription resume success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          printf 'Run: %s\n\n### Account-number production resume\n\n- Post-003 D1 state: healthy\n- Canonical register/login/me smoke: success\n- D1 SQL 004: success\n- Final NULL/format/uniqueness checks: success\n- Transient smoke/diagnostic accounts: cleaned\n- Subscription health: success\n\nNo account numbers, passwords, login tokens, cookies, D1 row contents, or API credentials are included in this report.\n' "$RUN_URL" > "$RUNNER_TEMP/account-resume-status.md"
          gh issue comment 23 --body-file "$RUNNER_TEMP/account-resume-status.md"

  website-deploy:
    needs: subscription-resume
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-website-production
      url: https://geek.bbnba.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full tests
        run: npm test

      - name: Validate website syntax
        run: node --check scripts/geek-website-worker.js

      - name: Deploy website Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-website.toml

      - name: Verify website health
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 3 --retry-delay 2 --retry-connrefused --max-time 20 'https://geek.bbnba.com/health')"
          test "$code" -ge 200
          test "$code" -lt 400
          echo "http_code=$code" >> "$GITHUB_OUTPUT"
          echo "OK website health HTTP $code"

      - name: Record website deploy success
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HTTP_CODE: ${{ steps.verify.outputs.http_code }}
        shell: bash
        run: |
          printf 'Run: %s\n\n### Account-number website rollout\n\n- Website Worker deploy: success\n- Public verification: success (HTTP %s)\n\nNo tokens, cookies, database contents, Cloudflare response bodies, or user data are included in this report.\n' "$RUN_URL" "$HTTP_CODE" > "$RUNNER_TEMP/account-website-status.md"
          gh issue comment 21 --body-file "$RUNNER_TEMP/account-website-status.md"
