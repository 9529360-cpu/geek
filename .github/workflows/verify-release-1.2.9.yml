# independent public verification for master ab5038ed0c718676268acae9546de648919ef5fe
name: verify-release-1.2.9

on:
  push:
    branches:
      - release/1.2.9
    paths:
      - '.github/workflows/verify-release-1.2.9.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: verify-release-1.2.9
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_RELEASE_SHA: ab5038ed0c718676268acae9546de648919ef5fe
    steps:
      - name: Verify public updater artifacts
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          base='https://geek-release.9529360.workers.dev'
          expected_version='1.2.9'
          expected_path='geek-setup-1.2.9.exe'
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          result='failure'
          latest_status='000'
          installer_status='000'
          blockmap_status='000'
          installer_bytes='0'
          blockmap_bytes='0'
          hash_match='no'

          for attempt in $(seq 1 20); do
            cache_bust="$(date +%s)-${attempt}"
            latest_status="$(curl --silent --show-error --location --output "$work/latest.yml" --write-out '%{http_code}' "$base/latest.yml?verify=$cache_bust" || true)"
            if [ "$latest_status" = '200' ]; then
              version="$(awk '/^version:[[:space:]]*/ { print $2; exit }' "$work/latest.yml")"
              artifact_path="$(awk '/^path:[[:space:]]*/ { sub(/^path:[[:space:]]*/, ""); print; exit }' "$work/latest.yml")"
              expected_sha512="$(awk '/^sha512:[[:space:]]*/ { print $2; exit }' "$work/latest.yml")"
              if [ "$version" = "$expected_version" ] && [ "$artifact_path" = "$expected_path" ] && [ -n "$expected_sha512" ]; then
                installer_status="$(curl --silent --show-error --location --output "$work/installer.exe" --write-out '%{http_code}' "$base/$expected_path?verify=$cache_bust" || true)"
                blockmap_status="$(curl --silent --show-error --location --output "$work/installer.exe.blockmap" --write-out '%{http_code}' "$base/$expected_path.blockmap?verify=$cache_bust" || true)"
                if [ "$installer_status" = '200' ] && [ "$blockmap_status" = '200' ] && [ -s "$work/installer.exe" ] && [ -s "$work/installer.exe.blockmap" ]; then
                  actual_sha512="$(openssl dgst -sha512 -binary "$work/installer.exe" | base64 -w0)"
                  if [ "$actual_sha512" = "$expected_sha512" ]; then
                    installer_bytes="$(stat -c '%s' "$work/installer.exe")"
                    blockmap_bytes="$(stat -c '%s' "$work/installer.exe.blockmap")"
                    hash_match='yes'
                    result='success'
                    break
                  fi
                fi
              fi
            fi
            rm -f "$work/installer.exe" "$work/installer.exe.blockmap"
            sleep 5
          done

          {
            echo "result=$result"
            echo "latest_status=$latest_status"
            echo "installer_status=$installer_status"
            echo "blockmap_status=$blockmap_status"
            echo "installer_bytes=$installer_bytes"
            echo "blockmap_bytes=$blockmap_bytes"
            echo "hash_match=$hash_match"
            echo "verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish non-sensitive verification result
        if: always()
        uses: actions/github-script@v7
        env:
          VERIFY_RESULT: ${{ steps.verify.outputs.result }}
          LATEST_STATUS: ${{ steps.verify.outputs.latest_status }}
          INSTALLER_STATUS: ${{ steps.verify.outputs.installer_status }}
          BLOCKMAP_STATUS: ${{ steps.verify.outputs.blockmap_status }}
          INSTALLER_BYTES: ${{ steps.verify.outputs.installer_bytes }}
          BLOCKMAP_BYTES: ${{ steps.verify.outputs.blockmap_bytes }}
          HASH_MATCH: ${{ steps.verify.outputs.hash_match }}
          VERIFIED_AT: ${{ steps.verify.outputs.verified_at }}
          TARGET_RELEASE_SHA: ${{ env.TARGET_RELEASE_SHA }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.VERIFY_RESULT === 'success';
            const body = [
              '## Independent public release verification — Geek 1.2.9',
              '',
              `- Result: **${success ? 'success' : 'failure'}**`,
              `- Public latest.yml: HTTP ${process.env.LATEST_STATUS || '000'}${success ? ', version 1.2.9' : ''}`,
              `- Public installer: HTTP ${process.env.INSTALLER_STATUS || '000'}${success ? `, ${process.env.INSTALLER_BYTES} bytes` : ''}`,
              `- Installer SHA-512 matches latest.yml: ${process.env.HASH_MATCH || 'no'}`,
              `- Public blockmap: HTTP ${process.env.BLOCKMAP_STATUS || '000'}${success ? `, ${process.env.BLOCKMAP_BYTES} bytes` : ''}`,
              `- Release commit: ${process.env.TARGET_RELEASE_SHA}`,
              `- Verification run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Verified at: ${process.env.VERIFIED_AT || new Date().toISOString()}`,
              '',
              'No response bodies, credentials, account data or provider secrets are included in this report.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 77,
              body,
            });

      - name: Fail if public release verification failed
        if: steps.verify.outputs.result != 'success'
        shell: bash
        run: exit 1
