name: release-client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/release-client-version'

permissions:
  contents: read

concurrency:
  group: release-client-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: [self-hosted, Windows, X64, geek-real-client]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate release trigger
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $trigger = (Get-Content .github/release-client-version -Raw).Trim()
          if ($trigger -ne $pkg.version) {
            throw "Release trigger $trigger does not match package version $($pkg.version)"
          }
          "RELEASE_VERSION=$trigger" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release=$trigger"

      - name: Build tested Windows release
        run: npm run dist

      - name: Validate release artifacts
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          $files = @(
            "dist-release\$base",
            "dist-release\$base.blockmap",
            'dist-release\latest.yml',
            'dist-release\release-manifest.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release artifact: $file" }
          }
          $latest = Get-Content 'dist-release\latest.yml' -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($env:RELEASE_VERSION))\s*$") {
            throw 'latest.yml version mismatch'
          }

      - name: Capture previous stable metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          node scripts/release-public-check.cjs capture `
            --root 'https://geek-release.9529360.workers.dev' `
            --release-version $env:RELEASE_VERSION `
            --metadata-out 'dist-release\previous-latest.yml' `
            --github-env $env:GITHUB_ENV `
            --attempts 6 `
            --delay-ms 10000
          if ($LASTEXITCODE -ne 0) {
            throw 'Refusing promotion without a verified previous stable release'
          }

      - name: Upload installer and blockmap to R2
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base" --file "dist-release/$base" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 installer upload failed' }
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base.blockmap" --file "dist-release/$base.blockmap" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 blockmap upload failed' }

      - name: Snapshot rollback metadata
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ($env:ROLLBACK_AVAILABLE -ne 'true' -or -not (Test-Path 'dist-release\previous-latest.yml')) {
            Write-Host 'Idempotent rerun: no older rollback snapshot required.'
            exit 0
          }
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/rollback/latest.yml' --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 rollback latest.yml snapshot failed' }
          $versionedKey = "geek-release/rollback/latest-$env:PREVIOUS_RELEASE_VERSION.yml"
          npx --yes wrangler@4.36.0 r2 object put $versionedKey --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 versioned rollback snapshot failed' }

      - name: Publish latest metadata last
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 latest.yml upload failed' }

      - name: Verify production and rollback on failure
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $root = 'https://geek-release.9529360.workers.dev'
          node scripts/release-public-check.cjs verify `
            --root $root `
            --version $env:RELEASE_VERSION `
            --attempts 18 `
            --delay-ms 10000
          if ($LASTEXITCODE -eq 0) {
            "Published Geek $env:RELEASE_VERSION to the production update source." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          Write-Host "Geek $env:RELEASE_VERSION did not verify; attempting rollback."
          if ($env:ROLLBACK_AVAILABLE -eq 'true' -and (Test-Path 'dist-release\previous-latest.yml')) {
            npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/previous-latest.yml' --remote
            if ($LASTEXITCODE -ne 0) { throw 'Release verification failed and rollback upload also failed' }
            if ($env:PREVIOUS_RELEASE_VERSION) {
              node scripts/release-public-check.cjs verify `
                --root $root `
                --version $env:PREVIOUS_RELEASE_VERSION `
                --attempts 18 `
                --delay-ms 10000
              if ($LASTEXITCODE -eq 0) {
                "Release $env:RELEASE_VERSION failed verification. Restored previous stable $env:PREVIOUS_RELEASE_VERSION." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
                throw "Release $env:RELEASE_VERSION failed verification; previous stable $env:PREVIOUS_RELEASE_VERSION was restored"
              }
            }
            throw 'Release verification failed; rollback metadata was uploaded but public rollback could not be verified'
          }

          throw "Release $env:RELEASE_VERSION failed verification and no verified rollback target was available"
