name: release-client

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/release-client-version'

permissions:
  contents: read

concurrency:
  group: release-client-production
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Validate release trigger
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $trigger = (Get-Content .github/release-client-version -Raw).Trim()
          if ($trigger -ne $pkg.version) {
            throw "Release trigger $trigger does not match package version $($pkg.version)"
          }
          "RELEASE_VERSION=$trigger" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "release=$trigger"

      - name: Build tested Windows release
        run: npm run dist

      - name: Validate release artifacts
        shell: pwsh
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          $files = @(
            "dist-release\$base",
            "dist-release\$base.blockmap",
            'dist-release\latest.yml',
            'dist-release\release-manifest.json'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release artifact: $file" }
          }
          $latest = Get-Content 'dist-release\latest.yml' -Raw
          if ($latest -notmatch "(?m)^version:\s*$([regex]::Escape($env:RELEASE_VERSION))\s*$") {
            throw 'latest.yml version mismatch'
          }

      - name: Capture previous stable metadata
        shell: pwsh
        run: |
          $root = 'https://geek-release.9529360.workers.dev'

          function Invoke-PublicRequestWithRetry(
            [string]$Uri,
            [string]$Method = 'Get',
            [int]$Attempts = 6
          ) {
            $lastFailure = 'unknown failure'
            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              $separator = if ($Uri.Contains('?')) { '&' } else { '?' }
              $attemptUri = "$Uri$separator" + "attempt=$attempt"
              try {
                $response = Invoke-WebRequest -Uri $attemptUri -Method $Method -UseBasicParsing -TimeoutSec 20
                if ($response.StatusCode -eq 200) { return $response }
                $lastFailure = "HTTP $($response.StatusCode)"
              } catch {
                $lastFailure = $_.Exception.Message
              }
              Write-Host "Rollback preflight $Method attempt $attempt failed: $lastFailure"
              if ($attempt -lt $Attempts) { Start-Sleep -Seconds 10 }
            }
            throw "public request failed after $Attempts attempts: $lastFailure"
          }

          $nonce = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          try {
            $response = Invoke-PublicRequestWithRetry "$root/latest.yml?before=$nonce"
            $versionMatch = [regex]::Match($response.Content, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$')
            if (-not $versionMatch.Success) { throw 'previous latest.yml has no valid version' }
            $pathMatch = [regex]::Match($response.Content, '(?m)^path:\s*(geek-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe)\s*$')
            if (-not $pathMatch.Success) { throw 'previous latest.yml has no valid installer path' }
            $previousVersion = $versionMatch.Groups[1].Value
            $previousPath = $pathMatch.Groups[1].Value
            if ($previousPath -ne "geek-setup-$previousVersion.exe") {
              throw 'previous latest.yml path/version mismatch'
            }
            if ($previousVersion -eq $env:RELEASE_VERSION) {
              Write-Host "Production already reports $previousVersion; treating this as an idempotent rerun."
              "ROLLBACK_AVAILABLE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              exit 0
            }
            try {
              $null = Invoke-PublicRequestWithRetry "$root/$previousPath?before=$nonce" 'Head'
              $null = Invoke-PublicRequestWithRetry "$root/$previousPath.blockmap?before=$nonce" 'Head'
            } catch {
              throw "previous stable artifacts are not reachable: $($_.Exception.Message)"
            }
            Set-Content -LiteralPath 'dist-release\previous-latest.yml' -Value $response.Content -NoNewline -Encoding utf8
            "PREVIOUS_RELEASE_VERSION=$previousVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ROLLBACK_AVAILABLE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "rollback-target=$previousVersion"
          } catch {
            throw "Refusing promotion without a verified previous stable release: $($_.Exception.Message)"
          }

      - name: Upload installer and blockmap to R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $base = "geek-setup-$env:RELEASE_VERSION.exe"
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base" --file "dist-release/$base" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 installer upload failed' }
          npx --yes wrangler@4.36.0 r2 object put "geek-release/$base.blockmap" --file "dist-release/$base.blockmap" --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 blockmap upload failed' }

      - name: Snapshot rollback metadata
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ($env:ROLLBACK_AVAILABLE -ne 'true' -or -not (Test-Path 'dist-release\previous-latest.yml')) {
            Write-Host 'Idempotent rerun: no older rollback snapshot required.'
            exit 0
          }
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/rollback/latest.yml' --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 rollback latest.yml snapshot failed' }
          $versionedKey = "geek-release/rollback/latest-$env:PREVIOUS_RELEASE_VERSION.yml"
          npx --yes wrangler@4.36.0 r2 object put $versionedKey --file 'dist-release/previous-latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 versioned rollback snapshot failed' }

      - name: Publish latest metadata last
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/latest.yml' --remote
          if ($LASTEXITCODE -ne 0) { throw 'R2 latest.yml upload failed' }

      - name: Verify production and rollback on failure
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $root = 'https://geek-release.9529360.workers.dev'

          function Test-PublicRelease([string]$Version, [int]$Attempts = 18) {
            for ($attempt = 1; $attempt -le $Attempts; $attempt++) {
              try {
                $nonce = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
                $latestResponse = Invoke-WebRequest -Uri "$root/latest.yml?release=$nonce" -UseBasicParsing -TimeoutSec 20
                $pattern = "(?m)^version:\s*$([regex]::Escape($Version))\s*$"
                if ($latestResponse.StatusCode -eq 200 -and $latestResponse.Content -match $pattern) {
                  $base = "geek-setup-$Version.exe"
                  $exeResponse = Invoke-WebRequest -Uri "$root/$base?release=$nonce" -Method Head -UseBasicParsing -TimeoutSec 20
                  $mapResponse = Invoke-WebRequest -Uri "$root/$base.blockmap?release=$nonce" -Method Head -UseBasicParsing -TimeoutSec 20
                  if ($exeResponse.StatusCode -eq 200 -and $mapResponse.StatusCode -eq 200) {
                    return $true
                  }
                }
              } catch {
                Write-Host "Verification attempt $attempt for $Version failed: $($_.Exception.Message)"
              }
              if ($attempt -lt $Attempts) { Start-Sleep -Seconds 10 }
            }
            return $false
          }

          if (Test-PublicRelease $env:RELEASE_VERSION) {
            "Published Geek $env:RELEASE_VERSION to the production update source." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          Write-Host "Geek $env:RELEASE_VERSION did not verify; attempting rollback."
          if ($env:ROLLBACK_AVAILABLE -eq 'true' -and (Test-Path 'dist-release\previous-latest.yml')) {
            npx --yes wrangler@4.36.0 r2 object put 'geek-release/latest.yml' --file 'dist-release/previous-latest.yml' --remote
            if ($LASTEXITCODE -ne 0) { throw 'Release verification failed and rollback upload also failed' }
            if ($env:PREVIOUS_RELEASE_VERSION -and (Test-PublicRelease $env:PREVIOUS_RELEASE_VERSION)) {
              "Release $env:RELEASE_VERSION failed verification. Restored previous stable $env:PREVIOUS_RELEASE_VERSION." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              throw "Release $env:RELEASE_VERSION failed verification; previous stable $env:PREVIOUS_RELEASE_VERSION was restored"
            }
            throw 'Release verification failed; rollback metadata was uploaded but public rollback could not be verified'
          }

          throw "Release $env:RELEASE_VERSION failed verification and no verified rollback target was available"
