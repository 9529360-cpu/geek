name: electron-lock-refresh

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/electron-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/electron-lock-refresh.yml
          git add package-lock.json .github/workflows/electron-lock-refresh.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "deps: refresh Electron lockfile"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
