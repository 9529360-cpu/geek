name: fh03-branch-integrate

on:
  push:
    branches:
      - foundation/fh-03-platform-navigation-authority

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: foundation/fh-03-platform-navigation-authority
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic FH-03 integration
        run: |
          node scripts/fh03-integrate-platform-navigation.cjs
          node --check src/platform-catalog.cjs
          node --check src/webview-navigation-boundary.cjs
          node --check src/main.cjs
          node --check src/main-entry.cjs
          node test/webview-navigation-boundary-contract.cjs
          git diff --check
      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cjs src/main-entry.cjs test/account-type-boundary-contract.cjs test/telegram-k-account-type-contract.cjs test/website-account-lifecycle-security-contract.cjs test/webview-unknown-partition-contract.cjs
          git commit -m "refactor: converge platform and navigation ownership"
          git push origin HEAD:foundation/fh-03-platform-navigation-authority
