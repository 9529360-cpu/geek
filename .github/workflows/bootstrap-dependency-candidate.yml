name: bootstrap dependency candidate

on:
  push:
    branches:
      - fix/478-source-controlled-dependency-audit

permissions:
  contents: write
  actions: read

concurrency:
  group: bootstrap-dependency-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Restore verified dependency candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CURRENT_BLOB: c404cc7679c27e62a653815b2062c127ae20afac
          EXPECTED_CANDIDATE_SHA256: fa6767856f98f5a78fab0bbab141887b1ed4108023d9e8ba77e01b91a586a9ff
          EXPECTED_CANDIDATE_BLOB: 90d469d4836c68ac1873752bc55c2a9b8f61c104
          ARTIFACT_ID: '10345282559'
        run: |
          set -euo pipefail
          current_blob="$(git hash-object package-lock.json)"
          if [ "$current_blob" = "$EXPECTED_CANDIDATE_BLOB" ]; then
            echo "Verified dependency candidate is already committed."
            exit 0
          fi
          test "$current_blob" = "$EXPECTED_CURRENT_BLOB"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/dependency-candidate.zip
          rm -rf /tmp/dependency-candidate
          mkdir -p /tmp/dependency-candidate
          unzip -q /tmp/dependency-candidate.zip -d /tmp/dependency-candidate
          test "$(sha256sum /tmp/dependency-candidate/package-lock.json | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA256"
          test "$(git hash-object /tmp/dependency-candidate/package-lock.json)" = "$EXPECTED_CANDIDATE_BLOB"
          cp /tmp/dependency-candidate/package-lock.json package-lock.json
          test "$(git hash-object package-lock.json)" = "$EXPECTED_CANDIDATE_BLOB"
          git diff -- package-lock.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "fix: source-control compatible dependency patches"
          git push origin HEAD:${GITHUB_REF_NAME}
