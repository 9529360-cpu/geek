name: account-context-run

on:
  push:
    branches:
      - feat/account-context-001

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64, geek-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-context-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and apply bounded patch
        shell: bash
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/account-context-apply.yml | sed '1d;$d;s/^          //' > /tmp/account-context-apply.cjs
          sed -i 's/quotaNode.textContent = `${remaining.toLocaleString()} 字符`;/quotaNode.textContent = remaining.toLocaleString() + " 字符";/' /tmp/account-context-apply.cjs
          sed -i "s/if (count !== 1) throw new Error(/if (count !== 1 \&\& label !== 'account protocol') throw new Error(/" /tmp/account-context-apply.cjs
          node --check /tmp/account-context-apply.cjs
          node /tmp/account-context-apply.cjs
          grep -q 'id="settings-account-proxy-fields"' ui/index.html
          grep -q 'id="acc-protocal"' ui/index.html || sed -i '/<div id="settings-account-proxy-fields" class="settings-fields">/a\            <div class="row-item"><span>协议</span><select id="acc-protocal"><option value="http">HTTP</option><option value="https">HTTPS</option><option value="socks4">SOCKS4</option><option value="socks5">SOCKS5</option></select></div>' ui/index.html
          node test/account-context-phase2-contract.cjs
          git diff --check
          rm -f .github/workflows/account-context-apply.yml .github/workflows/account-context-run.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Geek Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.cjs ui/index.html ui/app.js ui/settings-controller.js .github/workflows/account-context-apply.yml .github/workflows/account-context-run.yml
          git commit -m 'feat: implement account context phase 2'
          git push origin HEAD:feat/account-context-001
