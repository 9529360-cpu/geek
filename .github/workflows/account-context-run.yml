name: account-context-run

on:
  push:
    branches:
      - feat/account-context-001

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64, geek-linux]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/account-context-001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract and apply bounded patch
        shell: bash
        run: |
          sed -n "/node <<'NODE'/,/^          NODE$/p" .github/workflows/account-context-apply.yml | sed '1d;$d;s/^          //' > /tmp/account-context-apply.cjs
          node /tmp/account-context-apply.cjs
          node test/account-context-phase2-contract.cjs
          git diff --check
          rm -f .github/workflows/account-context-apply.yml .github/workflows/account-context-run.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'Geek Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.cjs ui/index.html ui/app.js ui/settings-controller.js .github/workflows/account-context-apply.yml .github/workflows/account-context-run.yml
          git commit -m 'feat: implement account context phase 2'
          git push origin HEAD:feat/account-context-001
