name: release-1.2.21-prep-once

on:
  push:
    branches:
      - release/client-1.2.21
    paths:
      - .github/workflows/release-1.2.21-prep-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/client-1.2.21
          fetch-depth: 0

      - name: Verify exact release base
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "68fec6f3ae7956d0100c812f78a74fac73952b4b"
          test "$(node -p "require('./package.json').version")" = "1.2.20"
          test "$(cat .github/release-client-version)" = "1.2.20"
          grep -q "const FALLBACK_VERSION = '1.2.19';" scripts/geek-website-worker.js

      - name: Prepare 1.2.21 metadata
        shell: bash
        run: |
          npm version 1.2.21 --no-git-tag-version
          printf '1.2.21\n' > .github/release-client-version
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/geek-website-worker.js')
          s = p.read_text(encoding='utf-8')
          old = "const FALLBACK_VERSION = '1.2.19';"
          new = "const FALLBACK_VERSION = '1.2.20';"
          if s.count(old) != 1:
              raise SystemExit('website fallback target changed; refusing blind release edit')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Validate release-only diff
        shell: bash
        run: |
          test "$(node -p "require('./package.json').version")" = "1.2.21"
          test "$(node -p "require('./package-lock.json').version")" = "1.2.21"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "1.2.21"
          test "$(cat .github/release-client-version)" = "1.2.21"
          grep -q "const FALLBACK_VERSION = '1.2.20';" scripts/geek-website-worker.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/release-client-version' 'package-lock.json' 'package.json' 'scripts/geek-website-worker.js' | sort)"
          test "$changed" = "$expected"

      - name: Run release prep tests
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Commit release metadata and self-remove workflow
        shell: bash
        run: |
          rm .github/workflows/release-1.2.21-prep-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json .github/release-client-version scripts/geek-website-worker.js .github/workflows/release-1.2.21-prep-once.yml
          git commit -m "release: prepare Geek 1.2.21"
          git push origin HEAD:release/client-1.2.21
