name: whatsapp-live-bootstrap-prep-once

on:
  push:
    branches: [fix/whatsapp-live-bootstrap]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-live-bootstrap
          fetch-depth: 0
      - name: Patch live bootstrap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-list --max-parents=0 HEAD | wc -l)" -ge 1
          test "$(node -p "require('./package.json').version")" = "1.2.20"
          grep -q "const WA_LOCAL_URL =" src/main.cjs
          grep -q "url: WA_LOCAL_URL" src/main.cjs
          sed -i "/const WA_LOCAL_URL =/a const WA_WEB_URL = 'https://web.whatsapp.com/';" src/main.cjs
          sed -i "s/url: WA_LOCAL_URL,/url: WA_WEB_URL,/g" src/main.cjs
          sed -i "s/hostnames: \['127.0.0.1'\],/hostnames: ['web.whatsapp.com'],/g" src/main.cjs
          sed -i "/^  startWaLocalServer();$/d" src/main.cjs
          sed -i "s#// WhatsApp 本地托管（HelloWorld 同款方案）：固定旧版页面——媒体 API 与 WPP 匹配，图+文秒发#// WhatsApp 启动页使用当前官方 Web，避免冻结快照与在线静态资源失配。#" src/main.cjs
          sed -i "s#// 最新版 web.whatsapp.com 的 createFromData/prepRawMedia 不产生 mediaEntry（发送失败红感叹号）#// 旧本地快照仅保留历史兼容参考，不再作为产品启动入口。#" src/main.cjs
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.cjs
          git diff --check
          test "$(grep -c "url: WA_WEB_URL" src/main.cjs)" = "2"
          test "$(grep -c "hostnames: \['web.whatsapp.com'\]" src/main.cjs)" = "2"
          test "$(grep -c "const WA_WEB_URL = 'https://web.whatsapp.com/';" src/main.cjs)" = "1"
          ! grep -q '^  startWaLocalServer();$' src/main.cjs
          test "$(git diff --name-only | tr '\n' ' ')" = "src/main.cjs "
      - name: Test
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Commit and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/whatsapp-live-bootstrap-prep-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.cjs .github/workflows/whatsapp-live-bootstrap-prep-once.yml
          git commit -m "fix: load current WhatsApp Web bootstrap"
          git push origin HEAD:fix/whatsapp-live-bootstrap
