name: exit-partition-cleanup-temp

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.pull_request.head.ref == 'agent/fix-exit-partition-cleanup'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch main-process exit cleanup
        shell: pwsh
        run: |
          @'
          'use strict';
          const fs = require('node:fs');
          const path = 'src/main.cjs';
          let source = fs.readFileSync(path, 'utf8').replace(/\r\n/g, '\n');

          const importAnchor = "const { verifyRuntimeIntegrity } = require('./unpacked-integrity.cjs');";
          const importLine = "const { cleanupPendingPartitions } = require('./exit-partition-cleanup.cjs');";
          if (!source.includes(importLine)) {
            if (!source.includes(importAnchor)) throw new Error('cleanup import anchor not found');
            source = source.replace(importAnchor, `${importAnchor}\n${importLine}`);
          }

          const oldBlock = `  // 退出时兜底清理：删除账号后因文件锁未删掉的分区目录\n  app.on('will-quit', () => {\n    diagnostics.log('app-will-quit', {});\n    for (const dir of pendingPartitionDeletions) {\n      try {\n        fs.rmSync(dir, { recursive: true, force: true });\n      } catch (e) { /* ignore */ }\n    }\n  });`;
          const newBlock = `  // 退出时兜底清理：删除账号后因文件锁未删掉的分区目录。\n  // will-quit 不能等待异步 Promise，因此这里必须使用同步文件系统删除。\n  app.on('will-quit', () => {\n    diagnostics.log('app-will-quit', {});\n    const cleanup = cleanupPendingPartitions(pendingPartitionDeletions);\n    diagnostics.log('pending-partition-exit-cleanup', {\n      attempted: cleanup.attempted,\n      removed: cleanup.removed,\n      failed: cleanup.failed\n    });\n  });`;
          if (!source.includes(newBlock)) {
            if (!source.includes(oldBlock)) throw new Error('will-quit cleanup block not found');
            source = source.replace(oldBlock, newBlock);
          }

          fs.writeFileSync(path, source, 'utf8');
          '@ | Set-Content -LiteralPath "$env:RUNNER_TEMP/patch-exit-cleanup.cjs" -Encoding utf8
          node "$env:RUNNER_TEMP/patch-exit-cleanup.cjs"
          node --check src/main.cjs
          node test/exit-partition-cleanup-contract.cjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full repository tests
        run: npm test

      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cjs
          if git diff --cached --quiet; then
            echo 'No main-process cleanup change to commit'
            exit 0
          fi
          git commit -m 'fix: make exit partition cleanup effective'
          git push origin HEAD:agent/fix-exit-partition-cleanup
