name: windows-full-test-once

on:
  push:
    branches:
      - fix/windows-release-contract-eol-2
    paths:
      - '.github/workflows/windows-full-test-once.yml'

permissions:
  contents: read

jobs:
  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run full tests on Windows checkout
        run: npm test
