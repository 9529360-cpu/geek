name: Temporary profile center patch

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'agent/profile-center-ux'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply exact profile-center patch
        run: node scripts/tmp-profile-center-patch.cjs

      - name: Validate exact product scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check ui/profile-center.js
          node --check test/profile-center-ux-contract.cjs
          node - <<'NODE'
          const { execFileSync } = require('node:child_process');
          const allowed = new Set([
            'src/main.cjs',
            'src/preload.cjs',
            'ui/index.html',
            'ui/subscription.html',
            'ui/profile-center.js',
            'ui/profile-center.css',
            'test/profile-center-ux-contract.cjs'
          ]);
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split(/\r?\n/).filter(Boolean);
          const unexpected = changed.filter((name) => !allowed.has(name));
          if (unexpected.length) throw new Error('Unexpected changed files: ' + unexpected.join(', '));
          for (const required of allowed) if (!changed.includes(required)) throw new Error('Missing expected change: ' + required);
          const pkg = require('./package.json');
          const marker = require('node:fs').readFileSync('.github/release-client-version', 'utf8').trim();
          if (pkg.version !== '1.2.12' || marker !== '1.2.12') throw new Error('Release boundary changed');
          console.log('PROFILE_CENTER_SCOPE_OK');
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run full contracts
        run: npm test

      - name: Commit product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cjs src/preload.cjs ui/index.html ui/subscription.html ui/profile-center.js ui/profile-center.css test/profile-center-ux-contract.cjs
          git commit -m 'ux: add personal center'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
