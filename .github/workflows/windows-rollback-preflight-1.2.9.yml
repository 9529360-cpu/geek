# final no-write validation of the production public release checker
name: windows-rollback-preflight-1.2.9

on:
  push:
    branches:
      - fix/release-rollback-preflight-retry
    paths:
      - '.github/workflows/windows-rollback-preflight-1.2.9.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-rollback-preflight-retry

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run all contracts
        run: npm test

      - name: Execute production rollback capture without promotion
        id: preflight
        shell: pwsh
        run: |
          $metadataOut = Join-Path $env:RUNNER_TEMP 'previous-latest.yml'
          $captureEnv = Join-Path $env:RUNNER_TEMP 'capture-env.txt'
          node scripts/release-public-check.cjs capture `
            --root 'https://geek-release.9529360.workers.dev' `
            --release-version '1.2.9' `
            --metadata-out $metadataOut `
            --github-env $captureEnv `
            --attempts 6 `
            --delay-ms 10000
          if ($LASTEXITCODE -ne 0) { throw 'production rollback capture failed' }
          $metadata = Get-Content $metadataOut -Raw
          $version = [regex]::Match($metadata, '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$').Groups[1].Value
          $artifactPath = [regex]::Match($metadata, '(?m)^path:\s*(geek-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe)\s*$').Groups[1].Value
          if (-not $version -or -not $artifactPath) { throw 'captured metadata output is invalid' }
          "previous_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "previous_path=$artifactPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish non-sensitive result
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREVIOUS_VERSION: ${{ steps.preflight.outputs.previous_version }}
          PREVIOUS_PATH: ${{ steps.preflight.outputs.previous_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.PREFLIGHT_OUTCOME === 'success';
            const body = [
              '## Production public checker Windows validation',
              '',
              `- Result: **${success ? 'success' : 'failure'}**`,
              '- Full command suite: `npm test` on `windows-latest`',
              '- Command under test: `release-public-check.cjs capture`',
              '- Artifact verification: Node GET with Range header and immediate body cancellation',
              `- Verified previous version: ${process.env.PREVIOUS_VERSION || 'unknown'}`,
              `- Verified declared installer path: ${process.env.PREVIOUS_PATH || 'unknown'}`,
              `- Commit: ${context.sha}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No R2 write permission, response body, credential or storage content was used or reported.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 87,
              body,
            });
