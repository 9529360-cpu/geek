# diagnose Windows public artifact checks with Node fetch
name: windows-rollback-preflight-1.2.9

on:
  push:
    branches:
      - fix/release-rollback-preflight-retry
    paths:
      - '.github/workflows/windows-rollback-preflight-1.2.9.yml'

permissions:
  contents: read
  issues: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-rollback-preflight-retry

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run all contracts
        run: npm test

      - name: Execute Node rollback preflight without promotion
        id: preflight
        shell: pwsh
        run: |
          @'
          'use strict';
          const fs = require('node:fs');
          const root = 'https://geek-release.9529360.workers.dev';

          async function getText(url) {
            const response = await fetch(url, { method: 'GET', redirect: 'follow' });
            if (response.status !== 200) {
              await response.body?.cancel().catch(() => {});
              throw new Error(`metadata HTTP ${response.status}`);
            }
            return response.text();
          }

          async function verifyArtifact(url) {
            const response = await fetch(url, {
              method: 'GET',
              redirect: 'follow',
              headers: { Range: 'bytes=0-0' },
            });
            const status = response.status;
            await response.body?.cancel().catch(() => {});
            if (status !== 200 && status !== 206) throw new Error(`artifact HTTP ${status}`);
          }

          (async () => {
            const nonce = Date.now();
            const metadata = await getText(`${root}/latest.yml?before=${nonce}`);
            const version = metadata.match(/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$/m)?.[1];
            const artifactPath = metadata.match(/^path:\s*(geek-setup-[0-9]+\.[0-9]+\.[0-9]+\.exe)\s*$/m)?.[1];
            if (!version || !artifactPath) throw new Error('invalid public latest.yml');
            if (artifactPath !== `geek-setup-${version}.exe`) throw new Error('path/version mismatch');
            await verifyArtifact(`${root}/${artifactPath}?before=${nonce}`);
            await verifyArtifact(`${root}/${artifactPath}.blockmap?before=${nonce}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `previous_version=${version}\nprevious_path=${artifactPath}\n`, 'utf8');
          })().catch((error) => {
            console.error(String(error?.message || error));
            process.exitCode = 1;
          });
          '@ | Set-Content -LiteralPath node-public-preflight.cjs -Encoding utf8
          node node-public-preflight.cjs

      - name: Publish non-sensitive result
        if: always()
        uses: actions/github-script@v7
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREVIOUS_VERSION: ${{ steps.preflight.outputs.previous_version }}
          PREVIOUS_PATH: ${{ steps.preflight.outputs.previous_path }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.PREFLIGHT_OUTCOME === 'success';
            const body = [
              '## Windows Node rollback preflight validation',
              '',
              `- Result: **${success ? 'success' : 'failure'}**`,
              '- Full command suite: `npm test` on `windows-latest`',
              '- Artifact verification: Node GET with Range header and immediate body cancellation',
              `- Verified previous version: ${process.env.PREVIOUS_VERSION || 'unknown'}`,
              `- Verified declared installer path: ${process.env.PREVIOUS_PATH || 'unknown'}`,
              `- Commit: ${context.sha}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No R2 write permission, response body, credential or storage content was used or reported.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 87,
              body,
            });
