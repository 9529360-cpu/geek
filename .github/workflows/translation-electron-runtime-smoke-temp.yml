name: translation-electron-runtime-smoke-temp

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  electron-runtime-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Install Electron runtime
        run: npm run electron:install

      - name: Run translation smoke inside Electron bundled Node
        shell: pwsh
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          $output = & '.\node_modules\electron\dist\electron.exe' 'scripts\translation-electron-runtime-smoke-temp.mjs' 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          $joined = ($output | Out-String)
          if ($joined -notmatch 'ELECTRON_TRANSLATION_RUNTIME_SMOKE_OK') {
            throw 'Electron translation smoke exited without completion marker'
          }

      - name: Run actual Electron 43 WebView bridge smoke
        shell: pwsh
        run: |
          $output = & '.\node_modules\electron\dist\electron.exe' 'scripts\webview-bridge-electron43-smoke-temp.cjs' 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { exit $exitCode }
          $joined = ($output | Out-String)
          if ($joined -notmatch 'WEBVIEW_BRIDGE_ELECTRON43_SMOKE_OK') {
            throw 'Electron WebView bridge smoke exited without completion marker'
          }
