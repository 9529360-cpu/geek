name: wa-1.2.18-cold-start-control

on:
  push:
    branches:
      - debug/wa-1.2.18-control
    paths:
      - '.github/workflows/wa-1.2.18-cold-start-control.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout 1.2.18 control
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify runtime source is exact 1.2.18
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          git cat-file -e ed21bca77290062c38e3a0b77be8c0f4c9ab216c^{commit}
          if ($LASTEXITCODE -ne 0) { throw 'Known-good 1.2.18 commit is not available in checkout' }
          $changed = @(git diff --name-only ed21bca77290062c38e3a0b77be8c0f4c9ab216c HEAD)
          if ($changed.Count -ne 1 -or $changed[0] -ne '.github/workflows/wa-1.2.18-cold-start-control.yml') { throw "Control branch changed runtime files: $($changed -join ', ')" }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify validation isolation contract
        run: node test/validation-build-isolation-contract.cjs

      - name: Build isolated 1.2.18 validation installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:test

      - name: Upload control installer
        uses: actions/upload-artifact@v4
        with:
          name: geek-wa-1.2.18-cold-start-control
          path: dist-validation-build/geek-validation-setup-1.2.18.exe
          if-no-files-found: error
          retention-days: 7
