name: Temporary keyboard convenience patch

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/keyboard-convenience'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/keyboard-convenience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded keyboard UX patch
        run: node scripts/patch-keyboard-convenience.cjs
      - name: Verify syntax and release boundary
        shell: bash
        run: |
          node --check ui/settings-controller.js
          node --check ui/translation-settings.js
          node --check test/keyboard-shortcuts-ux-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version ui/app.js src/main.cjs src/preload.cjs
      - name: Run contracts
        run: npm test
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- ui/settings-controller.js ui/translation-settings.js test/keyboard-shortcuts-ux-contract.cjs; then
            echo "No bounded keyboard UX changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/settings-controller.js ui/translation-settings.js test/keyboard-shortcuts-ux-contract.cjs
          git commit -m "ux: add keyboard convenience shortcuts"
          git push origin HEAD:agent/keyboard-convenience
