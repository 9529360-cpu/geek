name: temporary telegram k patch

on:
  push:
    branches:
      - agent/fix-telegram-k-normalization
    paths:
      - .github/workflows/patch-telegram-k.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-telegram-k-normalization
          fetch-depth: 0

      - name: Apply exact Telegram K registration patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.cjs')
          source = path.read_text(encoding='utf-8')
          old = """  'telegram-z': {
            name: 'TelegramZ',
            short: 'TGZ',
            url: 'https://web.telegram.org/a',
            hostnames: ['web.telegram.org'],
            allowSuffix: '.telegram.org'
          },
          line: {
          """
          new = """  'telegram-z': {
            name: 'TelegramZ',
            short: 'TGZ',
            url: 'https://web.telegram.org/a',
            hostnames: ['web.telegram.org'],
            allowSuffix: '.telegram.org'
          },
          'telegram-k': {
            name: 'TelegramK',
            short: 'TGK',
            url: 'https://web.telegram.org/k/',
            hostnames: ['web.telegram.org'],
            allowSuffix: '.telegram.org'
          },
          line: {
          """
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one APP_TYPES anchor, found {source.count(old)}')
          updated = source.replace(old, new, 1)
          path.write_text(updated, encoding='utf-8')

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- src/main.cjs
          test "$(git diff --numstat -- src/main.cjs | awk '{print $1 ":" $2}')" = "7:0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-telegram-k.yml
          git add src/main.cjs .github/workflows/patch-telegram-k.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve telegram k account type"
          git push origin HEAD:agent/fix-telegram-k-normalization
