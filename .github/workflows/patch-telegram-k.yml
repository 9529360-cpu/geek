name: temporary telegram k patch

on:
  pull_request:
    branches:
      - master
    paths:
      - src/main.cjs
      - test/telegram-k-account-type-contract.cjs
      - .github/workflows/patch-telegram-k.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/fix-telegram-k-normalization'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-telegram-k-normalization
          fetch-depth: 0

      - name: Apply exact Telegram K registration patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.cjs')
          source = path.read_text(encoding='utf-8')
          old = "  line: {\n    name: 'Line',\n"
          new = (
              "  'telegram-k': {\n"
              "    name: 'TelegramK',\n"
              "    short: 'TGK',\n"
              "    url: 'https://web.telegram.org/k/',\n"
              "    hostnames: ['web.telegram.org'],\n"
              "    allowSuffix: '.telegram.org'\n"
              "  },\n"
              "  line: {\n"
              "    name: 'Line',\n"
          )
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Line APP_TYPES anchor, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- src/main.cjs
          test "$(git diff --numstat -- src/main.cjs | awk '{print $1 ":" $2}')" = "7:0"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-telegram-k.yml
          git add src/main.cjs .github/workflows/patch-telegram-k.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: preserve telegram k account type"
          git push origin HEAD:agent/fix-telegram-k-normalization
