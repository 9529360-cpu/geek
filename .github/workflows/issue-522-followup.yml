name: issue-522-followup

on:
  push:
    branches:
      - fix/522-wa-js-4-6-migration

permissions:
  contents: write

jobs:
  followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: fix/522-wa-js-4-6-migration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply and validate follow-up
        run: node .github/scripts/issue-522-followup.cjs
