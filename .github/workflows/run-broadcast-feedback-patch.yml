name: run-broadcast-feedback-patch
on:
  push:
    branches: [fix/broadcast-nonblocking-feedback]
    paths: [.github/workflows/run-broadcast-feedback-patch.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broadcast-nonblocking-feedback
      - name: Apply and verify focused patch
        shell: bash
        run: |
          python3 scripts/apply-broadcast-feedback-patch.py
          git diff --check
          node test/broadcast-feedback-contract.cjs
          node test/broadcast-schedule-readiness-contract.cjs
          node test/broadcast-product-closure-contract.cjs
          node test/broadcast-recipient-tags-contract.cjs
          node test/broadcast-job-controller-contract.cjs
      - name: Commit product patch only
        shell: bash
        run: |
          rm scripts/apply-broadcast-feedback-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/broadcast-product-closure.js ui/broadcast-recipient-tags.js ui/broadcast-job-controller.js ui/broadcast-safety.js ui/app.js test/broadcast-feedback-contract.cjs test/broadcast-schedule-readiness-contract.cjs e2e/specs/broadcast-readiness.e2e.cjs scripts/apply-broadcast-feedback-patch.py
          git commit -m "fix: make broadcast feedback non-blocking"
          git push origin HEAD:fix/broadcast-nonblocking-feedback
