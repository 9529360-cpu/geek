name: deploy-website

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-marketing-router.js'
      - 'scripts/geek-marketing-theme.mjs'
      - 'scripts/geek-marketing-styles-core.mjs'
      - 'scripts/geek-marketing-styles-components.mjs'
      - 'scripts/geek-marketing-visuals.mjs'
      - 'scripts/geek-marketing-pages.mjs'
      - 'scripts/geek-public-pricing.mjs'
      - 'scripts/geek-website-entry.js'
      - 'scripts/geek-website-worker.js'
      - 'scripts/geek-website-versioned-entry.mjs'
      - 'scripts/website-payment-qr.mjs'
      - 'wrangler-website.toml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-website-production
      url: https://geek.bbnba.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-marketing-router.js
          node --check scripts/geek-marketing-theme.mjs
          node --check scripts/geek-marketing-styles-core.mjs
          node --check scripts/geek-marketing-styles-components.mjs
          node --check scripts/geek-marketing-visuals.mjs
          node --check scripts/geek-marketing-pages.mjs
          node --check scripts/geek-public-pricing.mjs
          node --check scripts/geek-website-entry.js
          node --check scripts/geek-website-worker.js
          node --check scripts/geek-website-versioned-entry.mjs
          node --check scripts/website-payment-qr.mjs
          node --check scripts/website-production-smoke.cjs

      - name: Deploy website Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORCE_COLOR: '0'
        run: |
          set -o pipefail
          DEPLOY_LOG="$RUNNER_TEMP/wrangler-website-deploy.log"
          npx --yes wrangler@4.36.0 deploy --config wrangler-website.toml 2>&1 | tee "$DEPLOY_LOG"
          VERSION_ID="$(sed -n 's/.*Current Version ID:[[:space:]]*//p' "$DEPLOY_LOG" | tail -n 1 | tr -d '\r')"
          if ! printf '%s' "$VERSION_ID" | grep -Eq '^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'; then
            echo 'Unable to recover the exact deployed Cloudflare Worker version ID.' >&2
            exit 1
          fi
          printf 'version_id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Verify critical public website routes
        id: verify
        env:
          GEEK_EXPECTED_WORKER_VERSION: ${{ steps.deploy.outputs.version_id }}
        run: node scripts/website-production-smoke.cjs

      - name: Publish non-sensitive deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYED_WORKER_VERSION: ${{ steps.deploy.outputs.version_id }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          VERIFIED_WORKER_VERSION: ${{ steps.verify.outputs.worker_version }}
          HTTP_CODE: ${{ steps.verify.outputs.health_http_code }}
          ROUTES_CHECKED: ${{ steps.verify.outputs.routes_checked }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          if [ -z "$HTTP_CODE" ]; then HTTP_CODE="unavailable"; fi
          if [ -z "$ROUTES_CHECKED" ]; then ROUTES_CHECKED="unavailable"; fi
          if [ -z "$DEPLOYED_WORKER_VERSION" ]; then DEPLOYED_WORKER_VERSION="unavailable"; fi
          if [ -z "$VERIFIED_WORKER_VERSION" ]; then VERIFIED_WORKER_VERSION="unavailable"; fi
          SHORT_SHA="$(printf '%s' "$COMMIT_SHA" | cut -c1-12)"
          REPORT="$RUNNER_TEMP/cloudflare-website-deployment-status.md"
          {
            printf 'Run: %s\n\n' "$RUN_URL"
            printf '### Cloudflare deployment\n\n'
            printf -- '- Service: `website`\n'
            printf -- '- Workflow: `deploy-website`\n'
            printf -- '- Trigger: `%s`\n' "$TRIGGER_EVENT"
            printf -- '- Job: **%s**\n' "$JOB_STATUS"
            printf -- '- Wrangler deploy: `%s`\n' "$DEPLOY_OUTCOME"
            printf -- '- Deployed Worker version: `%s`\n' "$DEPLOYED_WORKER_VERSION"
            printf -- '- Public verification: `%s` (`%s` critical routes; health HTTP `%s`)\n' "$VERIFY_OUTCOME" "$ROUTES_CHECKED" "$HTTP_CODE"
            printf -- '- Verified Worker version: `%s`\n' "$VERIFIED_WORKER_VERSION"
            printf -- '- Commit: `%s`\n' "$SHORT_SHA"
            printf -- '- Surface: `/health`, `/`, `/pricing`, `/guide`, `/faq`, `/sitemap.xml`, `/download`\n\n'
            printf 'No tokens, Authorization headers, cookies, DNS values, database contents, Cloudflare response bodies, or user data are included in this report.\n'
          } > "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          gh issue comment 21 --body-file "$REPORT"
