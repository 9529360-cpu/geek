name: deploy-website
# Completion and public health are reported to #21 by observe-cloudflare-deployments.yml.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-website-worker.js'
      - 'scripts/website-payment-qr.mjs'
      - 'wrangler-website.toml'
      - 'test/website-*.cjs'
      - '.github/workflows/deploy-website.yml'

permissions:
  contents: read

concurrency:
  group: deploy-website-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: node --check scripts/geek-website-worker.js

      - name: Deploy website Worker
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-website.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
