name: tauri-windows-prototype
on:
  push:
    branches: ['feat/tauri-windows-rust']
    paths: ['desktop-tauri/**', 'src/platform-catalog.cjs', '.github/workflows/tauri-windows.yml']
  pull_request:
    branches: [master]
    paths: ['desktop-tauri/**', 'src/platform-catalog.cjs', '.github/workflows/tauri-windows.yml']
permissions:
  contents: read
concurrency:
  group: tauri-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Frontend behavior and boundary contracts
        run: node desktop-tauri/scripts/run-tests.cjs
      - name: Retain exact source snapshot for independent checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geek-tauri-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop-tauri/frontend/
            desktop-tauri/test/
            desktop-tauri/scripts/
            desktop-tauri/src-tauri/src/
            desktop-tauri/src-tauri/Cargo.toml
            desktop-tauri/src-tauri/build.rs
            desktop-tauri/src-tauri/tauri.conf.json
            desktop-tauri/src-tauri/capabilities/
            desktop-tauri/src-tauri/permissions/
            desktop-tauri/README.md
            src/platform-catalog.cjs
          if-no-files-found: error
          retention-days: 7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Windows Rust tests (DPAPI, store, policy, tray state)
        run: cargo +stable test --manifest-path desktop-tauri/src-tauri/Cargo.toml
      - name: Build standalone prototype executable (not an installer or release)
        run: cargo +stable build --release --locked --manifest-path desktop-tauri/src-tauri/Cargo.toml
      - name: Retain prototype and resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: geek-tauri-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            desktop-tauri/src-tauri/target/release/geek-tauri.exe
            desktop-tauri/src-tauri/Cargo.lock
          if-no-files-found: warn
          retention-days: 7
