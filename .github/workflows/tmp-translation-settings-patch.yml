name: Temporary translation settings patch

on:
  push:
    branches:
      - ux-translation-settings-humanized
    paths:
      - .github/workflows/tmp-translation-settings-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux-translation-settings-humanized
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply bounded translation UX patch
        run: node scripts/patch-translation-settings-ux.cjs
      - name: Verify syntax and release boundary
        shell: bash
        run: |
          node --check ui/app.js
          node --check ui/translation-settings.js
          node --check test/translation-settings-ux-contract.cjs
          git diff --check
          git diff --exit-code -- package.json .github/release-client-version
      - name: Run contracts
        run: npm test
      - name: Commit bounded patch
        shell: bash
        run: |
          if git diff --quiet -- ui/app.js ui/index.html; then
            echo "No bounded patch changes found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/app.js ui/index.html
          git commit -m "ux: wire human-friendly translation settings"
          git push origin HEAD:ux-translation-settings-humanized
