name: account-context-build-report-once
on:
  push:
    branches: [docs/account-context-menu-scope]
    paths:
      - 'scripts/account-context-build-report-once.cjs'
      - '.github/workflows/account-context-build-report-once.yml'
permissions:
  contents: write
jobs:
  report:
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/account-context-menu-scope
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/account-context-build-report-once.cjs
      - run: |
          git config user.name 'Geek Phase 2 Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record Gate 3 validation build'
          git push origin HEAD:docs/account-context-menu-scope
