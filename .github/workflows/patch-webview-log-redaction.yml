name: temporary webview log redaction patch

on:
  pull_request:
    branches:
      - master
    paths:
      - src/main.cjs
      - src/log-url.cjs
      - test/webview-log-url-redaction-contract.cjs
      - .github/workflows/patch-webview-log-redaction.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/redact-webview-log-urls'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/redact-webview-log-urls
          fetch-depth: 0

      - name: Apply exact WebView log redaction patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/main.cjs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  "const { cleanupPendingPartitions } = require('./exit-partition-cleanup.cjs');\n",
                  "const { cleanupPendingPartitions } = require('./exit-partition-cleanup.cjs');\nconst { sanitizeUrlForLog } = require('./log-url.cjs');\n",
              ),
              (
                  "    webContents.on('did-fail-load', (event, errorCode, errorDescription, validatedURL) => {\n      console.log(`[wv] did-fail-load code=${errorCode} desc=${errorDescription} url=${validatedURL}`);\n",
                  "    webContents.on('did-fail-load', (event, errorCode, errorDescription, validatedURL) => {\n      const safeUrl = sanitizeUrlForLog(validatedURL);\n      console.log(`[wv] did-fail-load code=${errorCode} desc=${errorDescription} url=${safeUrl}`);\n",
              ),
              (
                  "        url: validatedURL\n",
                  "        url: safeUrl\n",
              ),
              (
                  "      console.log(`[wv] did-navigate url=${url}`);\n",
                  "      console.log(`[wv] did-navigate url=${sanitizeUrlForLog(url)}`);\n",
              ),
              (
                  "      console.log(`[wv] did-navigate-in-page url=${url}`);\n",
                  "      console.log(`[wv] did-navigate-in-page url=${sanitizeUrlForLog(url)}`);\n",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one patch anchor, found {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- src/main.cjs
          test "$(git diff --numstat -- src/main.cjs | awk '{print $1 ":" $2}')" = "6:4"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-webview-log-redaction.yml
          git add src/main.cjs .github/workflows/patch-webview-log-redaction.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security: redact webview log URLs"
          git push origin HEAD:agent/redact-webview-log-urls
