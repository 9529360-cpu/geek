name: deploy-translate

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'scripts/geek-translate-entry.js'
      - 'scripts/geek-translate-worker.js'
      - 'scripts/translation-rate-limit-compat.mjs'
      - 'scripts/atomic-rate-limit.mjs'
      - 'wrangler-translate.toml'

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-translate-production
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-translation-production
      url: https://geek-translate.9529360.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Validate Worker syntax
        run: |
          node --check scripts/geek-translate-entry.js
          node --check scripts/geek-translate-worker.js
          node --check scripts/translation-rate-limit-compat.mjs
          node --check scripts/atomic-rate-limit.mjs
          node --check scripts/cloudflare-deploy-report.cjs

      - name: Deploy translation Worker
        id: deploy
        run: npx --yes wrangler@4.36.0 deploy --config wrangler-translate.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify and publish non-sensitive deployment status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLOUDFLARE_SERVICE: translation
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: node scripts/cloudflare-deploy-report.cjs
