name: tmp-restore-broadcast-formal-ux

on:
  push:
    branches:
      - fix/broadcast-restore-formal-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore formal editor behavior and keep lightweight job bar
        shell: bash
        run: |
          git fetch origin ux/broadcast-account-jobs --depth=1
          git show origin/ux/broadcast-account-jobs:ui/broadcast-job-controller.js > ui/broadcast-job-controller.js
          node <<'NODE'
          const fs = require('fs');
          const p = 'ui/broadcast-job-controller.js';
          let s = fs.readFileSync(p, 'utf8');

          s = s.replace(
            "    const failures = createButton('failures', '查看失败', 'hidden');\n    actions.append(pause, stop, failures);\n    bar.append(head, meta, progress, failureBox, actions);",
            "    const failures = createButton('failures', '查看失败', 'hidden');\n    const dismiss = createButton('dismiss', '关闭', 'hidden');\n    actions.append(pause, stop, failures, dismiss);\n    bar.append(head, meta, progress, failureBox, actions);"
          );
          s = s.replace(
            "    close.onclick = () => {\n      const job = currentJob(runtime);\n      if (!job || !TERMINAL.has(job.state)) return;\n      try { runtime.manager.dismiss(job.id); } catch (_) {}\n      render(runtime);\n    };",
            "    function dismissCurrent() {\n      const job = currentJob(runtime);\n      if (!job || !TERMINAL.has(job.state)) return;\n      try { runtime.manager.dismiss(job.id); } catch (_) {}\n      render(runtime);\n    }\n\n    close.onclick = dismissCurrent;\n    dismiss.onclick = dismissCurrent;"
          );
          s = s.replace(
            "    const failures = bar.querySelector('[data-act=\"failures\"]');\n    const close = bar.querySelector('.bc-job-close');",
            "    const failures = bar.querySelector('[data-act=\"failures\"]');\n    const dismiss = bar.querySelector('[data-act=\"dismiss\"]');\n    const close = bar.querySelector('.bc-job-close');"
          );
          s = s.replace(
            "    failures.classList.toggle('hidden', !(terminal && fail > 0));\n    close.style.visibility = terminal ? 'visible' : 'hidden';",
            "    failures.classList.toggle('hidden', !(terminal && fail > 0));\n    dismiss.classList.toggle('hidden', !terminal);\n    close.style.visibility = terminal ? 'visible' : 'hidden';"
          );

          s = s.replace("    applyCopyAndSemantics();\n", '');
          s = s.replace(
            "    const runtime = { manager, unsubscribe: null, clock: null, summaryObserver: null, accountObserver: null };\n    ensureBar(runtime);\n    runtime.unsubscribe = manager.subscribe(() => render(runtime));\n\n    const summaryRoot = document.getElementById('broadcast-overlay');\n    if (summaryRoot) {\n      runtime.summaryObserver = new MutationObserver(refreshSummary);\n      runtime.summaryObserver.observe(summaryRoot, { subtree: true, childList: true });\n    }",
            "    const runtime = { manager, unsubscribe: null, clock: null, accountObserver: null, lastJobId: '' };\n    ensureBar(runtime);\n    runtime.lastJobId = currentJob(runtime)?.id || '';\n    runtime.unsubscribe = manager.subscribe(() => {\n      const job = currentJob(runtime);\n      const jobId = job?.id || '';\n      if (jobId && jobId !== runtime.lastJobId) {\n        const overlay = document.getElementById('broadcast-overlay');\n        if (overlay && !overlay.classList.contains('hidden')) overlay.classList.add('hidden');\n      }\n      runtime.lastJobId = jobId;\n      render(runtime);\n    });"
          );
          s = s.replace("    document.addEventListener('input', refreshSummary, true);\n    document.addEventListener('change', refreshSummary, true);\n    document.addEventListener('click', () => queueMicrotask(() => { refreshSummary(); render(runtime); }), true);\n", "    document.addEventListener('click', () => queueMicrotask(() => render(runtime)), true);\n");
          s = s.replace("    refreshSummary();\n    render(runtime);", "    render(runtime);");

          if (s.includes('workspace side sheet') || s.includes('bc-job-stats') || s.includes('bc-job-activity')) throw new Error('heavy product-polish UI survived restore');
          if (s.includes("dialog.setAttribute('aria-modal', 'false')")) throw new Error('editor modal semantics are still overridden');
          if (!s.includes("const dismiss = createButton('dismiss', '关闭', 'hidden')")) throw new Error('terminal Close action missing');
          if (!s.includes("overlay.classList.add('hidden')")) throw new Error('editor auto-close on new job missing');
          fs.writeFileSync(p, s, 'utf8');
          NODE
          node --check ui/broadcast-job-controller.js
          git diff --check -- ui/broadcast-job-controller.js
      - name: Commit focused UX restore
        shell: bash
        run: |
          if git diff --quiet -- ui/broadcast-job-controller.js; then
            echo "No source diff"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/broadcast-job-controller.js
          git commit -m "fix: restore formal broadcast editor UX"
          git push origin HEAD:fix/broadcast-restore-formal-ux
