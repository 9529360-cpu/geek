name: fh04-mutation-b

on:
  push:
    branches:
      - mutation/fh-04-translation-runtime
    paths:
      - .github/workflows/fh04-mutation-b.yml

permissions:
  contents: write

jobs:
  mutate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mutation/fh-04-translation-runtime
          fetch-depth: 0
      - name: Deliberately reintroduce direct translation IPC in main
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const file = 'src/main.cjs';
          let source = fs.readFileSync(file, 'utf8');
          const marker = 'function registerIpcHandlers() {\n';
          if ((source.split(marker).length - 1) !== 1) throw new Error('mutation target drifted');
          source = source.replace(marker, marker + "  ipcMain.handle('translation:health', async () => ({ ok: true })); // MUTATION duplicate owner\n");
          fs.writeFileSync(file, source);
          NODE
          node --check src/main.cjs
      - name: Commit mutation and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cjs
          git rm .github/workflows/fh04-mutation-b.yml
          git commit -m "mutation: duplicate translation ipc in main"
          git push origin HEAD:mutation/fh-04-translation-runtime
