name: tmp-fix-webview-partition

on:
  push:
    branches: [agent/reject-unknown-webview-partition]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reject-unknown-webview-partition
          fetch-depth: 0

      - name: Apply focused fix and regression test
        shell: python
        run: |
          from pathlib import Path

          main_path = Path('src/main.cjs')
          main = main_path.read_text(encoding='utf-8')

          old = """    const hostname = parsedSource.hostname.toLowerCase();

    let customAllowed = false;
"""
          new = """    if (!account || !config) {
      event.preventDefault();
      return;
    }

    const hostname = parsedSource.hostname.toLowerCase();

    let customAllowed = false;
"""
          if old in main:
              main = main.replace(old, new, 1)
          elif new not in main:
              raise SystemExit('expected webview guard insertion point not found')

          old_reject = """    if (!account || !config || !isAllowed) {
      event.preventDefault();
      return;
    }
"""
          new_reject = """    if (!isAllowed) {
      event.preventDefault();
      return;
    }
"""
          if old_reject in main:
              main = main.replace(old_reject, new_reject, 1)
          elif new_reject not in main:
              raise SystemExit('expected webview final reject block not found')

          main_path.write_text(main, encoding='utf-8')

          test = r'''\'use strict\';

const assert = require('node:assert/strict');
const fs = require('node:fs');
const path = require('node:path');

const root = path.join(__dirname, '..');
const main = fs.readFileSync(path.join(root, 'src', 'main.cjs'), 'utf8');
const start = main.indexOf('function configureWebviewSecurity(window)');
const end = main.indexOf("window.webContents.on('did-attach-webview'", start);
assert.ok(start >= 0 && end > start, 'configureWebviewSecurity block must exist');
const block = main.slice(start, end);

const parseIndex = block.indexOf('parsedSource = new URL(source);');
const guardIndex = block.indexOf('if (!account || !config) {');
const customAccountIndex = block.indexOf("if (account.type === 'website' && account.customUrl)");
const lineAccountIndex = block.indexOf("(account.type === 'line' || account.type === 'line-business')");

assert.ok(parseIndex >= 0, 'source URL parsing must remain present');
assert.ok(guardIndex > parseIndex, 'unknown account/config guard must run after URL parsing');
assert.ok(customAccountIndex > guardIndex, 'account.type custom-site access must occur only after the null guard');
assert.ok(lineAccountIndex > guardIndex, 'account.type LINE access must occur only after the null guard');
assert.match(
  block,
  /if \(!account \|\| !config\) \{\s*event\.preventDefault\(\);\s*return;\s*\}/,
  'unknown or stale partitions must be rejected without dereferencing account'
);
assert.match(
  block,
  /if \(!isAllowed\) \{\s*event\.preventDefault\(\);\s*return;\s*\}/,
  'known accounts with disallowed URLs must still fail closed'
);

console.log('WEBVIEW_UNKNOWN_PARTITION_CONTRACT_OK');
'''
          Path('test/webview-unknown-partition-contract.cjs').write_text(test, encoding='utf-8')

      - name: Run focused regression
        run: node test/webview-unknown-partition-contract.cjs

      - name: Commit focused product change
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cjs test/webview-unknown-partition-contract.cjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "fix: reject unknown webview partitions safely"
          git push origin HEAD:agent/reject-unknown-webview-partition
