name: Temporary release 1.2.12 preparation

on:
  pull_request:
    branches:
      - master
    types: [opened, reopened]

permissions:
  contents: write

jobs:
  prepare-and-test:
    if: github.head_ref == 'release/1.2.12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/1.2.12
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare release surfaces
        run: node scripts/prepare-release-1.2.12.cjs
      - name: Verify exact release scope
        shell: bash
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check scripts/geek-website-worker.js
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' \
            '.github/release-client-version' \
            'README.md' \
            'docs/github-control-plane.md' \
            'docs/release-security.md' \
            'package-lock.json' \
            'package.json' \
            'scripts/geek-website-worker.js' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected release diff scope:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const lock = require('./package-lock.json');
          const marker = fs.readFileSync('.github/release-client-version', 'utf8').trim();
          const worker = fs.readFileSync('scripts/geek-website-worker.js', 'utf8');
          const preload = fs.readFileSync('src/preload.cjs', 'utf8');
          if (pkg.version !== '1.2.12') throw new Error(`package=${pkg.version}`);
          if (lock.version !== '1.2.12' || lock.packages?.['']?.version !== '1.2.12') throw new Error('lock version mismatch');
          if (marker !== '1.2.12') throw new Error(`marker=${marker}`);
          if (!worker.includes("const FALLBACK_VERSION = '1.2.11';")) throw new Error('website fallback mismatch');
          if (/require\(['"]\.\.?\//.test(preload)) throw new Error('sandbox preload relative require regression');
          if (!preload.includes("version: () => ipcRenderer.invoke('app:get-version')")) throw new Error('runtime version IPC bridge missing');
          NODE
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run full contracts
        run: npm test
      - name: Commit release surfaces
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/release-client-version README.md docs/github-control-plane.md docs/release-security.md package-lock.json package.json scripts/geek-website-worker.js
          git commit -m "release: prepare Geek 1.2.12"
          git push origin HEAD:release/1.2.12
