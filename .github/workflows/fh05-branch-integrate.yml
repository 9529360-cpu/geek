name: fh05-branch-integrate

on:
  push:
    branches:
      - foundation/fh-05-subscription-ipc-owner
    paths:
      - scripts/fh05-integrate-subscription-ipc.cjs
      - .github/workflows/fh05-branch-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: foundation/fh-05-subscription-ipc-owner
          fetch-depth: 0
      - name: Apply deterministic Subscription IPC extraction
        run: node scripts/fh05-integrate-subscription-ipc.cjs
      - name: Validate syntax
        run: |
          node --check src/main.cjs
          node --check src/subscription-ipc.cjs
          git diff --check
      - name: Commit integrated source and remove branch-only tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cjs src/subscription-ipc.cjs
          git rm scripts/fh05-integrate-subscription-ipc.cjs .github/workflows/fh05-branch-integrate.yml
          git commit -m "refactor: extract subscription ipc owner"
          git push origin HEAD:foundation/fh-05-subscription-ipc-owner
