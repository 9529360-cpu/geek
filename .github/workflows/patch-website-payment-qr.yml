name: temporary website payment QR patch

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/geek-website-worker.js
      - scripts/website-payment-qr.mjs
      - scripts/temporary-patch-website-payment-qr.py
      - test/website-payment-qr-contract.cjs
      - .github/workflows/deploy-website.yml
      - .github/workflows/patch-website-payment-qr.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/fix-website-usdt-qr'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-website-usdt-qr
          fetch-depth: 0

      - name: Apply exact website payment QR patch
        run: python scripts/temporary-patch-website-payment-qr.py

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- scripts/geek-website-worker.js .github/workflows/deploy-website.yml
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/deploy-website.yml scripts/geek-website-worker.js "
          grep -Fq "path === '/payment-qr'" scripts/geek-website-worker.js
          grep -Fq "encodeURIComponent(pay.usdt_address)" scripts/geek-website-worker.js
          ! grep -Fq "usdt-qr.png" scripts/geek-website-worker.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Validate website Worker and QR module syntax
        run: |
          node --check scripts/geek-website-worker.js
          node --check scripts/website-payment-qr.mjs

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary files
        run: |
          rm .github/workflows/patch-website-payment-qr.yml
          rm scripts/temporary-patch-website-payment-qr.py
          git add scripts/geek-website-worker.js .github/workflows/deploy-website.yml .github/workflows/patch-website-payment-qr.yml scripts/temporary-patch-website-payment-qr.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: self-host website payment QR"
          git push origin HEAD:agent/fix-website-usdt-qr
