name: tmp-broadcast-tag-delete-codemod

on:
  push:
    branches:
      - fix/broadcast-saved-tag-delete

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused tag delete persistence fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'ui/app.js';
          const s = fs.readFileSync(p, 'utf8');
          const old = `  async function deleteBroadcastGroupTag(g) {
    if (!g) return;
    if (!confirm(\`删除群组标签「\${g.name}」？不会删除真实群组。\`)) return;
    const next = currentBroadcastGroupTags().filter(x => x.id !== g.id);
    accountStorageSetItem('broadcastGroups', JSON.stringify(next));
    clearBroadcastGroupTagFilter();
  }`;
          const next = `  async function deleteBroadcastGroupTag(g) {
    if (!g) return;
    if (!confirm(\`删除群组标签「\${g.name}」？不会删除真实群组。\`)) return;
    const next = currentBroadcastGroupTags().filter(x => x.id !== g.id);
    const deleted = await accountStorageSetItem('broadcastGroups', JSON.stringify(next));
    if (deleted === false) { alert('删除标签失败，请重试'); return; }
    clearBroadcastGroupTagFilter();
  }`;
          const hits = s.split(old).length - 1;
          if (hits !== 1) throw new Error(`expected one delete handler, found ${hits}`);
          fs.writeFileSync(p, s.replace(old, next), 'utf8');
          NODE
          node --check ui/app.js
          git diff --check -- ui/app.js
      - name: Commit focused source fix
        shell: bash
        run: |
          if git diff --quiet -- ui/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/app.js
          git commit -m "fix: await saved broadcast tag deletion"
          git push origin HEAD:fix/broadcast-saved-tag-delete
