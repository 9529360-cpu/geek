name: tmp-broadcast-tag-delete-codemod-v2

on:
  push:
    branches:
      - fix/broadcast-saved-tag-delete

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact optimistic delete lines
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'ui/app.js';
          const s = fs.readFileSync(p, 'utf8');
          const old = "    accountStorageSetItem('broadcastGroups', JSON.stringify(next));\n    clearBroadcastGroupTagFilter();";
          const replacement = "    const deleted = await accountStorageSetItem('broadcastGroups', JSON.stringify(next));\n    if (deleted === false) { alert('删除标签失败，请重试'); return; }\n    clearBroadcastGroupTagFilter();";
          const functionStart = s.indexOf('  async function deleteBroadcastGroupTag(g) {');
          const functionEnd = s.indexOf("  document.getElementById('broadcast-saved-groups').onchange", functionStart);
          if (functionStart < 0 || functionEnd < 0) throw new Error('delete handler not found');
          const before = s.slice(functionStart, functionEnd);
          if (!before.includes(old)) throw new Error('exact optimistic delete sequence not found');
          const fixed = before.replace(old, replacement);
          fs.writeFileSync(p, s.slice(0, functionStart) + fixed + s.slice(functionEnd), 'utf8');
          NODE
          node --check ui/app.js
          git diff --check -- ui/app.js
      - name: Commit source fix
        shell: bash
        run: |
          if git diff --quiet -- ui/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/app.js
          git commit -m "fix: await saved broadcast tag deletion"
          git push origin HEAD:fix/broadcast-saved-tag-delete
