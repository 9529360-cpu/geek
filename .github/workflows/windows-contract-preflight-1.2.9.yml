name: windows-contract-preflight-1.2.9

on:
  push:
    branches:
      - fix/windows-file-boundary-fixture
    paths:
      - '.github/workflows/windows-contract-preflight-1.2.9.yml'

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/windows-file-boundary-fixture

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run all contracts on Windows
        id: contracts
        run: npm test

      - name: Publish non-sensitive result
        if: always()
        uses: actions/github-script@v7
        env:
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.CONTRACT_OUTCOME === 'success';
            const body = [
              '## Windows contract preflight',
              '',
              `- Result: **${success ? 'success' : 'failure'}**`,
              '- Runner: `windows-latest`',
              '- Command: `npm test`',
              `- Commit: ${context.sha}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'No credentials, production response bodies or user data are included.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 83,
              body,
            });
