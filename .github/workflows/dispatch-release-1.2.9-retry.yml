# dispatch after cross-platform rollback verification passed
name: dispatch-release-1.2.9-retry

on:
  push:
    branches:
      - release/1.2.9
    paths:
      - '.github/workflows/dispatch-release-1.2.9-retry.yml'

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: dispatch-release-1.2.9-retry
  cancel-in-progress: false

jobs:
  dispatch-and-observe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TARGET_SHA: ab5038ed0c718676268acae9546de648919ef5fe
    steps:
      - name: Dispatch guarded release workflow
        id: release
        shell: bash
        run: |
          set -uo pipefail
          started_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release-client.yml --repo "$GITHUB_REPOSITORY" --ref master

          run_id=''
          for attempt in $(seq 1 90); do
            runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-client.yml --branch master --event workflow_dispatch --limit 20 --json databaseId,headSha,status,conclusion,url,createdAt 2>/dev/null || echo '[]')"
            run_id="$(printf '%s' "$runs" | jq -r --arg sha "$TARGET_SHA" --arg started "$started_at" '.[] | select(.headSha == $sha and .createdAt >= $started) | .databaseId' | head -n 1)"
            if [ -n "$run_id" ] && [ "$run_id" != 'null' ]; then break; fi
            sleep 5
          done

          if [ -z "$run_id" ] || [ "$run_id" = 'null' ]; then
            {
              echo 'result=failure'
              echo 'run_id=not-found'
              echo 'run_url='
              echo 'status=not-found'
              echo 'conclusion=not-found'
              echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh issue comment 77 --repo "$GITHUB_REPOSITORY" --body "## Cross-platform-validated Windows client release started\n\n- Version: \`1.2.9\`\n- Run ID: \`$run_id\`\n- Commit: \`$TARGET_SHA\`\n- Validation baseline: Windows production capture and Linux all 62 contracts passed\n\nThe guarded workflow is building, validating, uploading immutable artifacts, publishing latest.yml last and verifying public propagation with rollback protection."

          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status >/dev/null 2>&1 || true
          details="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,headSha)"
          status="$(printf '%s' "$details" | jq -r '.status // "unknown"')"
          conclusion="$(printf '%s' "$details" | jq -r '.conclusion // "unknown"')"
          run_url="$(printf '%s' "$details" | jq -r '.url // ""')"
          result='failure'
          if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then result='success'; fi
          {
            echo "result=$result"
            echo "run_id=$run_id"
            echo "run_url=$run_url"
            echo "status=$status"
            echo "conclusion=$conclusion"
            echo "observed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish non-sensitive retry result
        if: always()
        uses: actions/github-script@v7
        env:
          RELEASE_RESULT: ${{ steps.release.outputs.result }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          RELEASE_RUN_URL: ${{ steps.release.outputs.run_url }}
          RELEASE_STATUS: ${{ steps.release.outputs.status }}
          RELEASE_CONCLUSION: ${{ steps.release.outputs.conclusion }}
          OBSERVED_AT: ${{ steps.release.outputs.observed_at }}
          TARGET_SHA: ${{ env.TARGET_SHA }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const success = process.env.RELEASE_RESULT === 'success';
            const body = [
              '## Cross-platform-validated Windows client release — Geek 1.2.9',
              '',
              `- Result: **${success ? 'success' : 'failure'}**`,
              '- Trigger: `workflow_dispatch`',
              `- Run ID: ${process.env.RELEASE_RUN_ID || 'not-found'}`,
              `- Status: ${process.env.RELEASE_STATUS || 'unknown'}`,
              `- Conclusion: ${process.env.RELEASE_CONCLUSION || 'unknown'}`,
              `- Commit: ${process.env.TARGET_SHA}`,
              `- Run: ${process.env.RELEASE_RUN_URL || 'not-found'}`,
              `- Observed at: ${process.env.OBSERVED_AT || new Date().toISOString()}`,
              '',
              'The guarded release workflow performs the full Windows test/build, immutable artifact upload, latest-metadata-last promotion, public verification and rollback checks. No logs, response bodies, credentials or provider secrets are included here.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 77,
              body,
            });

      - name: Fail if release retry did not succeed
        if: steps.release.outputs.result != 'success'
        shell: bash
        run: exit 1
