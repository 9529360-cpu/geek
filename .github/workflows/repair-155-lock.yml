name: repair-155-lock

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/repair-155-lock.yml'
      - 'package-lock.json'
      - 'package.json'
      - '.github/release-client-version'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'release/155-client-1.2.15'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/155-client-1.2.15
          fetch-depth: 0
      - name: Restore exact master lock and sync app version
        shell: bash
        run: |
          set -euo pipefail
          git show origin/master:package-lock.json > package-lock.json
          node <<'NODE'
          const fs = require('fs');
          const p = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(p, 'utf8'));
          lock.version = '1.2.15';
          if (!lock.packages || !lock.packages['']) throw new Error('missing root package');
          lock.packages[''].version = '1.2.15';
          fs.writeFileSync(p, JSON.stringify(lock, null, 2) + '\n');
          NODE
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (lock.version !== '1.2.15' || lock.packages?.['']?.version !== '1.2.15') process.exit(1);
          NODE
          git diff --check -- package-lock.json
          changed=$(git diff --numstat -- package-lock.json)
          echo "$changed"
          test -n "$changed"
      - name: Commit repaired lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          git diff --cached --check
          git commit -m 'release: sync package lock to 1.2.15 (#155)'
          git push origin HEAD:release/155-client-1.2.15
