# One-shot: prove the hardened dependency graph is fully audit-clean before persisting it.
name: dependency-security-refresh-once

on:
  push:
    branches:
      - chore/dependency-security-2026-09-14
    paths:
      - '.github/workflows/dependency-security-refresh-once.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_BASE_SHA: cf766399253fa93b63bf3e937ce30f3b124fe7a1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          merge_base="$(git merge-base HEAD origin/master)"
          if [ "$merge_base" != "$EXPECTED_BASE_SHA" ]; then
            echo "unexpected base: expected=$EXPECTED_BASE_SHA actual=$merge_base" >&2
            exit 1
          fi

      - name: Apply narrow security overrides
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.overrides = {
            ...(pkg.overrides || {}),
            'deepmerge-ts': '8.0.2',
            '@puppeteer/browsers': '3.2.2',
            mocha: {
              ...(pkg.overrides?.mocha || {}),
              'serialize-javascript': '7.1.1'
            }
          };
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts

      - name: Install exact lockfile
        run: npm ci --ignore-scripts

      - name: Verify resolved security versions
        shell: bash
        run: |
          set -euo pipefail
          npm ls deepmerge-ts @puppeteer/browsers serialize-javascript
          node - <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const expected = new Map([
            ['deepmerge-ts', '8.0.2'],
            ['@puppeteer/browsers', '3.2.2'],
            ['serialize-javascript', '7.1.1']
          ]);
          for (const [name, version] of expected) {
            const suffix = `/node_modules/${name}`;
            const resolved = Object.entries(lock.packages || {})
              .filter(([path]) => path === `node_modules/${name}` || path.endsWith(suffix))
              .map(([path, meta]) => [path, meta.version]);
            if (resolved.length === 0) throw new Error(`${name}: no resolved lockfile entry`);
            const wrong = resolved.filter(([, actual]) => actual !== version);
            if (wrong.length > 0) {
              throw new Error(`${name}: expected only ${version}, got ${JSON.stringify(resolved)}`);
            }
            console.log(`LOCK_${name}=${resolved.map(([path, actual]) => `${path}@${actual}`).join(',')}`);
          }
          NODE

      - name: Audit dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > audit-prod.json || true
          npm audit --json > audit-full.json || true
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [label, file] of [['prod', 'audit-prod.json'], ['full', 'audit-full.json']]) {
            const audit = JSON.parse(fs.readFileSync(file, 'utf8'));
            const packages = Object.keys(audit.vulnerabilities || {}).sort();
            console.log(`AUDIT_${label.toUpperCase()} total=${audit.metadata?.vulnerabilities?.total ?? 'unknown'} packages=${packages.length}`);
            console.log(`AUDIT_${label.toUpperCase()}_PACKAGES=${packages.join(',') || 'none'}`);
            const advisories = new Set();
            for (const item of Object.values(audit.vulnerabilities || {})) {
              for (const via of item.via || []) {
                if (via && typeof via === 'object' && via.url) advisories.add(via.url);
              }
            }
            console.log(`AUDIT_${label.toUpperCase()}_ADVISORIES=${[...advisories].sort().join(',') || 'none'}`);
            if ((audit.metadata?.vulnerabilities?.total ?? 0) !== 0 || packages.length !== 0) {
              throw new Error(`${label} audit is not clean`);
            }
          }
          NODE
          node scripts/dependency-audit-policy.cjs

      - name: Run repository tests
        run: npm test

      - name: Commit verified dependency hardening and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm -f audit-prod.json audit-full.json
          git rm .github/workflows/dependency-security-refresh-once.yml
          git status --short
          unexpected="$(git status --short | awk '{print $2}' | grep -v -E '^(package.json|package-lock.json|.github/workflows/dependency-security-refresh-once.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "unexpected changed files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json
          git commit -m 'chore: harden development dependency graph'
          git push origin HEAD:chore/dependency-security-2026-09-14
