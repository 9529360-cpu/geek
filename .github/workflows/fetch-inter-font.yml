name: fetch-inter-font

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/fetch-inter-font.yml'

permissions:
  contents: write

jobs:
  fetch:
    if: github.event.pull_request.head.ref == 'security/main-ui-csp-local-fonts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/main-ui-csp-local-fonts
          fetch-depth: 0
      - name: Fetch official Inter v4.1 release asset
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl --fail --location --silent --show-error \
            https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip \
            --output "$tmp/Inter-4.1.zip"
          unzip -q "$tmp/Inter-4.1.zip" -d "$tmp/inter"
          test -f "$tmp/inter/web/InterVariable.woff2"
          test -f "$tmp/inter/LICENSE.txt"
          mkdir -p ui/fonts
          cp "$tmp/inter/web/InterVariable.woff2" ui/fonts/InterVariable.woff2
          cp "$tmp/inter/LICENSE.txt" ui/fonts/LICENSE.txt
          sha256sum ui/fonts/InterVariable.woff2 | tee /tmp/inter-sha256.txt
      - name: Commit exact upstream bytes to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          git add ui/fonts/InterVariable.woff2 ui/fonts/LICENSE.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'assets: bundle official Inter v4.1 variable font'
          git push origin HEAD:security/main-ui-csp-local-fonts
