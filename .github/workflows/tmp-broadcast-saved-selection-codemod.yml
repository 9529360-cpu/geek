name: tmp-broadcast-saved-selection-codemod

on:
  push:
    branches:
      - fix/broadcast-saved-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused saved-selection fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'ui/app.js';
          const source = fs.readFileSync(path, 'utf8');
          const startMarker = "  document.getElementById('broadcast-save-group').onclick = async () => {";
          const endMarker = "  function clearBroadcastGroupTagFilter() {";
          const start = source.indexOf(startMarker);
          const end = source.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Saved group handler markers not found');
          const current = source.slice(start, end);
          if (!current.includes("accountStorageSetItem('broadcastGroups', JSON.stringify(next));")) throw new Error('Expected unawaited persistence call missing');
          if (!current.includes("alert(`已保存群组标签")) throw new Error('Expected blocking success alert missing');
          const replacement = `  document.getElementById('broadcast-save-group').onclick = async () => {
    const selectedGroups = broadcastChats.filter(c => broadcastSelected.has(c.id) && c.type === '群组');
    if (!selectedGroups.length) { alert('请先勾选要保存的群组'); return; }
    const name = prompt('给这组群起个标签名：', \`群组标签 \${(currentBroadcastGroupTags()).length + 1}\`);
    const normalizedName = String(name || '').trim();
    if (!normalizedName) return;
    const groups = currentBroadcastGroupTags();
    const old = groups.find(g => g.name === normalizedName);
    const tag = { id: old ? old.id : 'bg' + Date.now(), name: normalizedName, chatIds: selectedGroups.map(c => c.id), createdAt: old?.createdAt || Date.now(), updatedAt: Date.now() };
    const next = old ? groups.map(g => g.id === old.id ? tag : g) : [...groups, tag];
    const saveButton = document.getElementById('broadcast-save-group');
    const defaultLabel = saveButton?.textContent || '保存当前选择';
    if (saveButton) { saveButton.disabled = true; saveButton.textContent = '正在保存…'; }
    const saved = await accountStorageSetItem('broadcastGroups', JSON.stringify(next));
    if (saved === false) {
      if (saveButton) {
        saveButton.disabled = false;
        saveButton.textContent = '保存失败，请重试';
        setTimeout(() => { if (saveButton.isConnected && saveButton.textContent === '保存失败，请重试') saveButton.textContent = defaultLabel; }, 1800);
      }
      return;
    }
    broadcastSavedFilter = new Set(tag.chatIds);
    renderSavedGroups();
    const savedGroups = document.getElementById('broadcast-saved-groups');
    if (savedGroups) savedGroups.value = tag.id;
    renderSavedGroups();
    renderBroadcastList();
    if (saveButton) {
      saveButton.disabled = false;
      saveButton.textContent = \`已保存 · \${tag.chatIds.length} 个群\`;
      setTimeout(() => { if (saveButton.isConnected && saveButton.textContent.startsWith('已保存 ·')) saveButton.textContent = defaultLabel; }, 1800);
    }
  };
`;
          const nextSource = source.slice(0, start) + replacement + source.slice(end);
          fs.writeFileSync(path, nextSource, 'utf8');
          NODE
          node --check ui/app.js
          git diff --check -- ui/app.js
      - name: Commit focused source fix
        shell: bash
        run: |
          if git diff --quiet -- ui/app.js; then
            echo "No source diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/app.js
          git commit -m "fix: persist and apply saved broadcast selection"
          git push origin HEAD:fix/broadcast-saved-selection
