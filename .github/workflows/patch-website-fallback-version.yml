name: temporary website fallback version patch

on:
  pull_request:
    branches:
      - master
    paths:
      - scripts/geek-website-worker.js
      - test/website-fallback-version-contract.cjs
      - .github/workflows/patch-website-fallback-version.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'agent/sync-website-fallback-version'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: agent/sync-website-fallback-version
          fetch-depth: 0

      - name: Apply exact website fallback version patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('scripts/geek-website-worker.js')
          source = path.read_text(encoding='utf-8')
          old = "const FALLBACK_VERSION = '1.2.4';"
          new = "const FALLBACK_VERSION = '1.2.8';"
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one fallback version anchor, found {count}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify patch scope before tests
        run: |
          git diff --check
          git diff -- scripts/geek-website-worker.js
          test "$(git diff --numstat -- scripts/geek-website-worker.js | awk '{print $1 ":" $2}')" = "1:1"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run complete contract suite
        run: npm test

      - name: Commit exact patch and remove temporary workflow
        run: |
          rm .github/workflows/patch-website-fallback-version.yml
          git add scripts/geek-website-worker.js .github/workflows/patch-website-fallback-version.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: sync website fallback version"
          git push origin HEAD:agent/sync-website-fallback-version
