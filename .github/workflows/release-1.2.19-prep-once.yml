name: release-1.2.19-prep-once

on:
  push:
    branches:
      - release/client-1.2.19
    paths:
      - '.github/workflows/release-1.2.19-prep-once.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/client-1.2.19

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Synchronize release version
        run: |
          npm version 1.2.19 --no-git-tag-version
          printf '1.2.19\n' > .github/release-client-version
          node -e "const fs=require('fs'); const p='scripts/geek-website-worker.js'; let s=fs.readFileSync(p,'utf8'); const old=\"const FALLBACK_VERSION = '1.2.17';\"; const next=\"const FALLBACK_VERSION = '1.2.18';\"; if (!s.includes(old)) throw new Error('unexpected website fallback version'); s=s.replace(old,next); fs.writeFileSync(p,s);"

      - name: Verify release candidate metadata and tests
        run: |
          npm test
          git diff --check
          node -e "const fs=require('fs'); const p=require('./package.json'); const l=require('./package-lock.json'); const m=fs.readFileSync('.github/release-client-version','utf8').trim(); if(p.version!=='1.2.19'||l.version!=='1.2.19'||l.packages?.['']?.version!=='1.2.19'||m!=='1.2.19') process.exit(1);"

      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/release-1.2.19-prep-once.yml
          git config user.name 'Geek Release Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json .github/release-client-version scripts/geek-website-worker.js
          git commit -m 'release: prepare Geek 1.2.19'
          git push origin HEAD:release/client-1.2.19
