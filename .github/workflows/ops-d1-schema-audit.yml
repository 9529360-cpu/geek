name: audit-translation-d1-schema

on:
  push:
    branches:
      - ops/539-d1-schema-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify current Cloudflare control-plane access
        shell: bash
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_INFRA_SUMMARY_PATH: infra-smoke-summary.md
        run: node scripts/cloudflare-infra-smoke.mjs

      - name: Audit production D1 schema and migration baseline only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          WRANGLER='npx --yes wrangler@4.36.0'
          DB='geek-subscriptions'
          CONFIG='wrangler-translate.toml'

          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "PRAGMA table_info(d1_migrations)"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id"

          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "PRAGMA table_info(users)"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT name, type FROM sqlite_schema WHERE name IN ('password_reset_requests','idx_password_resets_status_created','idx_password_resets_token','idx_users_account_no') ORDER BY name"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT COUNT(*) AS users_total, SUM(CASE WHEN account_no IS NULL THEN 1 ELSE 0 END) AS missing_account_no, SUM(CASE WHEN account_no IS NOT NULL AND (length(account_no) != 35 OR substr(account_no, 1, 3) != 'GK-' OR substr(account_no, 4) GLOB '*[^0-9a-f]*') THEN 1 ELSE 0 END) AS malformed_account_no FROM users"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT COUNT(*) AS duplicate_account_no_groups FROM (SELECT account_no FROM users WHERE account_no IS NOT NULL GROUP BY account_no HAVING COUNT(*) > 1)"

          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "PRAGMA table_info(translation_usage)"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT name, type FROM sqlite_schema WHERE name IN ('idx_translation_usage_lease','trg_translation_usage_reservation_lease','idx_translation_usage_replay_expiry') ORDER BY name"
          $WRANGLER d1 execute "$DB" --remote --config "$CONFIG" --command "SELECT COUNT(*) AS stale_reservations, COALESCE(MAX(CAST((julianday('now') - julianday(created_at)) * 86400 AS INTEGER)), 0) AS oldest_age_seconds, COALESCE(SUM(reserved_chars), 0) AS reserved_chars_total FROM translation_usage WHERE (status = 'reserved' OR status LIKE 'reserved:%') AND datetime(created_at, '+2 minutes') <= datetime('now')"
