name: audit-translation-d1-schema

on:
  push:
    branches:
      - ops/539-d1-schema-audit-20260916

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify current Cloudflare control-plane access
        shell: bash
        env:
          CLOUDFLARE_INFRA_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_INFRA_SUMMARY_PATH: infra-smoke-summary.md
        run: node scripts/cloudflare-infra-smoke.mjs

      - name: Audit production D1 schema and stale aggregate only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --config wrangler-translate.toml --command "PRAGMA table_info(translation_usage)"
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --config wrangler-translate.toml --command "SELECT name, type FROM sqlite_schema WHERE name IN ('idx_translation_usage_lease','trg_translation_usage_reservation_lease') ORDER BY name"
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --config wrangler-translate.toml --command "SELECT name FROM d1_migrations ORDER BY id"
          npx --yes wrangler@4.36.0 d1 execute geek-subscriptions --remote --config wrangler-translate.toml --command "SELECT COUNT(*) AS stale_reservations, COALESCE(MAX(CAST((julianday('now') - julianday(created_at)) * 86400 AS INTEGER)), 0) AS oldest_age_seconds, COALESCE(SUM(reserved_chars), 0) AS reserved_chars_total FROM translation_usage WHERE (status = 'reserved' OR status LIKE 'reserved:%') AND datetime(created_at, '+2 minutes') <= datetime('now')"
