name: fh04-branch-integrate

on:
  push:
    branches:
      - foundation/fh-04-translation-runtime-owner
    paths:
      - scripts/fh04-integrate-translation-runtime.cjs
      - .github/workflows/fh04-branch-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: foundation/fh-04-translation-runtime-owner
          fetch-depth: 0
      - name: Apply deterministic Translation Runtime extraction
        run: node scripts/fh04-integrate-translation-runtime.cjs
      - name: Validate syntax and focused ownership contracts
        run: |
          node --check src/main.cjs
          node --check src/translation-runtime.cjs
          node test/gateway-failover-integration-contract.cjs
          node test/account-state-production-ownership-contract.cjs
          git diff --check
      - name: Commit integrated source and remove branch-only tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.cjs test/gateway-failover-integration-contract.cjs test/account-state-production-ownership-contract.cjs
          git rm scripts/fh04-integrate-translation-runtime.cjs .github/workflows/fh04-branch-integrate.yml
          git commit -m "refactor: extract translation runtime owner"
          git push origin HEAD:foundation/fh-04-translation-runtime-owner
