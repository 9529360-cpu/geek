[[permission]]
identifier = "shell-commands"
description = "Narrow account lifecycle/settings API; no filesystem, shell, eval or arbitrary navigation access."
commands.allow = [
  "desktop_window",
  "desktop_snapshot",
  "account_create",
  "account_create_batch",
  "account_set_proxy",
  "account_activate",
  "account_close",
  "account_reload",
  "desktop_layout",
  "account_rename",
  "account_update_display",
  "account_move",
  "account_set_archived",
  "desktop_settings",
  "broadcast_catalog",
  "broadcast_pick_attachments",
  "broadcast_release_attachments",
  "broadcast_import_contacts",
  "broadcast_resolve_recipients",
  "broadcast_resolve_audience",
  "broadcast_presets",
  "broadcast_save_message",
  "broadcast_save_audience",
  "broadcast_delete_preset",
  "broadcast_restore_audience",
  "broadcast_export_failures",
  "broadcast_create",
  "broadcast_snapshot",
  "broadcast_control",
  "session_snapshot",
  "session_login",
  "session_refresh",
  "session_logout",
  "translation_context",
  "account_update_translation"
]
